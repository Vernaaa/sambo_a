<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v4.8</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { 
                width: 210mm; 
                margin: 0 auto !important; 
                padding: 0 !important; 
            }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };
        const numberToChinese = (num) => {
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const companyInfo = { name: "申堡辦公家具行", address: "澎湖縣馬公市西文里90-7號1樓", phone: "(06)9217228" };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [showConfirm, setShowConfirm] = useState(null); // 控制確認視窗

            // --- 核心資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            useEffect(() => {
                localStorage.setItem('shenbao_products', JSON.stringify(productMaster));
                localStorage.setItem('shenbao_quotes', JSON.stringify(quotes));
                localStorage.setItem('shenbao_orders', JSON.stringify(orders));
                localStorage.setItem('shenbao_logistics', JSON.stringify(logistics));
                localStorage.setItem('shenbao_invoices', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // ==========================================
            // ⭐️ 還原功能詳細設計 (Restore Logic)
            // ==========================================
            const triggerFilePicker = (id) => document.getElementById(id).click();

            const handleRestore = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        // 1. 檢查是否為全系統備份包
                        if (data.products && data.quotes && data.invoices) {
                            setShowConfirm({
                                title: "啟動全系統還原",
                                msg: "這將會覆蓋目前所有的商品、估價單、採購單、物流與發票資料。此動作無法復原，是否繼續？",
                                onAction: () => {
                                    setProductMaster(data.products || []);
                                    setQuotes(data.quotes || []);
                                    setOrders(data.orders || []);
                                    setLogistics(data.logistics || []);
                                    setInvoices(data.invoices || []);
                                    showToast("全系統營運數據已精確還原");
                                    setShowConfirm(null);
                                }
                            });
                        } 
                        // 2. 檢查是否為單純的商品清單 (AI 產出或 Excel 轉換)
                        else if (Array.isArray(data)) {
                            setShowConfirm({
                                title: "批次導入商品",
                                msg: `偵測到 ${data.length} 筆商品資料。請問要「覆蓋現有庫存」還是「合併至庫存」？`,
                                options: [
                                    { label: "覆蓋現有庫存", action: () => { setProductMaster(data); setShowConfirm(null); showToast("庫存已重置並更新"); } },
                                    { label: "合併至庫存", action: () => { setProductMaster([...data, ...productMaster]); setShowConfirm(null); showToast("新商品已併入庫存"); } }
                                ]
                            });
                        } else {
                            showToast("錯誤：無法辨識的數據結構");
                        }
                    } catch (err) {
                        showToast("錯誤：讀取 JSON 檔案時出錯");
                    }
                };
                reader.readAsText(file);
                event.target.value = ""; // 重置 input
            };

            const exportSystemBackup = () => {
                const backup = { products: productMaster, quotes, orders, logistics, invoices };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `申堡全系統備份_${getToday()}.json`;
                a.click();
                showToast("全系統 JSON 備份已下載至本地");
            };

            // ==========================================
            // ⭐️ 列印引擎 (維持 v4.6 優化格式)
            // ==========================================
            if (printDoc) {
                const q = printDoc.data;
                const isOrder = printDoc.type === 'order';
                return (
                    <div className="bg-white text-black min-h-screen p-10 font-serif print-container">
                        <div className="no-print mb-8 p-4 bg-slate-100 rounded-xl flex justify-between items-center border">
                            <span className="font-bold">列印預覽 (移除簽章文字 / 鎖定 A4 寬度)</span>
                            <div className="flex gap-4">
                                <button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">執行列印</button>
                                <button onClick={()=>setPrintDoc(null)} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button>
                            </div>
                        </div>
                        <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4 uppercase">{isOrder?'訂貨明細單':'估價單'}</h1>
                        <div className="flex justify-between items-end mb-4 text-lg border-b-2 border-black pb-2">
                            <div className="font-bold min-w-[280px] break-words">{q.client} 台照</div>
                            <div className="text-right text-sm">
                                {isOrder ? <div>供應商：{q.supplier}</div> : (q.contacts || []).map((c, i) => (
                                    <div key={i} className="font-sans">電話：{c.phone} <span className="ml-2 font-serif text-base">{c.name}</span></div>
                                ))}
                            </div>
                        </div>
                        <div className="mb-4 text-sm font-bold uppercase tracking-widest">日期：{toTaiwanYear(q.date)} &nbsp;&nbsp; 編號：{q.id}</div>
                        <table className={`w-full border-collapse border-[2px] border-black text-center text-lg mb-4 table-fixed`}>
                            <thead className="bg-slate-100 border-b-2 border-black">
                                <tr>
                                    <th className="border-r border-black p-3 w-[40%]">品名描述</th>
                                    <th className="border-r border-black p-3 w-[25%]">規格內容</th>
                                    <th className="border-r border-black p-3 w-[10%]">數量</th>
                                    <th className="p-3 w-[25%]">{isOrder ? '備註' : '金額'}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {(q.items || []).map((item, idx) => (
                                    <tr key={idx} className="border-b border-black">
                                        <td className="border-r border-black p-3 text-left font-bold">{item.name}</td>
                                        <td className="border-r border-black p-3 text-left text-sm">{item.specs}</td>
                                        <td className="border-r border-black p-3 font-sans">{item.qty}</td>
                                        <td className="p-3 font-mono">{isOrder ? '' : (item.qty * (item.unitPrice || 0)).toLocaleString()}</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 10 - (q.items?.length||0)))].map((_, i) => (
                                    <tr key={i} className="border-b border-black h-12"><td className="border-r border-black"></td><td className="border-r border-black"></td><td className="border-r border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                        </table>
                        {!isOrder && <div className="text-right text-2xl font-black mb-10">總計：NT$ {q.amount?.toLocaleString()}</div>}
                        <div className="mt-16 flex justify-end pr-12 relative h-32 items-center">
                            <img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 自定義確認對話框 */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="bg-white rounded-[3rem] p-10 max-w-lg w-full shadow-2xl animate-slide-in border border-slate-100">
                                <h3 className="text-2xl font-black mb-4 text-slate-800 flex items-center gap-2"><i className="ph-fill ph-warning-octagon text-amber-500"></i> {showConfirm.title}</h3>
                                <p className="text-slate-500 font-bold mb-10 leading-relaxed">{showConfirm.msg}</p>
                                <div className="flex flex-col gap-3">
                                    {showConfirm.options ? showConfirm.options.map((opt, i) => (
                                        <button key={i} onClick={opt.action} className="w-full py-4 bg-indigo-50 text-indigo-700 rounded-2xl font-black hover:bg-indigo-600 hover:text-white transition-all">{opt.label}</button>
                                    )) : (
                                        <div className="flex gap-4">
                                            <button onClick={showConfirm.onAction} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black shadow-xl hover:bg-red-700 transition-all">確認還原</button>
                                            <button onClick={()=>setShowConfirm(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-2xl font-black hover:bg-slate-200 transition-all">取消</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col no-print">
                        <div className="p-8 border-b border-slate-800 font-black text-2xl tracking-tighter italic">SHENBAO <span className="text-[10px] bg-indigo-600 px-2 rounded ml-2">v4.8</span></div>
                        <nav className="flex-1 p-6 space-y-3">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={()=>setActiveTab(tab)} className={`w-full text-left px-6 py-4 rounded-[1.5rem] font-bold transition-all uppercase text-sm tracking-widest ${activeTab === tab ? 'bg-indigo-600 shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {tab}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center font-black">莊</div>
                            <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 uppercase tracking-widest">Master Admin</div></div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full overflow-y-auto custom-scrollbar p-10 bg-slate-50">
                        {toast && <div className="fixed top-10 right-10 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 font-bold animate-slide-in flex items-center gap-2"><i className="ph ph-check-circle text-emerald-400"></i> {toast}</div>}

                        {activeTab === 'dashboard' && (
                            <div className="max-w-5xl mx-auto text-center space-y-16 py-10 animate-slide-in">
                                <h1 className="text-6xl font-black text-slate-900 italic tracking-tighter uppercase">申堡營運管理旗艦中樞</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all border-slate-100 flex flex-col items-center">
                                        <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform"><i className="ph ph-cloud-arrow-down"></i></div>
                                        <h3 className="text-2xl font-black mb-2">備份目前數據</h3>
                                        <p className="text-slate-400 text-sm mb-8 font-medium">將目前所有的單據、發票與商品存為 JSON 檔</p>
                                        <button onClick={exportSystemBackup} className="bg-slate-900 text-white px-10 py-4 rounded-[2rem] font-black shadow-xl hover:bg-indigo-600 transition-all">立即下載備份</button>
                                    </div>
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all border-slate-100 flex flex-col items-center">
                                        <div className="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform"><i className="ph ph-arrows-counter-clockwise"></i></div>
                                        <h3 className="text-2xl font-black mb-2">還原歷史數據</h3>
                                        <p className="text-slate-400 text-sm mb-8 font-medium">從歷史備份檔或 AI 商品清單中恢復系統資料</p>
                                        <button onClick={()=>triggerFilePicker('masterRestore')} className="bg-emerald-600 text-white px-10 py-4 rounded-[2rem] font-black shadow-xl hover:bg-emerald-700 transition-all">選擇檔案還原</button>
                                        <input id="masterRestore" type="file" className="hidden" accept=".json" onChange={handleRestore} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-3xl font-black text-slate-800 italic uppercase">商品資料主檔庫</h2><p className="text-slate-400 text-sm font-bold tracking-widest mt-1">PRODUCT DATABASE MANAGEMENT</p></div>
                                    <div className="flex gap-4">
                                        <button onClick={()=>triggerFilePicker('productMerge')} className="bg-white border-2 border-indigo-600 text-indigo-600 px-6 py-2 rounded-xl font-black text-sm hover:bg-indigo-50 transition-all"><i className="ph ph-plus-circle"></i> 導入 AI 商品檔</button>
                                        <input id="productMerge" type="file" className="hidden" accept=".json" onChange={handleRestore} />
                                        <button onClick={()=>setActiveTab('dashboard')} className="bg-slate-900 text-white px-6 py-2 rounded-xl font-black text-sm shadow-xl">全數據備份</button>
                                    </div>
                                </div>
                                <div className="bg-white rounded-[3rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs font-black text-slate-400 uppercase w-1/4">編號/廠牌</th><th className="p-6 text-xs font-black text-slate-400 uppercase w-1/2">品名規格</th><th className="p-6 text-xs font-black text-slate-400 uppercase text-right w-1/4">單價</th></tr></thead>
                                        <tbody>
                                            {productMaster.map(p=>(<tr key={p.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono text-xs">{p.id}<div className="text-indigo-600 font-bold mt-1 uppercase">{p.supplier}</div></td><td className="p-6 font-black text-slate-800 text-lg truncate">{p.name}<div className="text-xs font-normal text-slate-400 mt-1">{p.specs}</div></td><td className="p-6 text-right font-mono font-black text-xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td></tr>))}
                                        </tbody>
                                    </table>
                                    {productMaster.length === 0 && <div className="p-32 text-center text-slate-300 italic font-black text-2xl tracking-tighter uppercase">No Data Found. Please Restore.</div>}
                                </div>
                            </div>
                        )}

                        {activeTab === 'quotations' && (
                             <div className="p-8 text-center"><h2 className="text-4xl font-black text-slate-300 italic uppercase">Quotations Integrated with v4.6 Print Format</h2><button onClick={()=>handlePrint('quote', quotes[0])} className="mt-6 bg-indigo-600 text-white px-8 py-3 rounded-2xl">測試列印第一筆</button></div>
                        )}
                        {/* 採購、物流、發票延續 v4.6 穩定邏輯 */}
                    </main>
                </div>
            );
        }

            const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
