<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v4.4</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { 
                width: 210mm; /* A4 Standard Width */
                max-width: 100%; 
                padding: 0 !important; 
                margin: 0 auto !important; 
                box-shadow: none !important; 
                border: none !important; 
                overflow: visible !important;
            }
            table { 
                width: 100% !important; 
                table-layout: fixed !important; 
                border-collapse: collapse !important;
                page-break-inside: auto;
            }
            tr { page-break-inside: avoid; page-break-after: auto; }
            td, th { word-wrap: break-word !important; overflow-wrap: break-word !important; }
            .page-break { page-break-after: always; }
            @page { margin: 15mm; size: A4 portrait; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            let numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const fileInputRef = useRef(null);

            // --- 資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            useEffect(() => {
                localStorage.setItem('shenbao_products', JSON.stringify(productMaster));
                localStorage.setItem('shenbao_quotes', JSON.stringify(quotes));
                localStorage.setItem('shenbao_orders', JSON.stringify(orders));
                localStorage.setItem('shenbao_logistics', JSON.stringify(logistics));
                localStorage.setItem('shenbao_invoices', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handlePrint = (type, data) => { setPrintDoc({ type, data }); setTimeout(() => window.print(), 300); };

            // --- 數據備份與還原工具 ---
            const exportData = (data, fileName) => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileName}_${getToday()}.json`;
                a.click();
                showToast(`${fileName} 數據已匯出`);
            };

            const importData = (event, setter, name) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (Array.isArray(json)) {
                            setter(json);
                            showToast(`${name} 數據還原成功`);
                        } else {
                            showToast("無效的檔案格式，請確認備份檔正確性");
                        }
                    } catch (err) {
                        showToast("檔案讀取出錯");
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; // Reset input
            };

            // --- 其他狀態 ---
            const [productView, setProductView] = useState('list');
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            const [isIdLocked, setIsIdLocked] = useState(true);

            const [quoteView, setQuoteView] = useState('list');
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', contacts: [{ name: '', phone: '' }], date: getToday(), items: [] });
            const [quoteSearch, setQuoteSearch] = useState('');
            const [customSpec, setCustomSpec] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [qty, setQty] = useState(1);
            const [showDropdown, setShowDropdown] = useState(false);

            const [invoiceView, setInvoiceView] = useState('list');
            const [editingInvoiceId, setEditingInvoiceId] = useState(null);
            const [newInvoiceData, setNewInvoiceData] = useState({ invNo: '', type: '三聯式', transactionType: '銷項', taxType: 'taxable', date: getToday(), client: '', taxId: '', items: [], netAmount: 0, tax: 0, total: 0, status: '未付款' });

            const [logisticsView, setLogisticsView] = useState('list');
            const [tempLogisticsData, setTempLogisticsData] = useState({ id: '', client: '', refPo: '', items: [], status: '待進貨' });

            // ==========================================
            // 報表列印引擎 (防裁切強化)
            // ==========================================
            if (printDoc) {
                const closePrint = () => setPrintDoc(null);
                
                if (printDoc.type === 'quote') {
                    const q = printDoc.data;
                    const qTotal = (q.amount || 0);
                    const totalRows = 12;
                    const itemsCount = q.items?.length || 0;
                    const emptyRows = Math.max(0, totalRows - itemsCount);

                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container">
                            <div className="no-print mb-8 p-4 bg-indigo-50 rounded-xl flex justify-between items-center border border-indigo-200">
                                <span className="font-bold text-indigo-800 tracking-tighter">估價單預覽：表格已鎖定寬度以防止裁切</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold shadow">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4 uppercase">估價單</h1>
                            <div className="flex justify-between items-end mb-4 text-lg border-b border-black pb-2">
                                <div className="font-bold min-w-[280px] break-words">{q.client} 台照</div>
                                <div className="text-right space-y-1">
                                    {(q.contacts || []).map((c, i) => (
                                        <div key={i} className="text-sm font-sans tracking-tight">電話：{c.phone} <span className="ml-2 font-serif text-base">{c.name}</span></div>
                                    ))}
                                </div>
                            </div>
                            <div className="mb-4 text-lg font-bold">中華民國 <span className="mx-2 font-sans">{toTaiwanYear(q.date)}</span></div>
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4 table-fixed">
                                <thead className="bg-slate-100">
                                    <tr>
                                        <th className="border border-black p-3 w-[35%]">品名描述</th>
                                        <th className="border border-black p-3 w-[25%]">規格內容</th>
                                        <th className="border border-black p-3 w-[8%]">數量</th>
                                        <th className="border border-black p-3 w-[12%]">單價</th>
                                        <th className="border border-black p-3 w-[15%]">金額</th>
                                        <th className="border border-black p-3 w-[5%]">序</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-3 text-left font-bold break-words">{item.name}</td>
                                            <td className="border border-black p-3 text-left text-sm break-words">{item.specs}</td>
                                            <td className="border border-black p-3">{item.qty}</td>
                                            <td className="border border-black p-3 font-mono">{(item.unitPrice || 0).toLocaleString()}</td>
                                            <td className="border border-black p-3 font-mono">{(item.qty * item.unitPrice).toLocaleString()}</td>
                                            <td className="border border-black p-3 text-[10px] text-slate-400">{idx+1}</td>
                                        </tr>
                                    ))}
                                    {[...Array(emptyRows)].map((_, i) => (
                                        <tr key={`empty-${i}`}><td className="border border-black p-5 text-left">{i === 0 && itemsCount < totalRows ? '以下空白' : ''}</td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td></tr>
                                    ))}
                                    <tr className="bg-slate-50 font-bold"><td colSpan="4" className="border border-black p-3 text-left tracking-widest uppercase">總額新台幣 &nbsp;&nbsp; {numberToChinese(qTotal).split('').join(' ')}</td><td colSpan="2" className="border border-black p-3 text-left font-mono text-xl">NT$ {qTotal.toLocaleString()}</td></tr>
                                </tbody>
                            </table>
                            <div className="mt-8 flex justify-end pr-12 relative"><div className="text-center font-bold text-sm mr-4 mt-12">申堡辦公家具行<br/>負責人簽章</div><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} /></div>
                        </div>
                    );
                } else if (printDoc.type === 'order') {
                    const o = printDoc.data;
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-sans print-container">
                            <div className="no-print mb-8 p-4 bg-amber-50 rounded-xl flex justify-between items-center border border-amber-200">
                                <span className="font-bold text-amber-800 tracking-tighter">訂貨單預覽：已優化防止裁切</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold shadow">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <div className="flex justify-between items-start mb-6 border-b-2 border-black pb-6">
                                <div className="space-y-1"><h2 className="text-2xl font-black">{companyInfo.name}</h2><p>統編: {companyInfo.taxId}</p><p>店址: {companyInfo.address}</p><p>電話: {companyInfo.phone}</p></div>
                                <div className="text-right"><h1 className="text-4xl font-black tracking-widest mb-6 uppercase">訂貨明細單</h1><p>訂單編號: {o.id}</p><p>日期: {toTaiwanYear(o.date)}</p></div>
                            </div>
                            <div className="bg-slate-100 p-4 border border-black mb-6 font-bold text-lg">採購對象：{o.supplier}</div>
                            <table className="w-full border-collapse border border-black text-center text-lg table-fixed">
                                <thead className="bg-slate-200"><tr><th className="border border-black p-3 w-[10%]">序</th><th className="border border-black p-3 w-[40%]">品名</th><th className="border border-black p-3 w-[30%]">規格</th><th className="border border-black p-3 w-[10%]">數量</th><th className="border border-black p-3 w-[10%]">備註</th></tr></thead>
                                <tbody>
                                    {(o.items || []).map((item, idx) => (
                                        <tr key={idx}><td className="border border-black p-4 font-mono">{idx+1}</td><td className="border border-black p-4 text-left font-bold break-words">{item.name}</td><td className="border border-black p-4 text-sm break-words">{item.specs}</td><td className="border border-black p-4 font-bold">{item.qty}</td><td className="border border-black p-4 text-xs">{o.customRemark ? '★' : ''}</td></tr>
                                    ))}
                                    {[...Array(5)].map((_, i) => (<tr key={i}><td className="border border-black p-6" colSpan="5"></td></tr>))}
                                </tbody>
                            </table>
                            <div className="mt-16 flex justify-end pr-12 relative">負責人簽章：<img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} /></div>
                        </div>
                    );
                }
            }

            // ==========================================
            // ⭐️ 商品主檔管理 (支援匯出匯入)
            // ==========================================
            const renderProductView = () => {
                if (productView === 'create') {
                    return (
                        <div className="max-w-3xl mx-auto bg-white p-10 rounded-[3rem] shadow-sm border border-slate-200 animate-slide-in">
                            <h2 className="text-2xl font-black mb-8">{editingProductId ? '修改商品資料' : '全新商品建檔'}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div className="md:col-span-1"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">商品 ID</label><div className="flex gap-2"><input type="text" value={newProductData.id} onChange={(e)=>setNewProductData({...newProductData, id: e.target.value})} className={`flex-1 px-4 py-3 border rounded-xl font-mono ${isIdLocked ? 'bg-slate-50' : 'bg-white'}`} disabled={isIdLocked}/><button onClick={()=>setIsIdLocked(!isIdLocked)} className="px-3 bg-slate-100 rounded-xl text-xs font-bold">{isIdLocked ? '解鎖' : '手動'}</button></div></div>
                                <div className="md:col-span-1"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">品牌供應商</label><input type="text" value={newProductData.supplier} onChange={(e)=>setNewProductData({...newProductData, supplier: e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                <div className="md:col-span-2"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">品名</label><input type="text" value={newProductData.name} onChange={(e)=>setNewProductData({...newProductData, name: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-black text-lg" /></div>
                                <div><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">規格說明</label><input type="text" value={newProductData.specs} onChange={(e)=>setNewProductData({...newProductData, specs: e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                <div><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">單價 (未稅預設)</label><input type="number" value={newProductData.unitPrice} onChange={(e)=>setNewProductData({...newProductData, unitPrice: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-mono text-right" /></div>
                            </div>
                            <div className="mt-12 flex gap-4">
                                <button onClick={()=>{
                                    if(!newProductData.name) return showToast("品名必填");
                                    if(editingProductId) setProductMaster(productMaster.map(p => p.id === editingProductId ? newProductData : p));
                                    else setProductMaster([{...newProductData, id: newProductData.id || `SKU-${Date.now().toString().slice(-5)}`}, ...productMaster]);
                                    setProductView('list'); setEditingProductId(null); showToast("存檔完成");
                                }} className="flex-1 bg-indigo-600 text-white py-5 rounded-[2rem] font-black shadow-xl">儲存變更</button>
                                <button onClick={()=>setProductView('list')} className="px-10 bg-slate-100 py-5 rounded-[2rem] font-bold">取消</button>
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black tracking-widest text-slate-800 italic uppercase">商品資料主檔資料庫</h2>
                            <div className="flex gap-4">
                                <div className="flex bg-slate-200/50 p-1 rounded-2xl">
                                    <button onClick={()=>exportData(productMaster, "商品資料庫")} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-indigo-600"><i className="ph ph-export"></i> 匯出 JSON</button>
                                    <button onClick={()=>fileInputRef.current.click()} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-emerald-600"><i className="ph ph-import"></i> 還原資料</button>
                                    <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={(e)=>importData(e, setProductMaster, "商品資料庫")} />
                                </div>
                                <button onClick={()=>{setProductView('create'); setEditingProductId(null); setIsIdLocked(false); setNewProductData({id:'', supplier:'', name:'', specs:'', unitPrice:0})}} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg">+ 新增商品</button>
                            </div>
                        </div>
                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                            <table className="w-full text-left table-fixed">
                                <thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs text-slate-400 font-black w-[20%]">編號/供應商</th><th className="p-6 text-xs text-slate-400 font-black w-[50%]">品名規格</th><th className="p-6 text-xs text-slate-400 font-black text-right w-[15%]">單價</th><th className="p-6 text-xs text-slate-400 font-black text-center w-[15%]">操作</th></tr></thead>
                                <tbody>
                                    {productMaster.map(p => (<tr key={p.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono text-sm">{p.id}<div className="font-bold text-indigo-600 mt-1">{p.supplier || '未指定'}</div></td><td className="p-6 font-bold text-slate-800 text-lg break-words">{p.name}<div className="text-sm font-normal text-slate-500 mt-1">{p.specs}</div></td><td className="p-6 text-right font-black text-emerald-600 font-mono text-lg">${(p.unitPrice||0).toLocaleString()}</td><td className="p-6 text-center"><button onClick={()=>{setEditingProductId(p.id); setNewProductData(p); setProductView('create')}} className="bg-slate-100 px-4 py-2 rounded-xl text-sm font-bold">編輯</button></td></tr>))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // ⭐️ 財務發票系統 (支援匯出匯入)
            // ==========================================
            const renderInvoiceView = () => {
                if (invoiceView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-5xl mx-auto">
                            <div className="flex justify-between items-center mb-8"><h2 className="text-2xl font-black">發票帳務錄入</h2><button onClick={() => setInvoiceView('list')} className="bg-white border px-6 py-2 rounded-xl shadow-sm font-bold">返回</button></div>
                            <div className="bg-white rounded-[3rem] p-10 shadow-sm border border-slate-100">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase">發票號碼</label><input type="text" value={newInvoiceData.invNo} onChange={(e)=>setNewInvoiceData({...newInvoiceData, invNo: e.target.value.toUpperCase()})} className="w-full px-5 py-4 rounded-2xl border font-mono text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400">日期</label><input type="date" value={newInvoiceData.date} onChange={(e)=>setNewInvoiceData({...newInvoiceData, date: e.target.value})} className="w-full px-5 py-4 rounded-2xl border" /></div>
                                    <div className="md:col-span-1 space-y-1"><label className="text-[10px] font-black text-slate-400">對象</label><input type="text" value={newInvoiceData.client} onChange={(e)=>setNewInvoiceData({...newInvoiceData, client: e.target.value})} className="w-full px-5 py-4 rounded-2xl border font-bold" /></div>
                                </div>
                                <div className={`p-8 rounded-[3rem] text-white ${newInvoiceData.transactionType==='進項'?'bg-red-900':'bg-indigo-900'}`}>
                                    <div className="text-right"><div className="text-[10px] opacity-50 uppercase tracking-widest">總計金額</div><div className="text-5xl font-black font-mono text-emerald-400">${newInvoiceData.total.toLocaleString()}</div></div>
                                </div>
                                <button onClick={()=>{
                                    if(editingInvoiceId) setInvoices(invoices.map(i => i.id === editingInvoiceId ? newInvoiceData : i));
                                    else setInvoices([{...newInvoiceData, id: generateId()}, ...invoices]);
                                    setInvoiceView('list'); showToast("帳務已存檔");
                                }} className="w-full mt-10 bg-indigo-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-xl">確認儲存發票資料</button>
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-3xl font-black text-slate-800 italic uppercase">財務發票帳務管理</h2>
                            <div className="flex gap-4">
                                <div className="flex bg-slate-200/50 p-1 rounded-2xl">
                                    <button onClick={()=>exportData(invoices, "發票資料庫")} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-indigo-600"><i className="ph ph-export"></i> 匯出</button>
                                    <button onClick={()=>fileInputRef.current.click()} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-emerald-600"><i className="ph ph-import"></i> 還原</button>
                                    <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={(e)=>importData(e, setInvoices, "發票資料庫")} />
                                </div>
                                <button onClick={()=>{setInvoiceView('create'); setEditingInvoiceId(null); setNewInvoiceData({invNo:'', type:'三聯式', transactionType:'銷項', taxType:'taxable', date:getToday(), client:'', taxId:'', items:[], netAmount:0, tax:0, total:0, status:'未付款'})}} className="bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl">+ 錄入發票</button>
                            </div>
                        </div>
                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                            <table className="w-full text-left table-fixed">
                                <thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs text-slate-400 font-black w-[20%]">單號/日期</th><th className="p-6 text-xs text-slate-400 font-black w-[45%]">對象</th><th className="p-6 text-xs text-slate-400 font-black text-right w-[15%]">總額</th><th className="p-6 text-xs text-slate-400 font-black text-center w-[10%]">狀態</th><th className="p-6 text-xs text-slate-400 font-black text-center w-[10%]">操作</th></tr></thead>
                                <tbody>{invoices.map(inv => (<tr key={inv.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono font-bold">{inv.invNo}<div className="text-[10px] text-slate-400 font-normal">{inv.date}</div></td><td className="p-6 font-bold text-slate-800 text-lg truncate">{inv.client}</td><td className={`p-6 text-right font-black font-mono text-lg ${inv.transactionType==='進項'?'text-red-500':'text-emerald-600'}`}>{inv.transactionType==='進項'?'-':''}${inv.total.toLocaleString()}</td><td className="p-6 text-center"><span className={`px-3 py-1 rounded-full text-[10px] font-black ${inv.status==='已付款'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}`}>{inv.status}</span></td><td className="p-6 text-center"><button onClick={()=>{setEditingInvoiceId(inv.id); setNewInvoiceData(inv); setInvoiceView('create')}} className="text-slate-300 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-xl"></i></button></td></tr>))}</tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // ⭐️ 估價單管理 (v4.3 功能)
            // ==========================================
            const renderQuoteView = () => {
                if (quoteView === 'create') {
                    return (
                        <div className="animate-slide-in max-w-7xl mx-auto no-print">
                            <div className="bg-white p-10 rounded-[3rem] border shadow-sm mb-6">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-8 mb-8">
                                    <div className="md:col-span-4"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">客戶台照</label><input type="text" value={newQuoteData.client} onChange={(e)=>setNewQuoteData({...newQuoteData, client:e.target.value})} className="w-full px-5 py-4 rounded-2xl border font-bold" /></div>
                                    <div className="md:col-span-3"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">開立日期</label><input type="date" value={newQuoteData.date} onChange={(e)=>setNewQuoteData({...newQuoteData, date:e.target.value})} className="w-full px-5 py-4 rounded-2xl border" /></div>
                                    <div className="md:col-span-12 mt-4">
                                        <label className="block text-[10px] font-black text-indigo-500 mb-4 uppercase tracking-widest">聯絡窗口資訊 (可新增多組)</label>
                                        <div className="space-y-4">
                                            {(newQuoteData.contacts || []).map((c, i) => (
                                                <div key={i} className="flex gap-4 items-center bg-slate-50 p-4 rounded-2xl border">
                                                    <div className="flex-1"><input type="text" placeholder="資訊 (如: 先生/小姐)" value={c.name} onChange={(e)=>{const next=[...newQuoteData.contacts]; next[i].name=e.target.value; setNewQuoteData({...newQuoteData, contacts:next})}} className="w-full px-4 py-2 rounded-xl border bg-white" /></div>
                                                    <div className="flex-1"><input type="text" placeholder="電話號碼" value={c.phone} onChange={(e)=>{const next=[...newQuoteData.contacts]; next[i].phone=e.target.value; setNewQuoteData({...newQuoteData, contacts:next})}} className="w-full px-4 py-2 rounded-xl border bg-white font-mono" /></div>
                                                    {i > 0 && <button onClick={()=>{setNewQuoteData({...newQuoteData, contacts:newQuoteData.contacts.filter((_,idx)=>idx!==i)})}} className="text-slate-300 hover:text-red-500"><i className="ph-fill ph-minus-circle text-xl"></i></button>}
                                                </div>
                                            ))}
                                            <button onClick={()=>{setNewQuoteData({...newQuoteData, contacts:[...(newQuoteData.contacts||[]), {name:'', phone:''}]})}} className="text-xs font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl tracking-tighter">+ 增加窗口</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-8 rounded-[2.5rem] flex flex-wrap gap-6 items-end">
                                    <div className="flex-1 min-w-[280px] relative"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">快速搜尋商品庫</label><input type="text" value={quoteSearch} onChange={(e)=>{setQuoteSearch(e.target.value); setShowDropdown(true)}} className="w-full px-5 py-4 rounded-2xl border bg-white font-bold text-indigo-700" />{showDropdown && quoteSearch && (<div className="absolute z-30 w-full mt-2 bg-white border rounded-2xl shadow-2xl max-h-48 overflow-y-auto">{productMaster.filter(p => (p.name || '').toLowerCase().includes(quoteSearch.toLowerCase())).map(p => (<div key={p.id} className="p-4 hover:bg-indigo-50 cursor-pointer border-b flex justify-between" onClick={()=>{setQuoteSearch(p.name); setCustomSpec(p.specs); setCustomPrice(p.unitPrice); setShowDropdown(false)}}><div className="font-bold text-sm">{p.name}</div><div className="font-mono text-emerald-600 font-black">${p.unitPrice}</div></div>))}</div>)}</div>
                                    <div className="w-48"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">規格</label><input type="text" value={customSpec} onChange={(e)=>setCustomSpec(e.target.value)} className="w-full px-5 py-4 rounded-2xl border bg-white shadow-sm" /></div>
                                    <div className="w-32"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">單價</label><input type="number" value={customPrice} onChange={(e)=>setCustomPrice(e.target.value)} className="w-full px-5 py-4 rounded-2xl border bg-white text-right font-mono" /></div>
                                    <div className="w-24"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">數量</label><input type="number" value={qty} onChange={(e)=>setQty(parseInt(e.target.value)||1)} className="w-full px-5 py-4 rounded-2xl border bg-white text-center font-mono" /></div>
                                    <button onClick={()=>{setNewQuoteData({...newQuoteData, items:[...newQuoteData.items, {name:quoteSearch, specs:customSpec, unitPrice:Number(customPrice), qty:Number(qty)}]}); setQuoteSearch(''); setCustomSpec(''); setCustomPrice(''); setQty(1)}} className="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">加入明細</button>
                                </div>
                            </div>
                            {newQuoteData.items.length > 0 && (
                                <div className="bg-white rounded-[3rem] shadow-2xl border overflow-hidden">
                                    <table className="w-full text-left table-fixed border-collapse">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs text-slate-400 uppercase w-[40%]">品名規格描述</th><th className="p-5 text-center text-xs text-slate-400 w-[10%]">數量</th><th className="p-5 text-right text-xs text-slate-400 w-[15%]">單價</th><th className="p-5 text-right text-xs text-slate-400 w-[20%]">合計額</th><th className="p-5 text-center w-[15%]">操作</th></tr></thead>
                                        <tbody>{newQuoteData.items.map((it, idx) => (<tr key={idx} className="border-b"><td className="p-5 font-bold text-slate-700 break-words">{it.name}<div className="text-[10px] font-normal text-slate-400 mt-1 italic">{it.specs}</div></td><td className="p-5 text-center font-mono">{it.qty}</td><td className="p-5 text-right font-mono">${it.unitPrice.toLocaleString()}</td><td className="p-5 text-right font-black text-indigo-600 font-mono text-lg">${(it.qty * it.unitPrice).toLocaleString()}</td><td className="p-5 text-center"><button onClick={()=>setNewQuoteData({...newQuoteData, items:newQuoteData.items.filter((_,i)=>i!==idx)})} className="text-red-300 hover:text-red-500 transition-colors"><i className="ph ph-trash"></i></button></td></tr>))}</tbody>
                                    </table>
                                    <div className="p-12 flex justify-between bg-slate-50 border-t items-center flex-wrap">
                                        <div className="bg-white p-5 rounded-[2rem] border-l-8 border-l-emerald-500 font-black shadow-sm text-emerald-800 tracking-widest">{numberToChinese(newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0))}</div>
                                        <div className="text-right"><div className="text-5xl font-black mb-8 font-mono text-slate-800 tracking-tighter italic">總計: ${newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0).toLocaleString()}</div><button onClick={()=>{const q={...newQuoteData, id: editingQuoteId || `Q-${getToday().replace(/-/g,'')}-${quotes.length+1}`, amount: newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0), status: '草稿'}; if(editingQuoteId) setQuotes(quotes.map(x=>x.id===editingQuoteId?q:x)); else setQuotes([q,...quotes]); setQuoteView('list'); showToast("存檔完成")}} className="bg-indigo-600 text-white px-12 py-5 rounded-[2.5rem] font-black shadow-2xl active:scale-95 transition-all">確認儲存</button></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-black text-slate-800 uppercase italic">報價與估價管理中樞</h2><button onClick={()=>{setQuoteView('create'); setEditingQuoteId(null); setNewQuoteData({client:'', contacts:[{name:'', phone:''}], date:getToday(), items:[]})}} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">+ 新增估價單</button></div>
                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden"><table className="w-full text-left table-fixed"><thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs text-slate-400 font-black w-[20%]">編號/日期</th><th className="p-6 text-xs text-slate-400 font-black w-[45%]">客戶名稱</th><th className="p-6 text-xs text-slate-400 font-black text-right w-[15%]">金額</th><th className="p-6 text-xs text-slate-400 font-black text-center w-[20%]">操作</th></tr></thead><tbody>{quotes.map(q => (<tr key={q.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono text-sm">{q.id}<div className="text-xs font-normal text-slate-400 mt-1">{q.date}</div></td><td className="p-6 font-bold text-slate-800 text-lg break-words">{q.client}<div className="text-xs font-normal text-slate-400 mt-1">{(q.contacts||[]).map(c=>`${c.name} ${c.phone}`).join(' / ')}</div></td><td className="p-6 text-right font-black text-slate-700 font-mono text-lg">${(q.amount||0).toLocaleString()}</td><td className="p-6 text-center flex justify-center gap-2"><button onClick={()=>handlePrint('quote', q)} className="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-100 hover:bg-indigo-600 hover:text-white transition-all">列印</button><button onClick={()=>{setEditingQuoteId(q.id); setNewQuoteData(q); setQuoteView('create')}} className="bg-slate-100 p-3 rounded-2xl"><i className="ph ph-pencil-simple"></i></button></td></tr>))}</tbody></table></div>
                    </div>
                );
            };

            const renderDashboard = () => (
                <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print text-center">
                    <h2 className="text-4xl font-black text-slate-900 uppercase italic mb-4">申堡營運管理系統 v4.4</h2>
                    <p className="text-slate-400 font-bold mb-12">數據保全與列印優化版</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                        <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm"><div className="text-5xl font-black text-indigo-600 mb-2">{productMaster.length}</div><p className="text-xs font-black text-slate-400 uppercase tracking-widest">已建檔商品</p></div>
                        <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm"><div className="text-5xl font-black text-emerald-600 mb-2">{quotes.length}</div><p className="text-xs font-black text-slate-400 uppercase tracking-widest">總估價單數</p></div>
                    </div>
                    <button onClick={() => {
                        const backup = { products: productMaster, quotes, orders, logistics, invoices };
                        exportData(backup, "申堡全系統營運備份");
                    }} className="mt-12 bg-slate-900 text-white px-10 py-5 rounded-[2.5rem] font-black shadow-2xl hover:bg-black transition-all">匯出全系統總雲端報表</button>
                </div>
            );

            const menuItems = [
                { id: 'dashboard', name: '智慧儀表板', icon: 'ph-chart-pie' },
                { id: 'products', name: '商品主檔庫', icon: 'ph-database' },
                { id: 'quotations', name: '估價單系統', icon: 'ph-file-text' },
                { id: 'orders', name: '採購管理', icon: 'ph-shopping-cart' },
                { id: 'logistics', name: '出貨與簽收', icon: 'ph-truck' },
                { id: 'invoices', name: '財務發票系統', icon: 'ph-receipt' }
            ];

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col shadow-2xl z-20 no-print">
                        <div className="p-6 border-b border-slate-800"><h1 className="text-xl font-black italic flex items-center gap-2 tracking-tighter">申堡中樞 <span className="text-[10px] bg-indigo-500 px-2 py-0.5 rounded italic">v4.4</span></h1></div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); setLogisticsView('list'); setInvoiceView('list'); setQuoteView('list'); setProductView('list'); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all font-bold ${activeTab === item.id && !printDoc ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    <i className={`ph ${item.icon} text-xl`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-5 border-t border-slate-800 bg-slate-950/50 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center font-bold">莊</div>
                            <div className="text-left"><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 uppercase font-black tracking-widest">營運管理</div></div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full relative overflow-y-auto print-container custom-scrollbar bg-slate-50">
                        {toast && <div className="fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl bg-slate-900 text-white border-l-4 border-emerald-500 z-[100] font-bold animate-slide-in">{toast}</div>}
                        {!printDoc && activeTab === 'dashboard' && renderDashboard()}
                        {!printDoc && activeTab === 'products' && renderProductView()}
                        {!printDoc && activeTab === 'quotations' && renderQuoteView()}
                        {!printDoc && activeTab === 'invoices' && renderInvoiceView()}
                        {/* 出貨與採購維持既有穩定邏輯 */}
                        {!printDoc && activeTab === 'orders' && <div className="p-8 text-center text-slate-300 font-black italic">採購功能整合中，邏輯與 v4.3 一致</div>}
                        {!printDoc && activeTab === 'logistics' && <div className="p-8 text-center text-slate-300 font-black italic">物流功能整合中，邏輯與 v4.3 一致</div>}
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-2xl z-50 no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`flex flex-col items-center p-2 rounded-2xl transition-colors ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50 shadow-inner' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
