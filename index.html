<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申堡營運中樞系統 MVP</title>
    
    <!-- 引入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 以便在瀏覽器中編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- 模擬資料庫 (Mock Data) ---
        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        const mockProducts = [
            { sku: 'S001-C01-001', supplier: '大日', name: '菲莉絲屏風(全布)', spec: 'W120xD3xH110 cm', price: 3500, stock: 15 },
            { sku: 'S001-C01-002', supplier: '大日', name: '活動高櫃', spec: 'W40xD56xH65cm', price: 1300, stock: 4 },
            { sku: 'S002-C02-001', supplier: '寶維', name: '不銹鋼五分類資源回收箱', spec: 'W180xD45xH105 cm, 304不銹鋼', price: 28000, stock: 2 },
        ];

        const mockQuotes = [
            { id: 'Q-20231222-001', client: '澎湖縣政府環保局', date: '2023-12-22', amount: 1300, status: '已確認' },
            { id: 'Q-20240501-002', client: '馬公市公所', date: '2024-05-01', amount: 28000, status: '草稿' },
        ];

        const mockOrders = [
            { id: 'PO-20231223-01', supplier: '大日', refQuote: 'Q-20231222-001', date: '2023-12-23', status: '已發送' },
        ];

        // --- 阿拉伯數字轉中文大寫函式 ---
        const numberToChinese = (num) => {
            const fraction = ['角', '分'];
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            for (let i = 0; i < fraction.length; i++) {
                s += (digit[Math.floor(num * 10 * Math.pow(10, i)) % 10] + fraction[i]).replace(/零./, '');
            }
            s = s || '整';
            num = Math.floor(num);
            for (let i = 0; i < unit[0].length && num > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && num > 0; j++) {
                    p = digit[num % 10] + unit[1][j] + p;
                    num = Math.floor(num / 10);
                }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零').replace(/^整$/, '零元整');
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');

            const menuItems = [
                { id: 'dashboard', name: '營運儀表板', icon: '📊' },
                { id: 'quotations', name: '報價單系統', icon: '📝' },
                { id: 'orders', name: '訂貨與採購', icon: '🛒' },
                { id: 'logistics', name: '出貨與物流', icon: '🚚' },
                { id: 'inventory', name: '產品與庫存庫', icon: '📦' },
                { id: 'invoices', name: '發票數位看板', icon: '🧾' },
            ];

            // 1. 營運儀表板視圖
            const renderDashboard = () => (
                <div className="p-8 animate-in fade-in duration-500">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">營運全景儀表板</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                            <p className="text-slate-500 text-sm font-medium mb-1">本月累計報價金額</p>
                            <h3 className="text-3xl font-bold text-slate-800">$1,450,000</h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-emerald-500">
                            <p className="text-slate-500 text-sm font-medium mb-1">待出貨訂單</p>
                            <h3 className="text-3xl font-bold text-slate-800">12 <span className="text-sm font-normal text-slate-400">筆</span></h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-amber-500">
                            <p className="text-slate-500 text-sm font-medium mb-1">待開立發票</p>
                            <h3 className="text-3xl font-bold text-slate-800">8 <span className="text-sm font-normal text-slate-400">筆</span></h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-red-500">
                            <p className="text-slate-500 text-sm font-medium mb-1">庫存警示品項</p>
                            <h3 className="text-3xl font-bold text-red-600 flex items-center gap-2">2 ⚠️</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">✅ 最近確認報價單 (待轉訂貨)</h3>
                            <div className="space-y-4">
                                {mockQuotes.filter(q => q.status === '已確認').map(q => (
                                    <div key={q.id} className="flex justify-between items-center p-3 hover:bg-slate-50 rounded-lg border border-slate-100">
                                        <div>
                                            <p className="font-medium text-slate-800">{q.client}</p>
                                            <p className="text-sm text-slate-500">{q.id}</p>
                                        </div>
                                        <button 
                                            onClick={() => setActiveTab('orders')}
                                            className="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium hover:bg-blue-100 flex items-center gap-1"
                                        >
                                            拋轉訂貨 ➡️
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // 2. 報價單系統視圖
            const renderQuotations = () => {
                const [view, setView] = useState('list');
                const [selectedProduct, setSelectedProduct] = useState('');
                const [qty, setQty] = useState(1);
                const [items, setItems] = useState([]);

                const handleAdd = () => {
                    const p = mockProducts.find(x => x.sku === selectedProduct);
                    if (p) {
                        setItems([...items, { ...p, qty }]);
                        setSelectedProduct('');
                        setQty(1);
                    }
                };

                const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

                if (view === 'create') {
                    return (
                        <div className="p-8">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold text-slate-800">新增報價單</h2>
                                <button onClick={() => setView('list')} className="text-slate-500 hover:text-slate-800">返回列表</button>
                            </div>
                            
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                    <div className="col-span-2">
                                        <label className="block text-sm font-medium text-slate-600 mb-1">搜尋產品 (料號 / 品名)</label>
                                        <select 
                                            value={selectedProduct}
                                            onChange={(e) => setSelectedProduct(e.target.value)}
                                            className="w-full border-slate-300 rounded-lg shadow-sm p-2.5 border bg-white"
                                        >
                                            <option value="">-- 請選擇產品 --</option>
                                            {mockProducts.map(p => (
                                                <option key={p.sku} value={p.sku}>[{p.supplier}] {p.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-600 mb-1">數量</label>
                                        <input 
                                            type="number" min="1" value={qty} onChange={(e) => setQty(parseInt(e.target.value))}
                                            className="w-full border-slate-300 rounded-lg shadow-sm p-2.5 border text-center"
                                        />
                                    </div>
                                    <div>
                                        <button onClick={handleAdd} className="w-full bg-slate-800 text-white py-2.5 rounded-lg hover:bg-slate-700 transition">
                                            ➕ 加入明細
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {items.length > 0 && (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b border-slate-200">
                                            <tr>
                                                <th className="p-4 font-medium text-slate-600">品名/規格</th>
                                                <th className="p-4 font-medium text-slate-600 text-center">數量</th>
                                                <th className="p-4 font-medium text-slate-600 text-right">單價</th>
                                                <th className="p-4 font-medium text-slate-600 text-right">小計</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {items.map((item, idx) => (
                                                <tr key={idx}>
                                                    <td className="p-4">
                                                        <div className="font-medium text-slate-800">{item.name}</div>
                                                        <div className="text-sm text-slate-500">{item.spec}</div>
                                                    </td>
                                                    <td className="p-4 text-center">{item.qty}</td>
                                                    <td className="p-4 text-right">${item.price.toLocaleString()}</td>
                                                    <td className="p-4 text-right font-bold text-blue-600">${(item.price * item.qty).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="bg-slate-50 p-6 border-t border-slate-200 flex justify-between items-center">
                                        <div>
                                            <div className="text-sm text-slate-500 mb-1">大寫金額</div>
                                            <div className="font-bold text-slate-700">{numberToChinese(total)}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-2xl font-bold text-slate-800 mb-4">總計: ${total.toLocaleString()}</div>
                                            <button className="bg-emerald-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-emerald-700 transition shadow-sm flex items-center gap-2">
                                                🗃️ 產生 Magic Link 專屬連結
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }

                return (
                    <div className="p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">報價單總覽</h2>
                            <button onClick={() => setView('create')} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                ➕ 建立新報價
                            </button>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th className="p-4 font-medium text-slate-600">單號 / 日期</th>
                                        <th className="p-4 font-medium text-slate-600">客戶名稱</th>
                                        <th className="p-4 font-medium text-slate-600 text-right">總金額</th>
                                        <th className="p-4 font-medium text-slate-600 text-center">狀態</th>
                                        <th className="p-4 font-medium text-slate-600 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {mockQuotes.map(q => (
                                        <tr key={q.id} className="hover:bg-slate-50">
                                            <td className="p-4">
                                                <div className="font-medium text-slate-800">{q.id}</div>
                                                <div className="text-sm text-slate-500">{q.date}</div>
                                            </td>
                                            <td className="p-4 text-slate-700">{q.client}</td>
                                            <td className="p-4 text-right font-medium">${q.amount.toLocaleString()}</td>
                                            <td className="p-4 text-center">
                                                <span className={`px-3 py-1 rounded-full text-xs font-medium ${q.status === '已確認' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700'}`}>
                                                    {q.status}
                                                </span>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button className="text-blue-600 hover:text-blue-800 text-sm font-medium">檢視 Magic Link</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 font-sans text-slate-800 overflow-hidden">
                    <aside className="w-64 bg-slate-900 h-full text-white flex flex-col shadow-2xl z-20 shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold tracking-wider flex items-center gap-2">
                                申堡中樞 <span className="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30">v1.0</span>
                            </h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            {menuItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium ${
                                        activeTab === item.id 
                                            ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/20' 
                                            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                    }`}
                                >
                                    <span>{item.icon}</span> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center text-sm font-bold shadow-inner">莊</div>
                                <div className="text-left">
                                    <div className="text-sm font-bold text-slate-200">莊惠呅</div>
                                    <div className="text-xs text-slate-500">系統管理員</div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-y-auto relative bg-slate-50/50">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'quotations' && renderQuotations()}
                        {activeTab === 'orders' && <div className="p-8"><h2 className="text-2xl font-bold">🛒 訂貨與採購模組</h2><p className="text-slate-500 mt-2">（此模組細節請參閱先前設計，介面展示暫省略以確保檔案輕量）</p></div>}
                        {activeTab === 'logistics' && <div className="p-8"><h2 className="text-2xl font-bold">🚚 出貨與物流模組</h2><p className="text-slate-500 mt-2">（此模組細節請參閱先前設計，介面展示暫省略以確保檔案輕量）</p></div>}
                        {activeTab === 'inventory' && <div className="p-8"><h2 className="text-2xl font-bold">📦 產品與庫存庫</h2><p className="text-slate-500 mt-2">（此模組細節請參閱先前設計，介面展示暫省略以確保檔案輕量）</p></div>}
                        {activeTab === 'invoices' && <div className="p-8"><h2 className="text-2xl font-bold">🧾 發票數位看板</h2><p className="text-slate-500 mt-2">（此模組細節請參閱先前設計，介面展示暫省略以確保檔案輕量）</p></div>}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
