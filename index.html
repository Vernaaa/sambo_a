<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.0</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            .seal-only { display: block !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const i18n = {
            zh: {
                dashboard: "營運儀表板", products: "商品資料庫", quotations: "報價單系統", orders: "採購管理", logistics: "物流看板", invoices: "財務發票",
                search: "搜尋...", add: "新增", edit: "編輯", delete: "刪除", save: "儲存", cancel: "取消",
                sku: "編號", brand: "廠牌", name: "品名", specs: "規格", price: "單價", qty: "數量", total: "總計",
                taxId: "統一編號", client: "客戶對象", date: "日期", status: "狀態", actions: "操作",
                confirmDelete: "確定要刪除嗎？", backup: "數據備份", restore: "數據還原",
                langToggle: "English Mode", print: "列印單據", pushOrder: "拋轉採購",
                taxNet: "銷售額", taxVal: "稅額", paid: "已付款", unpaid: "待結帳", type: "類型",
                systemTotal: "全系統數據包", aiProducts: "AI 商品資料", confirmRestore: "這將覆蓋現有數據，確定嗎？"
            },
            en: {
                dashboard: "Dashboard", products: "Inventory", quotations: "Quotes", orders: "Purchase", logistics: "Logistics", invoices: "Invoices",
                search: "Search...", add: "Add", edit: "Edit", delete: "Delete", save: "Save", cancel: "Cancel",
                sku: "SKU", brand: "Brand", name: "Product Name", specs: "Specs", price: "Price", qty: "Qty", total: "Total",
                taxId: "Tax ID", client: "Client", date: "Date", status: "Status", actions: "Actions",
                confirmDelete: "Confirm deletion?", backup: "Export", restore: "Restore",
                langToggle: "中文模式", print: "Print", pushOrder: "Push to PO",
                taxNet: "Net", taxVal: "Tax", paid: "Paid", unpaid: "Unpaid", type: "Type",
                systemTotal: "System Backup", aiProducts: "AI Products", confirmRestore: "This will overwrite existing data. Confirm?"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 ---
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('sb_p') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p', JSON.stringify(products));
                localStorage.setItem('sb_q', JSON.stringify(quotes));
                localStorage.setItem('sb_o', JSON.stringify(orders));
                localStorage.setItem('sb_l', JSON.stringify(logistics));
                localStorage.setItem('sb_i', JSON.stringify(invoices));
            }, [products, quotes, orders, logistics, invoices]);

            const t = i18n[lang];
            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // ==========================================
            // ⭐️ 全功能恢復 (Restore & Backup)
            // ==========================================
            const exportData = () => {
                const data = { products, quotes, orders, logistics, invoices };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `Shenbao_Backup_${getToday()}.json`; a.click();
                triggerToast("Backup Downloaded");
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        if (json.products && json.quotes) {
                            setConfirmBox({ msg: t.confirmRestore, action: () => {
                                setProducts(json.products); setQuotes(json.quotes); setOrders(json.orders || []);
                                setLogistics(json.logistics || []); setInvoices(json.invoices || []);
                                setConfirmBox(null); triggerToast("Full Restore Success");
                            }});
                        } else if (Array.isArray(json)) {
                            setProducts([...json, ...products]);
                            triggerToast("AI Data Merged");
                        }
                    } catch (err) { triggerToast("Invalid File"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // ⭐️ 商品維護 (CRUD)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const filteredP = products.filter(p => p.name.toLowerCase().includes(pSearch.toLowerCase()) || p.id.toLowerCase().includes(pSearch.toLowerCase()));

            const handlePSave = () => {
                if (!pForm.name) return;
                if (pEdit === 'new') setProducts([{ ...pForm, id: pForm.id || `P-${generateId()}` }, ...products]);
                else setProducts(products.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); triggerToast("Product Saved");
            };

            // ==========================================
            // ⭐️ 報價單與拋轉
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ client: '', date: getToday(), items: [], total: 0 });
            const [selSku, setSelSku] = useState('');
            const [selQty, setSelQty] = useState(1);

            const handleAddQItem = () => {
                const p = products.find(x => x.id === selSku);
                if (!p) return;
                setQForm({ ...qForm, items: [...qForm.items, { ...p, qty: selQty }], total: qForm.total + (p.unitPrice * selQty) });
                setSelSku(''); setSelQty(1);
            };

            const saveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return;
                const newQ = { ...qForm, id: `Q-${generateId()}`, status: 'Confirmed' };
                setQuotes([newQ, ...quotes]);
                setQView('list'); triggerToast("Quote Created");
            };

            const pushQuote = (q) => {
                const poId = `PO-${generateId()}`;
                const ord = { ...q, id: poId, ref: q.id };
                setOrders([ord, ...orders]);
                setLogistics([{ ...ord, status: 'Pending' }, ...logistics]);
                setQuotes(quotes.map(x => x.id === q.id ? { ...x, status: 'Pushed' } : x));
                triggerToast("Pushed to Purchase & Logistics");
            };

            // ==========================================
            // ⭐️ 列印渲染 (保持專業 A4 + 印章)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-xl">列印單據</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-6 py-2 rounded-xl">返回系統</button></div>
                        <h1 className="text-center text-4xl font-bold tracking-[0.8em] border-b-4 border-black pb-4 mb-6">{printDoc.type === 'quote' ? '估價單' : '訂貨單'}</h1>
                        <div className="flex justify-between mb-8 text-xl font-bold">
                            <div className="underline decoration-2 underline-offset-4">{d.client} 台照</div>
                            <div className="text-right">日期：{d.date} <br/> 編號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-[2.5px] border-black text-center mb-8">
                            <thead className="bg-slate-100 border-b-[2.5px] border-black">
                                <tr><th className="p-3 border-r-[2px] border-black w-1/2">品名規格</th><th className="p-3 border-r-[2px] border-black w-16">數量</th><th className="p-3 border-r-[2px] border-black w-32">單價</th><th className="p-3 w-32">總計</th></tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="border-b border-black text-lg">
                                        <td className="p-3 border-r-[2px] border-black text-left">{it.name} <span className="text-sm block">{it.specs}</span></td>
                                        <td className="p-3 border-r-[2px] border-black">{it.qty}</td>
                                        <td className="p-3 border-r-[2px] border-black">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-3 font-bold">{(it.qty * it.unitPrice).toLocaleString()}</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 10 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="border-b border-black h-12"><td className="border-r-[2px] border-black"></td><td className="border-r-[2px] border-black"></td><td className="border-r-[2px] border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="flex justify-between items-center text-2xl font-black">
                            <div className="bg-slate-50 px-6 py-4 border-2 border-black rounded-2xl">總計：{numberToChinese(d.total)}</div>
                            <div className="text-3xl">NT$ {d.total?.toLocaleString()}</div>
                        </div>
                        <div className="mt-20 flex justify-end pr-10">
                            <img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 確認視窗 */}
                    {confirmBox && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white p-10 rounded-[3rem] max-w-sm shadow-2xl animate-slide-in">
                                <p className="font-black text-slate-600 mb-10 text-center">{confirmBox.msg}</p>
                                <div className="flex gap-4">
                                    <button onClick={confirmBox.action} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black shadow-xl">確認</button>
                                    <button onClick={()=>setConfirmBox(null)} className="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 商品編輯視窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-black/50 z-[90] flex items-center justify-center p-4">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-md shadow-2xl animate-slide-in">
                                <h3 className="text-2xl font-black mb-8 italic uppercase">{pEdit === 'new' ? t.add : t.edit} {t.products}</h3>
                                <div className="space-y-4 mb-10">
                                    <input type="text" placeholder={t.sku} value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-mono" />
                                    <input type="text" placeholder={t.brand} value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-bold" />
                                    <input type="text" placeholder={t.name} value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black" />
                                    <input type="text" placeholder={t.specs} value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2" />
                                    <input type="number" placeholder={t.price} value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-6 py-4 rounded-2xl border-2 text-right font-black text-emerald-600" />
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-xl">儲存</button>
                                    <button onClick={()=>setPEdit(null)} className="flex-1 bg-slate-100 text-slate-400 py-5 rounded-3xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 no-print">
                        <div className="p-8 border-b border-slate-800"><h1 className="text-xl font-black italic tracking-tighter uppercase">申堡中樞 <span className="text-[10px] bg-indigo-600 px-2 rounded ml-1">v5.0</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`w-full text-left px-6 py-4 rounded-2xl font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-slate-800 space-y-4">
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-3 bg-slate-800 rounded-xl text-[10px] font-black tracking-widest uppercase flex items-center justify-center gap-2"><i className="ph ph-translate text-lg"></i> {t.langToggle}</button>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black">莊</div>
                                <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase tracking-widest">Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-10 bg-slate-50/50 custom-scrollbar relative">
                        {toast && <div className="fixed top-10 right-10 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 font-bold animate-slide-in">{toast}</div>}

                        {/* Dashboard - 恢復備份與統計 */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-5xl mx-auto space-y-16 py-10 text-center animate-slide-in">
                                <h1 className="text-6xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡營運管理旗艦中樞</h1>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-indigo-600 mb-4">{products.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.products}</div>
                                    </div>
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-emerald-600 mb-4">{quotes.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.quotations}</div>
                                    </div>
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-red-600 mb-4">{logistics.filter(l=>l.status!=='Done').length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">Active Tasks</div>
                                    </div>
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={exportData} className="bg-slate-900 text-white px-10 py-5 rounded-[2rem] font-black shadow-xl hover:bg-black transition-all active:scale-95">{t.backup} (JSON)</button>
                                    <button onClick={()=>document.getElementById('sysRestore').click()} className="bg-emerald-600 text-white px-10 py-5 rounded-[2rem] font-black shadow-xl hover:bg-emerald-700 transition-all active:scale-95">{t.restore} (JSON)</button>
                                    <input id="sysRestore" type="file" className="hidden" onChange={importData} />
                                </div>
                            </div>
                        )}

                        {/* 商品庫 - CRUD + Import */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase">{t.products}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">PRODUCT DB</p></div>
                                    <div className="flex gap-4">
                                        <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition-all">+ {t.add}</button>
                                        <button onClick={()=>document.getElementById('pMerge').click()} className="bg-white border-2 border-indigo-600 text-indigo-600 px-6 py-2 rounded-2xl font-black">導入 AI 資料</button>
                                        <input id="pMerge" type="file" className="hidden" onChange={importData} />
                                    </div>
                                </div>
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="flex-1 relative"><i className="ph ph-magnifying-glass absolute left-6 top-4 text-slate-300"></i><input type="text" placeholder={t.search} value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full pl-14 pr-6 py-3.5 bg-slate-50 border-transparent rounded-2xl focus:bg-white outline-none font-bold transition-all" /></div>
                                </div>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">{t.sku}</th><th className="p-8 w-1/2">{t.name}</th><th className="p-8 text-right w-1/4">{t.price}</th><th className="p-8 text-center w-32">{t.actions}</th></tr></thead>
                                        <tbody>
                                            {filteredP.map(p => (
                                                <tr key={p.id} className="border-b hover:bg-slate-50">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-1 uppercase text-sm">{p.supplier}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{p.name}<div className="text-xs font-normal text-slate-400 mt-1 italic">{p.specs}</div></td>
                                                    <td className="p-8 text-right font-mono font-black text-2xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-8 text-center space-x-2">
                                                        <button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-xl"></i></button>
                                                        <button onClick={()=>{setConfirmBox({msg:t.confirmDelete, action:()=>{setProducts(products.filter(x=>x.id!==p.id)); setConfirmBox(null); triggerToast("Deleted");}})}} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-red-50 hover:text-red-600 transition-all"><i className="ph ph-trash text-xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 報價單系統 - 智慧選購與拋轉 */}
                        {activeTab === 'quotations' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase">{t.quotations}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">CLIENT SALES</p></div>
                                    {qView === 'list' && <button onClick={()=>{setQForm({client:'', date:getToday(), items:[], total:0}); setQView('create')}} className="bg-indigo-600 text-white px-10 py-4 rounded-3xl font-black shadow-xl">+ 建立報價</button>}
                                </div>

                                {qView === 'create' ? (
                                    <div className="bg-white p-12 rounded-[4rem] shadow-sm border border-slate-100 space-y-10 animate-slide-in max-w-5xl mx-auto">
                                        <div className="grid grid-cols-2 gap-8">
                                            <input type="text" placeholder="客戶名稱" value={qForm.client} onChange={e=>setQForm({...qForm, client:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black text-xl" />
                                            <input type="date" value={qForm.date} onChange={e=>setQForm({...qForm, date:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-bold" />
                                        </div>
                                        <div className="bg-slate-50 p-8 rounded-[3rem] border-2 border-dashed flex gap-4 items-end">
                                            <div className="flex-1 space-y-1">
                                                <label className="text-[10px] font-black opacity-30 uppercase">選擇產品</label>
                                                <select value={selSku} onChange={e=>setSelSku(e.target.value)} className="w-full px-6 py-4 rounded-2xl border-2 bg-white font-bold">
                                                    <option value="">-- Choose Product --</option>
                                                    {products.map(p => <option key={p.id} value={p.id}>[{p.supplier}] {p.name}</option>)}
                                                </select>
                                            </div>
                                            <div className="w-32 space-y-1">
                                                <label className="text-[10px] font-black opacity-30 uppercase">{t.qty}</label>
                                                <input type="number" value={selQty} onChange={e=>setSelQty(Number(e.target.value))} className="w-full px-6 py-4 rounded-2xl border-2 text-center font-black" />
                                            </div>
                                            <button onClick={handleAddQItem} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black shadow-lg">Add Item</button>
                                        </div>
                                        {qForm.items.length > 0 && (
                                            <div className="rounded-[2.5rem] border overflow-hidden">
                                                <table className="w-full text-left table-fixed">
                                                    <thead className="bg-slate-50"><tr className="text-[10px] font-black text-slate-400 uppercase"><th className="p-6 w-1/2">Item</th><th className="p-6 text-center w-20">Qty</th><th className="p-6 text-right w-32">Total</th><th className="p-6 w-16"></th></tr></thead>
                                                    <tbody>
                                                        {qForm.items.map((it, i) => (
                                                            <tr key={i} className="border-t font-bold">
                                                                <td className="p-6">{it.name}<div className="text-xs font-normal text-slate-400">{it.specs}</div></td>
                                                                <td className="p-6 text-center font-mono">{it.qty}</td>
                                                                <td className="p-6 text-right text-indigo-600">${(it.qty * it.unitPrice).toLocaleString()}</td>
                                                                <td className="p-6 text-center"><button onClick={()=>setQForm({...qForm, items: qForm.items.filter((_,idx)=>idx!==i), total: qForm.total - (it.qty * it.unitPrice)})} className="text-red-300"><i className="ph ph-x-circle text-xl"></i></button></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center p-12 bg-slate-900 text-white rounded-[3rem] shadow-2xl">
                                            <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-1">Chinese Total</div><div className="text-2xl font-bold tracking-widest">{numberToChinese(qForm.total)}</div></div>
                                            <div className="text-right">
                                                <div className="text-6xl font-black font-mono text-emerald-400 mb-8">${qForm.total.toLocaleString()}</div>
                                                <div className="flex gap-4">
                                                    <button onClick={saveQuote} className="bg-emerald-600 text-white px-12 py-5 rounded-[2.5rem] font-black text-xl shadow-xl active:scale-95 transition-all">確認儲存報價</button>
                                                    <button onClick={()=>setQView('list')} className="px-10 py-5 bg-white/10 text-white rounded-[2.5rem] font-black">取消</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden">
                                        <table className="w-full text-left table-fixed">
                                            <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">ID / Date</th><th className="p-8 w-1/2">Client</th><th className="p-8 text-right w-1/4">Amount</th><th className="p-8 text-center w-56">Actions</th></tr></thead>
                                            <tbody>
                                                {quotes.map(q => (
                                                    <tr key={q.id} className="border-b hover:bg-slate-50 transition-colors">
                                                        <td className="p-8 font-mono text-xs text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-1">{q.date}</div></td>
                                                        <td className="p-8 font-black text-slate-800 text-lg">{q.client}</td>
                                                        <td className="p-8 text-right font-black text-indigo-600 text-xl">${q.total?.toLocaleString()}</td>
                                                        <td className="p-8 text-center space-x-2">
                                                            <button onClick={()=>setPrintDoc({type:'quote', data:q})} className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-black border hover:bg-white transition-all">列印</button>
                                                            {q.status !== 'Pushed' && <button onClick={()=>pushQuote(q)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-black shadow-lg hover:bg-indigo-700 transition-all">拋轉採購</button>}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 物流看板 - 司機端視角任務卡片 */}
                        {activeTab === 'logistics' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">物流配送看板</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">REAL-TIME DELIVERY</p></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                                    {logistics.map(l => (
                                        <div key={l.id} className="bg-white p-10 rounded-[4rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                                            <div className={`absolute top-0 left-0 w-full h-3 ${l.status==='Done'?'bg-emerald-500':'bg-amber-400'}`}></div>
                                            <div className="flex justify-between items-start mb-8">
                                                <div><div className="text-[10px] font-black text-slate-300 font-mono tracking-tighter">{l.id}</div><h3 className="text-2xl font-black text-slate-800 mt-1">{l.client}</h3></div>
                                                <span className={`px-4 py-1 rounded-full text-[10px] font-black uppercase ${l.status==='Done'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}`}>{l.status==='Done'?'已簽收':'配送中'}</span>
                                            </div>
                                            <div className="space-y-3 mb-10 bg-slate-50 p-8 rounded-[3rem] min-h-[140px] border border-slate-100 overflow-y-auto max-h-48 custom-scrollbar">
                                                {l.items.map((it, i) => (
                                                    <div key={i} className="flex justify-between text-sm font-bold border-b border-white pb-2"><span className="text-slate-500 truncate pr-4">{it.name}</span><span className="text-indigo-600 shrink-0">x{it.qty}</span></div>
                                                ))}
                                            </div>
                                            {l.status !== 'Done' ? (
                                                <button onClick={()=>{setLogistics(logistics.map(x=>x.id===l.id?{...x, status:'Done'}:x)); triggerToast("Task Signed")}} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black shadow-xl flex items-center justify-center gap-2 hover:bg-indigo-700 transition-all active:scale-95"><i className="ph ph-truck text-2xl"></i> 確認抵達並讓客戶簽收</button>
                                            ) : (
                                                <div className="w-full py-5 bg-emerald-50 text-emerald-700 rounded-3xl font-black flex items-center justify-center gap-2 border border-emerald-100 italic"><i className="ph ph-check-circle text-2xl"></i> 配送任務已完成</div>
                                            )}
                                        </div>
                                    ))}
                                    {logistics.length === 0 && <div className="col-span-full p-40 text-center text-slate-200 font-black italic text-4xl uppercase tracking-tighter">No Active Shipments.</div>}
                                </div>
                            </div>
                        )}

                        {/* 財務與發票 - 統編與大寫邏輯 */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-8 max-w-5xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.invoices}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">ACCOUNTING SYSTEM</p></div>
                                </div>
                                <div className="bg-white p-12 rounded-[4rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.type}</label>
                                            <select className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 bg-slate-50 font-black text-lg">
                                                <option>三聯式 (B2B)</option><option>二聯式 (B2C)</option><option>電子發票</option>
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.taxId}</label>
                                            <input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} placeholder="8位數字" className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-mono text-2xl tracking-[0.3em] bg-slate-50 focus:bg-white transition-all outline-none" />
                                        </div>
                                        <div className="space-y-1 col-span-full">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.client}</label>
                                            <input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-black text-xl" />
                                        </div>
                                        <div className="space-y-1 col-span-full">
                                            <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.price} (含稅)</label>
                                            <input type="number" value={invForm.amount} onChange={e=>setInvForm({...invForm, amount:Number(e.target.value)})} className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-mono text-3xl font-black text-emerald-600" />
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-12 rounded-[3.5rem] flex justify-between items-center shadow-2xl">
                                        <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-1">Chinese Amount</div><div className="text-2xl font-black tracking-widest">{numberToChinese(invForm.amount)}</div></div>
                                        <div className="text-right">
                                            <div className="text-[10px] opacity-30 mb-2 uppercase tracking-widest">Total Due</div>
                                            <div className="text-6xl font-black font-mono text-emerald-400">${invForm.amount.toLocaleString()}</div>
                                        </div>
                                    </div>
                                    <button onClick={()=>{
                                        if(!invForm.client) return;
                                        setInvoices([{...invForm, id: `INV-${generateId()}`, date: getToday()}, ...invoices]);
                                        setInvForm({taxId:'', client:'', amount:0}); triggerToast("Invoice Logged");
                                    }} className="w-full py-8 bg-emerald-600 text-white rounded-[2.5rem] font-black text-3xl shadow-xl hover:bg-emerald-700 active:scale-95 transition-all">確認開立發票帳項</button>
                                </div>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">Date / Tax ID</th><th className="p-8 w-1/2">Client</th><th className="p-8 text-right w-1/4">Total</th></tr></thead>
                                        <tbody>
                                            {invoices.map(i => (
                                                <tr key={i.id} className="border-b hover:bg-slate-50 transition-colors">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-1 text-sm uppercase">{i.taxId || 'N/A'}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{i.client}</td>
                                                    <td className="p-8 text-right font-black text-emerald-600 text-xl">${i.amount?.toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 採購單管理 */}
                        {activeTab === 'orders' && (
                            <div className="animate-slide-in space-y-8">
                                <h2 className="text-4xl font-black text-slate-800 italic uppercase">採購管理中心</h2>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">PO 編號 / 日期</th><th className="p-8 w-1/2">Client / Ref</th><th className="p-8 text-right w-1/4">總額</th><th className="p-8 text-center w-32">列印</th></tr></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50 transition-colors">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-1">{o.date}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{o.client}<div className="text-xs text-indigo-500 font-bold mt-1 uppercase">REF: {o.ref}</div></td>
                                                    <td className="p-8 text-right font-black text-amber-600 text-xl">${o.total?.toLocaleString()}</td>
                                                    <td className="p-8 text-center"><button onClick={()=>setPrintDoc({type:'order', data:o})} className="p-3 bg-slate-50 text-amber-600 rounded-xl hover:bg-amber-500 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-2xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
