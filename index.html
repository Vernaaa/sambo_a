<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v7.3</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; border: 2px solid black !important; }
            th, td { border: 1px solid black !important; padding: 8px !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }

        .btn-primary { @apply bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-2; }
        .btn-secondary { @apply bg-slate-100 text-slate-600 px-6 py-3 rounded-2xl font-bold hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-2; }
        .input-standard { @apply w-full px-5 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white transition-all font-bold; }
        .card-stat { @apply bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-md transition-shadow; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = (prefix = '') => prefix + Math.random().toString(36).substr(2, 6).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const STORAGE_KEY = 'SHENBAO_V7_MASTER_DATA';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 全局狀態管理 ---
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {
                    products: [],
                    quotes: [],
                    invoices: [],
                    inputInvoices: []
                };
            });

            // 自動存檔
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // ==========================================
            // ⭐️ 系統管理 (智慧匯入修正)
            // ==========================================
            const handleExport = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `申堡數據備份_${getToday()}.json`;
                a.click();
                triggerToast("備份檔已下載");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported)) {
                            setData(prev => ({ ...prev, products: imported }));
                            triggerToast(`成功匯入 ${imported.length} 筆商品資料`);
                        } else if (imported.products) {
                            setData(imported);
                            triggerToast("系統資料已成功還原");
                        } else {
                            triggerToast("格式不符，請確認檔案內容");
                        }
                    } catch (err) { triggerToast("檔案解析失敗"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // ==========================================
            // ⭐️ 商品資料庫
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', category: '', name: '', specs: '', unitPrice: 0 });

            const handleProductSave = () => {
                if (!pForm.name) return triggerToast("請輸入品名");
                const newList = pEdit === 'new' 
                    ? [{ ...pForm, id: pForm.id || generateId('P') }, ...data.products]
                    : data.products.map(p => p.id === pForm.id ? pForm : p);
                
                setData({ ...data, products: newList });
                setPEdit(null);
                triggerToast("商品資料已更新");
            };

            const handleProductDelete = (id) => {
                if (!window.confirm("確定要刪除此商品嗎？")) return;
                setData({ ...data, products: data.products.filter(p => p.id !== id) });
                triggerToast("商品已移除");
            };

            // ==========================================
            // ⭐️ 報價單系統
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ client: '', date: getToday(), items: [], total: 0 });
            const [qSelSku, setQSelSku] = useState('');
            const [qSelQty, setQSelQty] = useState(1);

            const handleAddQItem = () => {
                const p = data.products.find(x => x.id === qSelSku);
                if (!p) return;
                const newItems = [...qForm.items, { ...p, qty: qSelQty }];
                const newTotal = newItems.reduce((s, it) => s + (it.qty * it.unitPrice), 0);
                setQForm({ ...qForm, items: newItems, total: newTotal });
                setQSelSku(''); setQSelQty(1);
            };

            const saveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return triggerToast("報價內容不完整");
                setData({ ...data, quotes: [{ ...qForm, id: generateId('Q') }, ...data.quotes] });
                setQView('list');
                triggerToast("報價單已存檔");
            };

            // ==========================================
            // ⭐️ 財務發票系統 (強化品項明細)
            // ==========================================
            const [invMode, setInvMode] = useState('銷項');
            const [invForm, setInvForm] = useState({
                category: '三聯式', taxId: '', invNum: '', client: '', date: getToday(),
                items: [], total: 0
            });
            const [invSelSku, setInvSelSku] = useState('');

            const calcInvTotal = (items) => items.reduce((sum, it) => sum + (it.qty * it.unitPrice), 0);

            const handleInvAddFromDB = () => {
                const p = data.products.find(x => x.id === invSelSku);
                if (!p) return;
                const newItems = [...invForm.items, { ...p, qty: 1, isManual: false }];
                setInvForm({ ...invForm, items: newItems, total: calcInvTotal(newItems) });
                setInvSelSku('');
            };

            const handleInvAddManual = () => {
                const newItem = { id: 'M-' + Date.now(), name: '', specs: '', qty: 1, unitPrice: 0, isManual: true };
                const newItems = [...invForm.items, newItem];
                setInvForm({ ...invForm, items: newItems, total: calcInvTotal(newItems) });
            };

            const updateInvItem = (id, field, value) => {
                const newItems = invForm.items.map(it => it.id === id ? { ...it, [field]: value } : it);
                setInvForm({ ...invForm, items: newItems, total: calcInvTotal(newItems) });
            };

            const removeInvItem = (id) => {
                const newItems = invForm.items.filter(it => it.id !== id);
                setInvForm({ ...invForm, items: newItems, total: calcInvTotal(newItems) });
            };

            const saveInvoice = () => {
                if (!invForm.client || invForm.items.length === 0) return triggerToast("請填寫買受人與明細");
                if (invForm.category === '三聯式' && !/^\d{8}$/.test(invForm.taxId)) return triggerToast("三聯式需 8 碼統編");
                
                const col = invMode === '銷項' ? 'invoices' : 'inputInvoices';
                setData({ ...data, [col]: [{ ...invForm, id: generateId('INV') }, ...data[col]] });
                setInvForm({ category: '三聯式', taxId: '', invNum: '', client: '', date: getToday(), items: [], total: 0 });
                triggerToast(`${invMode}發票紀錄已保存`);
            };

            // ==========================================
            // ⭐️ 列印引擎
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg">確認列印</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-8 py-2 rounded-xl font-bold border">取消</button></div>
                        <h1 className="text-center text-5xl font-bold tracking-[0.8em] border-b-8 border-black pb-6 mb-8 uppercase italic">估價報價單</h1>
                        <div className="flex justify-between mb-8 text-2xl font-bold">
                            <div className="underline decoration-4 underline-offset-8 leading-loose">{d.client} 台照</div>
                            <div className="text-right font-mono text-lg">日期：{d.date} <br/> 單號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-[2px] border-black text-center">
                            <thead><tr className="bg-slate-50 font-black text-xl"><th className="p-4 border-r border-black">品名規格</th><th className="p-4 border-r border-black w-24">數量</th><th className="p-4 border-r border-black w-32">單價</th><th className="p-4 w-40">小計</th></tr></thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="text-xl h-14 border-b border-black font-bold">
                                        <td className="p-4 border-r border-black text-left">{it.name} <div className="text-sm font-normal">{it.specs}</div></td>
                                        <td className="p-4 border-r border-black">{it.qty}</td>
                                        <td className="p-4 border-r border-black text-right">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-4 text-right">{(it.qty * it.unitPrice).toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot><tr className="bg-slate-100 font-black text-2xl border-t-2 border-black"><td colSpan="3" className="p-6 border-r border-black text-left">總計大寫：{numberToChinese(d.total)}</td><td className="p-6 text-right">${d.total?.toLocaleString()}</td></tr></tfoot>
                        </table>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden relative">
                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 shadow-2xl">
                        <div className="p-10 border-b border-slate-800"><h1 className="text-2xl font-black italic text-blue-400">SHENBAO <span className="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded ml-1 font-bold">v7.3</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {[
                                { id: 'dashboard', name: '首頁儀表板', icon: 'ph-layout' },
                                { id: 'products', name: '商品資料庫', icon: 'ph-package' },
                                { id: 'quotations', name: '報價單系統', icon: 'ph-file-text' },
                                { id: 'invoices', name: '財務與稅務', icon: 'ph-receipt' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${item.icon} mr-3 text-lg align-middle`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800 flex items-center gap-4">
                            <div className="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-black">莊</div>
                            <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-widest">Admin</div></div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/50 custom-scrollbar relative">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3 border border-white/10"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* 1. 儀表板 */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto space-y-12 py-10 text-center animate-slide-in">
                                <h1 className="text-7xl font-black text-slate-900 italic tracking-tighter uppercase mb-2">申堡營運管理中樞</h1>
                                <p className="text-slate-400 font-black text-sm tracking-[0.4em] mb-12 uppercase">Data Ownership & High Integrity</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                                    <div className="card-stat"><div className="text-5xl font-black text-indigo-600 mb-2 font-mono">{data.products.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">商品資產總量</div></div>
                                    <div className="card-stat"><div className="text-5xl font-black text-emerald-600 mb-2 font-mono">{data.quotes.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">累計報價單數</div></div>
                                    <div className="card-stat"><div className="text-5xl font-black text-amber-500 mb-2 font-mono">{data.invoices.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">銷項發票筆數</div></div>
                                </div>

                                <div className="bg-slate-900 text-white p-16 rounded-[4rem] flex flex-col md:flex-row items-center justify-between gap-10 shadow-2xl text-left relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                                    <div className="z-10"><h3 className="text-4xl font-black mb-2 flex items-center gap-4 italic uppercase"><i className="ph ph-shield-check text-blue-400"></i> 在地數據保險箱</h3><p className="text-slate-400 font-bold">資料完全存放於您的裝置。定期備份是確保資產安全的最佳實踐。</p></div>
                                    <div className="flex gap-4 z-10">
                                        <button onClick={handleExport} className="btn-primary"><i className="ph ph-download-simple"></i> 下載備份</button>
                                        <button onClick={()=>document.getElementById('importFile').click()} className="btn-secondary text-slate-900"><i className="ph ph-upload-simple"></i> 還原/匯入</button>
                                        <input id="importFile" type="file" className="hidden" onChange={handleImport} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. 商品資料庫 */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">商品資料庫</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase underline decoration-indigo-200 decoration-2">Inventory Management</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', category:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="btn-primary">+ 新增產品品項</button>
                                </div>
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100 flex gap-4"><input type="text" placeholder="搜尋 SKU 編號、品名或分類關鍵字..." value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full px-10 py-6 bg-slate-50 border-transparent rounded-[2rem] outline-none font-black text-2xl placeholder:text-slate-200" /></div>
                                <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[11px]"><th className="p-8 w-48">編號 / 分類</th><th className="p-8">品名規格內容 (可完整閱讀)</th><th className="p-8 text-right w-64">建議單價</th><th className="p-8 text-center w-40">管理</th></thead>
                                        <tbody>
                                            {data.products.filter(p => (p.name+p.id+p.category).toLowerCase().includes(pSearch.toLowerCase())).slice(0, 100).map(p => (
                                                <tr key={p.id} className="border-b hover:bg-indigo-50/30 transition-all group">
                                                    <td className="p-8 align-top"><div className="px-3 py-1 bg-slate-100 text-slate-500 rounded-lg font-mono text-xs font-bold mb-1 inline-block uppercase">{p.id}</div><div className="text-indigo-600 font-black text-sm uppercase">{p.category || p.supplier}</div></td>
                                                    <td className="p-8 align-top font-bold text-2xl">{p.name}<div className="text-slate-400 text-base font-normal mt-2 leading-relaxed whitespace-pre-wrap">{p.specs || '未填寫詳細規格'}</div></td>
                                                    <td className="p-8 text-right align-top font-mono font-black text-4xl text-emerald-700">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-8 text-center align-middle space-x-3"><button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-5 bg-white border border-slate-100 text-slate-400 rounded-2xl hover:bg-indigo-600 hover:text-white transition-all shadow-sm"><i className="ph ph-pencil-simple text-2xl"></i></button><button onClick={()=>handleProductDelete(p.id)} className="p-5 bg-white border border-slate-100 text-red-200 rounded-2xl hover:bg-red-500 hover:text-white transition-all shadow-sm"><i className="ph ph-trash text-2xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {data.products.length > 100 && <div className="p-8 text-center text-slate-400 font-bold bg-slate-50/50">僅顯示前 100 筆商品...</div>}
                                </div>
                            </div>
                        )}

                        {/* 3. 報價單系統 */}
                        {activeTab === 'quotations' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">報價控制中樞</h2>
                                    {qView === 'list' && <button onClick={()=>{setQForm({client:'', date:getToday(), items:[], total:0}); setQView('create')}} className="btn-primary">+ 建立新報價單</button>}
                                </div>
                                {qView === 'create' ? (
                                    <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12 max-w-5xl mx-auto">
                                        <div className="grid grid-cols-2 gap-10">
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">客戶買受人抬頭</label><input type="text" value={qForm.client} onChange={e=>setQForm({...qForm, client:e.target.value})} className="input-standard text-2xl" /></div>
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">單據日期</label><input type="date" value={qForm.date} onChange={e=>setQForm({...qForm, date:e.target.value})} className="input-standard" /></div>
                                        </div>
                                        <div className="bg-slate-50 p-10 rounded-[4rem] border-4 border-dashed border-slate-200 flex gap-6 items-end">
                                            <div className="flex-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block font-black">選取產品</label><select value={qSelSku} onChange={e=>setQSelSku(e.target.value)} className="input-standard bg-white shadow-sm font-black"><option value="">-- 請選取商品 --</option>{data.products.map(p => <option key={p.id} value={p.id}>[{p.category || p.supplier}] {p.name}</option>)}</select></div>
                                            <div className="w-32"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block text-center font-black">數量</label><input type="number" value={qSelQty} onChange={e=>setQSelQty(Number(e.target.value))} className="input-standard text-center font-black" /></div>
                                            <button onClick={handleAddQItem} className="bg-slate-900 text-white px-10 py-5 rounded-3xl font-black shadow-lg">加入明細</button>
                                        </div>
                                        <div className="space-y-4">{qForm.items.map((it, i) => (<div key={i} className="flex justify-between items-center p-8 bg-white border rounded-3xl font-black shadow-sm group"><span>{it.name}<span className="text-slate-400 font-normal text-sm ml-4 block mt-1">{it.specs}</span></span><span className="text-indigo-600 text-2xl">x{it.qty} / ${(it.qty * it.unitPrice).toLocaleString()}</span></div>))}</div>
                                        <div className="bg-slate-900 text-white p-14 rounded-[4rem] flex justify-between items-end relative overflow-hidden group">
                                            <div className="z-10">
                                                <div className="text-[10px] opacity-30 uppercase tracking-widest mb-2 font-black">中文大寫預覽</div>
                                                <div className="text-3xl font-black text-indigo-300">{numberToChinese(qForm.total)}</div>
                                            </div>
                                            <div className="text-right z-10"><div className="text-8xl font-black font-mono text-emerald-400 mb-8 tracking-tighter">${qForm.total.toLocaleString()}</div><div className="flex gap-4"><button onClick={saveQuote} className="bg-emerald-600 px-12 py-5 rounded-[2.5rem] font-black text-xl shadow-xl hover:bg-emerald-700 transition-all">確認儲存報價</button><button onClick={()=>setQView('list')} className="bg-white/10 px-12 py-5 rounded-[2.5rem] font-black text-xl hover:bg-white/20 transition-all">取消</button></div></div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">編號 / 日期</th><th className="p-10 w-1/2">買受人資訊</th><th className="p-10 text-right w-1/4">報價金額</th><th className="p-10 text-center w-40">列印</th></thead>
                                            <tbody>{data.quotes.map(q => (<tr key={q.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-10 font-mono text-sm text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-2 text-base">{q.date}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{q.client}</td><td className="p-10 text-right font-black text-indigo-600 text-3xl font-mono">${q.total?.toLocaleString()}</td><td className="p-10 text-center"><button onClick={()=>setPrintDoc({type:'quote', data:q})} className="p-5 bg-slate-50 text-indigo-600 rounded-3xl hover:bg-indigo-600 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-3xl"></i></button></td></tr>))}</tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4. 財務系統 */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-10 max-w-6xl mx-auto pb-40">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">財務發票管理</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase underline decoration-emerald-500 decoration-2 underline-offset-4 font-black">Tax Compliance System</p></div>
                                    <div className="flex bg-slate-200 p-2 rounded-3xl gap-2 font-black shadow-inner">
                                        <button onClick={()=>setInvMode('銷項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='銷項'?'bg-white text-indigo-600 shadow-md':'text-slate-500'}`}>銷項紀錄</button>
                                        <button onClick={()=>setInvMode('進項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='進項'?'bg-white text-red-600 shadow-md':'text-slate-500'}`}>進項支出</button>
                                    </div>
                                </div>

                                <div className="bg-white p-12 rounded-[4rem] shadow-sm border border-slate-100 space-y-10">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">發票類型</label><select value={invForm.category} onChange={e=>setInvForm({...invForm, category:e.target.value})} className="input-standard"><option>三聯式</option><option>二聯式</option><option>收據/領據</option></select></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">發票號碼</label><input type="text" placeholder="AB-12345678" value={invForm.invNum} onChange={e=>setInvForm({...invForm, invNum:e.target.value.toUpperCase()})} className="input-standard font-mono uppercase" /></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">日期</label><input type="date" value={invForm.date} onChange={e=>setInvForm({...invForm, date:e.target.value})} className="input-standard" /></div>
                                        {invForm.category === '三聯式' && <div className="space-y-2 animate-slide-in"><label className="text-[10px] font-black text-red-500 uppercase tracking-widest ml-4">統一編號 (必填 8 碼)</label><input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} className="input-standard border-red-50 bg-red-50/10 font-mono tracking-widest" /></div>}
                                    </div>
                                    <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">{invMode==='銷項'?'客戶買受人抬頭':'開立供應商名稱'}</label><input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="input-standard text-2xl font-black" /></div>
                                    
                                    <div className="space-y-6 border-t pt-10">
                                        <div className="flex justify-between items-center">
                                            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">發票品項明細 (智慧錄入)</h4>
                                            <div className="flex gap-4">
                                                <div className="bg-slate-50 px-4 py-2 rounded-2xl flex items-center gap-4 border border-slate-100">
                                                    <select value={invSelSku} onChange={e=>setInvSelSku(e.target.value)} className="bg-transparent font-black text-sm outline-none w-48"><option value="">-- 從庫存中選取 --</option>{data.products.map(p => <option key={p.id} value={p.id}>[{p.category}] {p.name}</option>)}</select>
                                                    <button onClick={handleInvAddFromDB} className="bg-indigo-600 text-white px-4 py-1.5 rounded-xl font-black text-[10px] uppercase">加入選定項</button>
                                                </div>
                                                <button onClick={handleInvAddManual} className="bg-slate-900 text-white px-6 py-2 rounded-2xl font-black text-[10px] uppercase">+ 新增自訂品項</button>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            {invForm.items.map((it) => (
                                                <div key={it.id} className="flex gap-6 items-center bg-slate-50 p-6 rounded-[2rem] border-2 border-transparent hover:border-indigo-100 hover:bg-white transition-all group animate-slide-in">
                                                    <div className="flex-1"><input type="text" placeholder="品名項目" value={it.name} onChange={e=>updateInvItem(it.id, 'name', e.target.value)} className={`w-full bg-transparent font-black text-xl outline-none ${!it.isManual?'text-indigo-600':''}`} readOnly={!it.isManual} /><input type="text" placeholder="規格描述" value={it.specs} onChange={e=>updateInvItem(it.id, 'specs', e.target.value)} className="w-full bg-transparent text-sm text-slate-400 font-bold outline-none mt-1" /></div>
                                                    <div className="w-24 text-center"><label className="block text-[8px] font-black text-slate-300 uppercase mb-1">數量</label><input type="number" value={it.qty} onChange={e=>updateInvItem(it.id, 'qty', Number(e.target.value))} className="w-full bg-white border-2 rounded-xl p-2 text-center font-black" /></div>
                                                    <div className="w-36 text-right"><label className="block text-[8px] font-black text-slate-300 uppercase mb-1">單價</label><input type="number" value={it.unitPrice} onChange={e=>updateInvItem(it.id, 'unitPrice', Number(e.target.value))} className="w-full bg-white border-2 rounded-xl p-2 text-right font-black font-mono" /></div>
                                                    <div className="w-40 text-right"><label className="block text-[8px] font-black text-slate-300 uppercase mb-1">小計</label><div className="font-mono font-black text-indigo-600 text-2xl">${(it.qty * it.unitPrice).toLocaleString()}</div></div>
                                                    <button onClick={()=>removeInvItem(it.id)} className="p-3 text-red-300 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100"><i className="ph ph-trash text-2xl"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 text-white p-14 rounded-[4rem] flex justify-between items-end shadow-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/10 rounded-full blur-[100px]"></div>
                                        <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-2 font-black">合計國字大寫 (Tax Inc.)</div><div className="text-3xl font-black text-indigo-300 tracking-widest">{numberToChinese(invForm.total)}</div></div>
                                        <div className="text-right z-10"><div className="text-8xl font-black font-mono text-emerald-400 mb-8 tracking-tighter">${invForm.total.toLocaleString()}</div><button onClick={saveInvoice} className={`px-16 py-6 rounded-[2.5rem] font-black text-2xl shadow-xl transition-all ${invMode==='銷項'?'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/20':'bg-red-600 hover:bg-red-700 shadow-red-500/20'}`}>存檔並同步財務資產</button></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">日期 / 統編</th><th className="p-10 w-1/2">對象名稱 / 品項數</th><th className="p-10 text-right w-1/4">總計金額</th></thead>
                                        <tbody>{(invMode==='銷項'?data.invoices:data.inputInvoices).map(i => (<tr key={i.id} className="border-b hover:bg-slate-50 transition-all group"><td className="p-10 font-mono text-sm text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-2 text-base uppercase">{i.taxId || i.category}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{i.client}<div className="text-[10px] text-slate-400 font-black mt-2 uppercase tracking-widest">包含 {i.items?.length || 0} 項明細項目</div></td><td className="p-10 text-right font-black text-slate-800 text-3xl font-mono">${i.total?.toLocaleString()}</td></tr>))}</tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 商品編輯視窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-xl shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-10 text-indigo-600 italic uppercase">編輯商品參數</h3>
                                <div className="space-y-6 mb-10">
                                    <div className="grid grid-cols-2 gap-6"><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">系統 SKU 編號</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="input-standard py-3 font-mono" /></div><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">所屬分類/廠牌</label><input type="text" value={pForm.category} onChange={e=>setPForm({...pForm, category:e.target.value})} className="input-standard py-3" /></div></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">產品品名</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="input-standard py-3 text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">詳細規格與材質描述</label><textarea rows="3" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="input-standard py-3 font-medium custom-scrollbar" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">建議單價 (TWD)</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="input-standard py-3 text-right font-black text-5xl text-emerald-600" /></div>
                                </div>
                                <div className="flex gap-4"><button onClick={handleProductSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl hover:bg-indigo-700">更新資產</button><button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black">取消</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
