<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v4.5</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { 
                width: 210mm; 
                max-width: 100%; 
                padding: 0 !important; 
                margin: 0 auto !important; 
                box-shadow: none !important; 
                border: none !important; 
                overflow: visible !important;
            }
            table { 
                width: 100% !important; 
                table-layout: fixed !important; 
                border-collapse: collapse !important;
                page-break-inside: auto;
            }
            tr { page-break-inside: avoid; page-break-after: auto; }
            td, th { word-wrap: break-word !important; overflow-wrap: break-word !important; }
            .page-break { page-break-after: always; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            let numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const fileInputRef = useRef(null);

            // --- 資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            useEffect(() => {
                localStorage.setItem('shenbao_products', JSON.stringify(productMaster));
                localStorage.setItem('shenbao_quotes', JSON.stringify(quotes));
                localStorage.setItem('shenbao_orders', JSON.stringify(orders));
                localStorage.setItem('shenbao_logistics', JSON.stringify(logistics));
                localStorage.setItem('shenbao_invoices', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handlePrint = (type, data) => { setPrintDoc({ type, data }); setTimeout(() => window.print(), 300); };

            const exportData = (data, fileName) => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileName}_${getToday()}.json`;
                a.click();
                showToast(`${fileName} 數據已匯出`);
            };

            const importData = (event, setter, name) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (Array.isArray(json)) {
                            setter(json);
                            showToast(`${name} 數據還原成功`);
                        } else { showToast("無效的檔案格式"); }
                    } catch (err) { showToast("讀取失敗"); }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            // --- 其他 UI 狀態 ---
            const [productView, setProductView] = useState('list');
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            
            const [quoteView, setQuoteView] = useState('list');
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', contacts: [{ name: '', phone: '' }], date: getToday(), items: [] });
            
            const [invoiceView, setInvoiceView] = useState('list');
            const [editingInvoiceId, setEditingInvoiceId] = useState(null);
            const [newInvoiceData, setNewInvoiceData] = useState({ 
                invNo: '', type: '三聯式', transactionType: '銷項', taxType: 'taxable', date: getToday(), client: '', taxId: '', items: [], netAmount: 0, tax: 0, total: 0, status: '未付款' 
            });

            const [logisticsView, setLogisticsView] = useState('list');
            const [tempLogisticsData, setTempLogisticsData] = useState({ id: '', client: '', refPo: '', items: [], status: '待進貨' });

            // ==========================================
            // 報表列印引擎
            // ==========================================
            if (printDoc) {
                const closePrint = () => setPrintDoc(null);
                if (printDoc.type === 'quote' || printDoc.type === 'order') {
                    const q = printDoc.data;
                    const isOrder = printDoc.type === 'order';
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container">
                            <div className="no-print mb-8 p-4 bg-indigo-50 rounded-xl flex justify-between items-center border border-indigo-200">
                                <span className="font-bold text-indigo-800 tracking-tighter">{isOrder?'訂貨單':'估價單'}預覽：表格已鎖定寬度以防止裁切</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4 uppercase">{isOrder?'訂貨單':'估價單'}</h1>
                            <div className="flex justify-between items-end mb-4 text-lg border-b border-black pb-2">
                                <div className="font-bold min-w-[280px] break-words">{q.client} 台照</div>
                                <div className="text-right space-y-1">
                                    {isOrder ? (<div>供應商：{q.supplier}</div>) : (q.contacts || []).map((c, i) => (
                                        <div key={i} className="text-sm font-sans">電話：{c.phone} <span className="ml-2 font-serif text-base">{c.name}</span></div>
                                    ))}
                                </div>
                            </div>
                            <div className="mb-4 text-lg font-bold font-sans tracking-widest uppercase">日期：{toTaiwanYear(q.date)} &nbsp;&nbsp;&nbsp; 編號：{q.id}</div>
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4 table-fixed">
                                <thead className="bg-slate-100">
                                    <tr>
                                        <th className="border border-black p-3 w-[40%]">品名描述</th>
                                        <th className="border border-black p-3 w-[25%]">規格內容</th>
                                        <th className="border border-black p-3 w-[10%]">數量</th>
                                        <th className="border border-black p-3 w-[12%]">單價</th>
                                        <th className="border border-black p-3 w-[13%]">金額</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-3 text-left font-bold break-words">{item.name}</td>
                                            <td className="border border-black p-3 text-left text-sm break-words">{item.specs}</td>
                                            <td className="border border-black p-3">{item.qty}</td>
                                            <td className="border border-black p-3 font-mono">{(item.unitPrice || 0).toLocaleString()}</td>
                                            <td className="border border-black p-3 font-mono">{(item.qty * (item.unitPrice || 0)).toLocaleString()}</td>
                                        </tr>
                                    ))}
                                    {[...Array(Math.max(0, 10 - (q.items?.length||0)))].map((_, i) => (
                                        <tr key={`e-${i}`}><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td></tr>
                                    ))}
                                    {!isOrder && (
                                        <tr className="bg-slate-50 font-bold"><td colSpan="3" className="border border-black p-3 text-left uppercase">總額新台幣 &nbsp;&nbsp; {numberToChinese(q.amount).split('').join(' ')}</td><td colSpan="2" className="border border-black p-3 text-left font-mono text-xl">NT$ {(q.amount||0).toLocaleString()}</td></tr>
                                    )}
                                </tbody>
                            </table>
                            <div className="mt-8 flex justify-end pr-12 relative"><div className="text-center font-bold text-sm mr-4 mt-12">申堡辦公家具行<br/>負責人簽章</div><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} /></div>
                        </div>
                    );
                } else if (printDoc.type === 'delivery') {
                    const t = printDoc.data;
                    const labels = [{ t: "第一聯：會計聯", c: "border-slate-300" }, { t: "第二聯：客戶聯", c: "border-amber-400" }, { t: "第三聯：存查聯", c: "border-blue-400" }, { t: "第四聯：回單聯", c: "border-red-400" }];
                    return (
                        <div className="bg-white text-black font-sans print-container p-2">
                            <div className="no-print p-6 bg-emerald-50 mb-4 flex justify-between items-center">
                                <span className="font-bold text-emerald-800">一式四聯單列印模式</span>
                                <button onClick={()=>window.print()} className="bg-emerald-600 text-white px-6 py-2 rounded-lg">列印</button>
                            </div>
                            {labels.map((l, idx) => (
                                <div key={idx} className={`border-2 ${l.c} p-4 rounded-xl mb-4 relative overflow-hidden`} style={{ pageBreakInside: 'avoid' }}>
                                    <div className="flex justify-between items-start mb-2 border-b border-black pb-2">
                                        <div><h2 className="text-lg font-black">{companyInfo.name} - 送貨單</h2><p className="text-[10px]">{companyInfo.address}</p></div>
                                        <div className="text-right font-black text-sm">{l.t}</div>
                                    </div>
                                    <div className="flex justify-between text-xs mb-2"><span>客戶：{t.client}</span><span>單號：{t.id}</span></div>
                                    <table className="w-full border border-black text-[10px] text-center table-fixed">
                                        <thead><tr className="bg-slate-100"><th className="border border-black w-8">序</th><th className="border border-black">品名規格</th><th className="border border-black w-12">數量</th><th className="border border-black w-16">備註</th></tr></thead>
                                        <tbody>{t.items.map((it, i) => (<tr key={i}><td className="border border-black">{i+1}</td><td className="border border-black text-left px-1">{it.name} {it.specs}</td><td className="border border-black font-bold">{it.qty}</td><td className="border border-black"></td></tr>))}</tbody>
                                    </table>
                                    <div className="mt-2 flex justify-end gap-10 text-[10px] pt-2 border-t border-dotted border-black"><span>送貨員簽章：__________</span><span>客戶簽章：__________</span></div>
                                </div>
                            ))}
                        </div>
                    );
                }
            }

            // ==========================================
            // ⭐️ 智慧發票系統 (強化版 - 包含統編欄位)
            // ==========================================
            const handleInvoiceInputChange = (e) => {
                const { name, value } = e.target;
                let val = value;
                if (name === 'taxId') val = value.replace(/[^0-9]/g, '').substring(0, 8);
                if (name === 'invNo') val = value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
                
                const next = { ...newInvoiceData, [name]: val };
                if (name === 'taxType' || name === 'items') {
                    const net = (next.items || []).reduce((s, it) => s + (it.amount || 0), 0);
                    const tax = next.taxType === 'taxable' ? Math.round(net * 0.05) : 0;
                    setNewInvoiceData({ ...next, netAmount: net, tax, total: net + tax });
                } else setNewInvoiceData(next);
            };

            const renderInvoiceView = () => {
                if (invoiceView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-5xl mx-auto no-print">
                            <div className="flex justify-between items-center mb-8">
                                <h2 className="text-2xl font-black text-slate-800 tracking-tighter uppercase italic">發票與財務錄入中心</h2>
                                <button onClick={() => setInvoiceView('list')} className="bg-white border px-6 py-2 rounded-xl shadow-sm font-bold text-slate-500">返回列表</button>
                            </div>
                            <div className="bg-white rounded-[3rem] p-10 shadow-sm border border-slate-100">
                                {/* 類型切換器 */}
                                <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-10 w-fit">
                                    <button onClick={()=>setNewInvoiceData({...newInvoiceData, transactionType:'銷項'})} className={`px-10 py-3 rounded-xl font-black text-sm transition-all ${newInvoiceData.transactionType==='銷項'?'bg-indigo-600 text-white shadow-xl scale-105':'text-slate-400'}`}>銷項 (營收)</button>
                                    <button onClick={()=>setNewInvoiceData({...newInvoiceData, transactionType:'進項'})} className={`px-10 py-3 rounded-xl font-black text-sm transition-all ${newInvoiceData.transactionType==='進項'?'bg-red-700 text-white shadow-xl scale-105':'text-slate-400'}`}>進項 (成本)</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票號碼</label><input type="text" name="invNo" value={newInvoiceData.invNo} onChange={handleInvoiceInputChange} placeholder="XX-12345678" className="w-full px-6 py-4 rounded-2xl border font-mono text-xl focus:ring-4 focus:ring-indigo-100 transition-all outline-none" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票日期</label><input type="date" name="date" value={newInvoiceData.date} onChange={handleInvoiceInputChange} className="w-full px-6 py-4 rounded-2xl border font-bold" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票類型</label>
                                        <select name="type" value={newInvoiceData.type} onChange={handleInvoiceInputChange} className="w-full px-6 py-4 rounded-2xl border bg-slate-50 font-bold outline-none">
                                            <option value="三聯式">三聯式 (公司報帳用)</option><option value="二聯式">二聯式 (個人用)</option><option value="電子發票">電子發票</option>
                                        </select>
                                    </div>

                                    <div className="md:col-span-2 space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">買受人 / 供應商名稱</label><input type="text" name="client" value={newInvoiceData.client} onChange={handleInvoiceInputChange} className="w-full px-6 py-4 rounded-2xl border font-black text-lg focus:ring-4 focus:ring-indigo-100 outline-none" /></div>
                                    
                                    {/* ⭐️ 重點更新：統一編號欄位 */}
                                    <div className={`space-y-1 transition-all duration-500 ${newInvoiceData.type==='三聯式' ? 'opacity-100' : 'opacity-30'}`}>
                                        <label className="text-[10px] font-black text-indigo-600 uppercase tracking-widest">統一編號 (Tax ID)</label>
                                        <div className="relative">
                                            <input type="text" name="taxId" value={newInvoiceData.taxId} onChange={handleInvoiceInputChange} maxLength={8} placeholder="8位數字" className={`w-full px-6 py-4 rounded-2xl border font-mono text-xl tracking-widest outline-none ${newInvoiceData.type==='三聯式' ? 'bg-indigo-50 border-indigo-200 focus:ring-4 focus:ring-indigo-200' : 'bg-slate-50 cursor-not-allowed'}`} disabled={newInvoiceData.type!=='三聯式'} />
                                            {newInvoiceData.taxId.length === 8 && <div className="absolute right-4 top-4 text-emerald-500"><i className="ph-fill ph-check-circle text-2xl"></i></div>}
                                        </div>
                                    </div>
                                </div>

                                {/* 明細與稅額計算 */}
                                <div className={`p-10 rounded-[3rem] text-white shadow-2xl transition-colors duration-700 ${newInvoiceData.transactionType==='進項'?'bg-red-950':'bg-indigo-950'}`}>
                                    <div className="flex flex-col md:flex-row justify-between items-center gap-10">
                                        <div className="flex gap-10 flex-wrap">
                                            <div><div className="text-[10px] opacity-40 mb-1 uppercase tracking-widest">稅別</div>
                                                <div className="flex bg-white/10 p-1 rounded-xl">
                                                    <button onClick={()=>handleInvoiceInputChange({target:{name:'taxType', value:'taxable'}})} className={`px-6 py-2 text-xs rounded-lg transition-all ${newInvoiceData.taxType==='taxable'?'bg-white text-indigo-950 font-black shadow-lg':'text-white opacity-40'}`}>應稅 5%</button>
                                                    <button onClick={()=>handleInvoiceInputChange({target:{name:'taxType', value:'exempt'}})} className={`px-6 py-2 text-xs rounded-lg transition-all ${newInvoiceData.taxType==='exempt'?'bg-white text-indigo-950 font-black shadow-lg':'text-white opacity-40'}`}>免稅</button>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] opacity-40 mb-1 uppercase tracking-widest">銷售額 (未稅)</div>
                                                <input type="number" value={newInvoiceData.netAmount} onChange={(e)=>{
                                                    const net = Number(e.target.value);
                                                    const tax = newInvoiceData.taxType === 'taxable' ? Math.round(net * 0.05) : 0;
                                                    setNewInvoiceData({...newInvoiceData, netAmount: net, tax, total: net + tax});
                                                }} className="bg-transparent text-3xl font-black font-mono w-40 text-right outline-none border-b border-white/20" />
                                            </div>
                                            <div className="text-right border-l border-white/10 pl-10">
                                                <div className="text-[10px] opacity-40 mb-1 uppercase tracking-widest">營業稅額</div>
                                                <div className="text-3xl font-black font-mono text-emerald-400">${newInvoiceData.tax.toLocaleString()}</div>
                                            </div>
                                        </div>
                                        <div className="text-right border-l border-white/10 pl-10">
                                            <div className="text-[10px] opacity-40 mb-2 uppercase tracking-widest">總計金額 (含稅)</div>
                                            <div className="text-6xl font-black font-mono text-emerald-400 underline decoration-4 underline-offset-8 decoration-emerald-500/50">${newInvoiceData.total.toLocaleString()}</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <button onClick={()=>{
                                    if(!newInvoiceData.invNo || !newInvoiceData.client) return showToast("單號與對象為必填");
                                    if(newInvoiceData.type==='三聯式' && newInvoiceData.taxId.length!==8) return showToast("請確認統編為8碼數字");
                                    
                                    if(editingInvoiceId) setInvoices(invoices.map(i=>i.id===editingInvoiceId?newInvoiceData:i));
                                    else setInvoices([{...newInvoiceData, id: generateId()}, ...invoices]);
                                    
                                    setInvoiceView('list'); showToast("財務憑證已存檔");
                                }} className="w-full mt-10 bg-indigo-600 hover:bg-indigo-700 py-7 rounded-[2.5rem] text-white font-black text-2xl shadow-2xl active:scale-95 transition-all">確認儲存財務資料</button>
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-3xl font-black text-slate-800 italic tracking-tighter">財務收支與發票帳管</h2>
                            <div className="flex gap-4">
                                <div className="flex bg-slate-200/50 p-1.5 rounded-2xl">
                                    <button onClick={()=>exportData(invoices, "財務發票庫")} className="px-6 py-2 text-xs font-bold text-slate-600 hover:text-indigo-600"><i className="ph ph-export"></i> 備份</button>
                                    <button onClick={()=>fileInputRef.current.click()} className="px-6 py-2 text-xs font-bold text-slate-600 hover:text-emerald-600"><i className="ph ph-import"></i> 還原</button>
                                    <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={(e)=>importData(e, setInvoices, "發票資料庫")} />
                                </div>

            const renderDashboard = () => (
                <div className="p-20 text-center animate-slide-in">
                    <h1 className="text-5xl font-black text-slate-900 italic tracking-tighter mb-4 uppercase">申堡營運管理旗艦中樞 <span className="text-xl bg-indigo-600 text-white px-3 py-1 rounded-lg">v4.5</span></h1>
                    <p className="text-slate-400 font-bold text-lg mb-12">專業家具業會計、採購與物流一站式解決方案</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-10 max-w-5xl mx-auto mb-16">
                        <div className="bg-white p-12 rounded-[3.5rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                            <div className="text-6xl font-black text-indigo-600 mb-4">{quotes.length}</div>
                            <div className="text-xs font-black text-slate-400 uppercase tracking-widest">總估價單數</div>
                        </div>
                        <div className="bg-white p-12 rounded-[3.5rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                            <div className="text-6xl font-black text-emerald-600 mb-4">{logistics.filter(l=>l.status!=='已送達').length}</div>
                            <div className="text-xs font-black text-slate-400 uppercase tracking-widest">待配送任務</div>
                        </div>
                        <div className="bg-white p-12 rounded-[3.5rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                            <div className="text-6xl font-black text-red-600 mb-4">{invoices.filter(i=>i.status!=='已付款').length}</div>
                            <div className="text-xs font-black text-slate-400 uppercase tracking-widest">待收付款項</div>
                        </div>
                    </div>
                    <button onClick={()=>{
                        const backup = { products:productMaster, quotes, orders, logistics, invoices };
                        exportData(backup, "申堡全系統營運備份");
                    }} className="bg-slate-900 text-white px-12 py-5 rounded-[2.5rem] font-black shadow-2xl hover:bg-black transition-all active:scale-95">匯出全系統總雲端報表</button>
                </div>
            );

            const menuItems = [
                { id: 'dashboard', name: '營運指揮中心', icon: 'ph-chart-pie' },
                { id: 'products', name: '商品主檔庫', icon: 'ph-database' },
                { id: 'quotations', name: '估價單系統', icon: 'ph-file-text' },
                { id: 'orders', name: '採購管理', icon: 'ph-shopping-cart' },
                { id: 'logistics', name: '出貨與物流', icon: 'ph-truck' },
                { id: 'invoices', name: '財務發票系統', icon: 'ph-receipt' }
            ];

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col shadow-2xl z-20 no-print">
                        <div className="p-6 border-b border-slate-800"><h1 className="text-xl font-black italic tracking-tighter flex items-center gap-2 uppercase">申堡中樞 <span className="text-[10px] bg-indigo-500 px-2 py-0.5 rounded italic">v4.5</span></h1></div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); setLogisticsView('list'); setInvoiceView('list'); setQuoteView('list'); setProductView('list'); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all font-bold ${activeTab === item.id && !printDoc ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    <i className={`ph ${item.icon} text-xl`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-5 border-t border-slate-800 bg-slate-950/50 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center font-bold">莊</div>
                            <div className="text-left"><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 uppercase font-black tracking-widest">營運管理專家</div></div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full relative overflow-y-auto print-container custom-scrollbar bg-slate-50">
                        {toast && <div className="fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl bg-slate-900 text-white border-l-4 border-emerald-500 z-[100] font-bold animate-slide-in">{toast}</div>}
                        {!printDoc && activeTab === 'dashboard' && renderDashboard()}
                        {!printDoc && activeTab === 'products' && renderProductView()}
                        {!printDoc && activeTab === 'quotations' && renderQuoteView()}
                        {!printDoc && activeTab === 'orders' && renderOrderView()}
                        {!printDoc && activeTab === 'logistics' && renderLogisticsView()}
                        {!printDoc && activeTab === 'invoices' && renderInvoiceView()}
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-2xl z-50 no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`flex flex-col items-center p-2 rounded-2xl transition-colors ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50 shadow-inner' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
