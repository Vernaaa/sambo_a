<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 MVP - 旗艦版 v3.7</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; max-width: 100%; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            .page-break { page-break-after: always; }
            @page { margin: 10mm; size: A4 portrait; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            let numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        function App() {
            // --- 核心狀態 ---
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            // --- 發票狀態 ---
            const [invoiceView, setInvoiceView] = useState('list');
            const [editingInvoiceId, setEditingInvoiceId] = useState(null);
            const [newInvoiceData, setNewInvoiceData] = useState({ 
                invNo: '', type: '三聯式', date: getToday(), client: '', taxId: '', amount: 0, status: '未付款' 
            });

            // --- 商品狀態 ---
            const [productView, setProductView] = useState('list');
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            const [isIdLocked, setIsIdLocked] = useState(true);

            // --- 估價單狀態 ---
            const [quoteView, setQuoteView] = useState('list');
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', contactName: '', contactPhone: '', date: getToday(), items: [] });
            
            // --- 搜尋狀態 ---
            const [quoteSearch, setQuoteSearch] = useState('');
            const [customSpec, setCustomSpec] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [qty, setQty] = useState(1);
            const [showDropdown, setShowDropdown] = useState(false);

            const filteredProducts = productMaster.filter(p => 
                (p.name || '').toLowerCase().includes(quoteSearch.toLowerCase()) || 
                (p.id || '').toLowerCase().includes(quoteSearch.toLowerCase())
            );

            // 數據同步
            useEffect(() => { localStorage.setItem('shenbao_products', JSON.stringify(productMaster)); }, [productMaster]);
            useEffect(() => { localStorage.setItem('shenbao_quotes', JSON.stringify(quotes)); }, [quotes]);
            useEffect(() => { localStorage.setItem('shenbao_orders', JSON.stringify(orders)); }, [orders]);
            useEffect(() => { localStorage.setItem('shenbao_logistics', JSON.stringify(logistics)); }, [logistics]);
            useEffect(() => { localStorage.setItem('shenbao_invoices', JSON.stringify(invoices)); }, [invoices]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handlePrint = (type, data) => { setPrintDoc({ type, data }); setTimeout(() => window.print(), 300); };

            // ==========================================
            // 報表列印引擎
            // ==========================================
            if (printDoc) {
                const closePrint = () => setPrintDoc(null);

                if (printDoc.type === 'quote') {
                    const q = printDoc.data;
                    const qTotal = (q.amount || 0);
                    const totalRows = 12;
                    const itemsCount = q.items?.length || 0;
                    const emptyRows = Math.max(0, totalRows - itemsCount);

                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-indigo-50 rounded-xl flex justify-between items-center border border-indigo-200">
                                <span className="font-bold text-indigo-800">估價單預覽：表格已固定列數以維持工整</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4">估價單</h1>
                            <div className="flex justify-between items-end mb-4 text-lg">
                                <div className="font-bold border-b border-black pb-1 min-w-[300px]">{q.client} 台照</div>
                                <div className="text-right tracking-tighter">聯絡人: {q.contactName || '未指定'} &nbsp; 電話: <span className="font-sans">{q.contactPhone || q.clientPhone}</span></div>
                            </div>
                            <div className="mb-6 text-lg tracking-wider font-bold">中華民國 <span className="mx-2">{toTaiwanYear(q.date)}</span></div>
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4">
                                <thead className="bg-slate-100"><tr><th className="border border-black p-3 w-1/3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">單價</th><th className="border border-black p-3">金額</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}><td className="border border-black p-3 text-left font-bold">{item.name}</td><td className="border border-black p-3">{item.specs}</td><td className="border border-black p-3">{item.qty} 個</td><td className="border border-black p-3">{(item.unitPrice || 0).toLocaleString()}</td><td className="border border-black p-3">{(item.qty * item.unitPrice).toLocaleString()}</td><td className="border border-black p-3"></td></tr>
                                    ))}
                                    {[...Array(emptyRows)].map((_, i) => (
                                        <tr key={`empty-${i}`}>
                                            <td className="border border-black p-5 text-left">{i === 0 && itemsCount < totalRows ? '以下空白' : ''}</td>
                                            <td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td>
                                        </tr>
                                    ))}
                                    <tr className="bg-slate-50"><td colSpan="4" className="border border-black p-3 text-left font-bold tracking-widest uppercase">總額新台幣 &nbsp;&nbsp; {numberToChinese(qTotal).split('').join(' ')}</td><td colSpan="2" className="border border-black p-3 text-left font-bold font-mono text-xl">NT$ {qTotal.toLocaleString()}</td></tr>
                                </tbody>
                            </table>
                            <div className="mt-8 flex justify-end pr-16"><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} onError={(e)=>e.target.style.display='none'} /></div>
                        </div>
                    );
                } else if (printDoc.type === 'order') {
                    const o = printDoc.data;
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-sans print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-amber-50 rounded-xl flex justify-between items-center border border-amber-200">
                                <span className="font-bold text-amber-800">訂貨明細單預覽：簽核區已簡化</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <div className="flex justify-between items-start mb-6 border-b-2 border-black pb-6">
                                <div className="space-y-1"><h2 className="text-2xl font-black">{companyInfo.name}</h2><p>統編: {companyInfo.taxId}</p><p>店址: {companyInfo.address}</p><p>電話: {companyInfo.phone}</p></div>
                                <div className="text-right"><h1 className="text-4xl font-black tracking-widest mb-6 uppercase">訂貨明細單</h1><p>訂單編號: {o.id}</p><p>訂貨日期: {toTaiwanYear(o.date)}</p></div>
                            </div>
                            <div className="bg-slate-100 p-4 border border-black mb-6 font-bold text-lg">採購廠商：{o.supplier}</div>
                            <table className="w-full border-collapse border border-black text-center text-lg">
                                <thead className="bg-slate-200"><tr><th className="border border-black p-3">序號</th><th className="border border-black p-3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(o.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-4 font-mono">{idx+1}</td>
                                            <td className="border border-black p-4 text-left font-bold">{item.name}</td>
                                            <td className="border border-black p-4">{item.specs}</td>
                                            <td className="border border-black p-4 font-bold">{item.qty}</td>
                                            <td className="border border-black p-4 text-xs font-mono">{o.customRemark || `Ref: ${o.refQuote}`}</td>
                                        </tr>
                                    ))}
                                    {[...Array(5)].map((_, i) => (<tr key={i}><td className="border border-black p-6" colSpan="5"></td></tr>))}
                                </tbody>
                            </table>
                            <div className="mt-16 flex justify-end">
                                <div className="text-right pr-12 relative">
                                    <div className="mb-2 font-bold text-sm">申堡辦公家具行 負責人簽章</div>
                                    <img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} />
                                </div>
                            </div>
                        </div>
                    );
                } else if (printDoc.type === 'delivery') {
                    const t = printDoc.data;
                    const labels = [
                        { title: "第一聯：會計聯 (白)", color: "border-slate-300" },
                        { title: "第二聯：客戶聯 (黃)", color: "border-amber-300" },
                        { title: "第三聯：存查聯 (藍)", color: "border-blue-300" },
                        { title: "第四聯：回單聯 (紅)", color: "border-red-300" }
                    ];

                    return (
                        <div className="bg-white text-black font-sans print-container">
                            <div className="no-print p-6 bg-emerald-50 mb-4 flex justify-between items-center border border-emerald-200">
                                <span className="font-bold text-emerald-800"><i className="ph ph-printer"></i> 一式四聯單列印模式 (A4 自動縮放)</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg">立即列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg">返回</button></div>
                            </div>
                            <div className="space-y-4 p-2">
                                {labels.map((label, idx) => (
                                    <div key={idx} className={`border-2 ${label.color} p-4 rounded-lg relative overflow-hidden mb-2`} style={{ pageBreakInside: 'avoid' }}>
                                        <div className="flex justify-between items-start mb-2 border-b-2 border-black pb-2">
                                            <div>
                                                <h2 className="text-lg font-black">{companyInfo.name} - 送貨單</h2>
                                                <p className="text-[10px]">地址: {companyInfo.address} / 電話: {companyInfo.phone}</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-sm bg-slate-900 text-white px-2 py-0.5 rounded mb-1">{label.title}</div>
                                                <p className="text-[10px] font-mono">單號: {t.id} / 日期: {getToday()}</p>
                                            </div>
                                        </div>
                                        <div className="flex justify-between text-xs mb-2 font-bold">
                                            <span>客戶名稱: {t.client}</span>
                                            <span>來源單號: {t.refPo}</span>
                                        </div>
                                        <table className="w-full border-collapse border border-black text-[10px] text-center mb-4">
                                            <thead className="bg-slate-100">
                                                <tr><th className="border border-black p-1 w-8">序</th><th className="border border-black p-1">品名規格</th><th className="border border-black p-1 w-12">數量</th><th className="border border-black p-1 w-16">備註</th></tr>
                                            </thead>
                                            <tbody>
                                                {t.items.map((it, i) => (
                                                    <tr key={i}><td className="border border-black p-1">{i+1}</td><td className="border border-black p-1 text-left font-bold">{it.name} {it.specs}</td><td className="border border-black p-1 font-bold">{it.qty}</td><td className="border border-black p-1"></td></tr>
                                                ))}
                                                {[...Array(Math.max(1, 3 - t.items.length))].map((_, i) => (<tr key={i}><td className="border border-black p-2" colSpan="4"></td></tr>))}
                                            </tbody>
                                        </table>
                                        <div className="grid grid-cols-2 gap-8 mt-2">
                                            <div className="border-t border-black pt-1 text-[10px]">
                                                <span className="font-bold">送貨員簽章：</span>
                                                <div className="h-6"></div>
                                            </div>
                                            <div className="border-t border-black pt-1 text-[10px]">
                                                <span className="font-bold">客戶簽章：</span>
                                                <div className="h-6 text-slate-300 italic">請於此處簽署</div>
                                            </div>
                                        </div>
                                        {idx < 3 && <div className="mt-2 border-b border-dashed border-slate-300"></div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
            }

            // ==========================================
            // UI 手法 (CRUD, Logic)
            // ==========================================
            const exportSystemData = () => {
                const backup = { products: productMaster, quotes, orders, logistics, invoices };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `申堡旗艦版備份_${getToday()}.json`;
                a.click();
                showToast("資料備份成功");
            };

            const handleSaveProduct = () => {
                if(!newProductData.name) return showToast("品名必填");
                const price = Number(newProductData.unitPrice) || 0;
                if(editingProductId) {
                    setProductMaster(productMaster.map(p => p.id === editingProductId ? {...newProductData, unitPrice: price} : p));
                    showToast("商品已更新");
                } else {
                    const id = newProductData.id || `SKU-${Date.now().toString().slice(-5)}`;
                    if(productMaster.some(p => p.id === id)) return showToast("編號重複");
                    setProductMaster([{...newProductData, id, unitPrice: price}, ...productMaster]);
                    showToast("商品已建檔");
                }
                setProductView('list'); setEditingProductId(null); setIsIdLocked(true);
            };

            const generateOrdersFromQuotes = () => {
                const confirmed = quotes.filter(q => q.status === '已確認' && !orders.some(o => o.refQuote === q.id));
                if(!confirmed.length) return showToast("無可拋轉的單據");
                const newO = [...orders], newL = [...logistics];
                confirmed.forEach(q => {
                    const groups = {};
                    q.items.forEach(i => { const s = i.supplier || '未指定'; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
                    Object.keys(groups).forEach(sup => {
                        const poId = `PO-${getToday().replace(/-/g,'')}-${generateId().substring(0,4).toUpperCase()}`;
                        newO.push({ id: poId, date: getToday(), supplier: sup, refQuote: q.id, client: q.client, items: groups[sup], customRemark: `來源：${q.id}` });
                        newL.push({ id: `DO-${poId.split('-')[1]}`, client: q.client, refPo: poId, items: groups[sup], status: '待進貨' });
                    });
                });
                setOrders(newO); setLogistics(newL); showToast("智慧拋轉成功");
            };

            // ==========================================
            // ⭐️ 發票系統處理邏輯
            // ==========================================
            const handleSaveInvoice = () => {
                if (!newInvoiceData.invNo || !newInvoiceData.client) return showToast("請輸入發票號碼與客戶名稱");
                
                if (editingInvoiceId) {
                    setInvoices(invoices.map(inv => inv.id === editingInvoiceId ? { ...newInvoiceData, id: editingInvoiceId } : inv));
                    showToast("發票資料已更新");
                } else {
                    const newId = generateId();
                    setInvoices([{ ...newInvoiceData, id: newId }, ...invoices]);
                    showToast("發票已建立並入帳");
                }
                setInvoiceView('list');
                setEditingInvoiceId(null);
                setNewInvoiceData({ invNo: '', type: '三聯式', date: getToday(), client: '', taxId: '', amount: 0, status: '未付款' });
            };

            const renderInvoices = () => {
                if (invoiceView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-black text-slate-800 tracking-wider">{editingInvoiceId ? '修正發票記錄' : '手動錄入發票'}</h2>
                                <button onClick={() => setInvoiceView('list')} className="bg-white border px-4 py-2 rounded-xl shadow-sm font-bold text-slate-500">返回列表</button>
                            </div>
                            <div className="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">發票號碼 (8位或10位)</label><input type="text" value={newInvoiceData.invNo} onChange={(e)=>setNewInvoiceData({...newInvoiceData, invNo: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-mono text-lg" placeholder="例: AB-12345678" /></div>
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">發票類型</label>
                                        <select value={newInvoiceData.type} onChange={(e)=>setNewInvoiceData({...newInvoiceData, type: e.target.value})} className="w-full px-4 py-3 border rounded-xl bg-slate-50">
                                            <option value="三聯式">三聯式 (公司)</option><option value="二聯式">二聯式 (個人)</option><option value="電子發票">電子發票</option>
                                        </select>
                                    </div>
                                    <div className="md:col-span-2"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">客戶/抬頭</label><input type="text" value={newInvoiceData.client} onChange={(e)=>setNewInvoiceData({...newInvoiceData, client: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-bold" /></div>
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">統一編號</label><input type="text" value={newInvoiceData.taxId} onChange={(e)=>setNewInvoiceData({...newInvoiceData, taxId: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-mono" placeholder="例: 87739223" /></div>
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">發票日期</label><input type="date" value={newInvoiceData.date} onChange={(e)=>setNewInvoiceData({...newInvoiceData, date: e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">總金額 (含稅)</label><input type="number" value={newInvoiceData.amount} onChange={(e)=>setNewInvoiceData({...newInvoiceData, amount: Number(e.target.value)})} className="w-full px-4 py-3 border rounded-xl font-mono text-lg text-emerald-600 font-black text-right" /></div>
                                    <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase">目前狀態</label>

                                                    <tbody>
                                                        {newQuoteData.items.map((it, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-slate-50"><td className="p-4 font-bold text-slate-700">{it.name}<div className="text-xs font-normal text-slate-400 mt-1">{it.specs}</div></td><td className="p-4 text-center font-mono">{it.qty}</td><td className="p-4 text-right font-mono">${it.unitPrice.toLocaleString()}</td><td className="p-4 text-right font-black text-indigo-600 font-mono">${(it.qty * it.unitPrice).toLocaleString()}</td><td className="p-4 text-center"><button onClick={()=>setNewQuoteData({...newQuoteData, items:newQuoteData.items.filter((_,i)=>i!==idx)})} className="text-red-400 hover:text-red-600 transition-colors"><i className="ph ph-trash"></i></button></td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                                <div className="p-10 flex justify-between items-center bg-slate-50 border-t">
                                                    <div className="bg-white p-4 rounded-3xl border-l-8 border-l-emerald-500 font-black shadow-sm tracking-widest text-emerald-800">{numberToChinese(newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0))}</div>
                                                    <div className="text-right"><div className="text-4xl font-black mb-6 font-mono text-slate-800">總計: ${newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0).toLocaleString()}</div><button onClick={()=>{const q={...newQuoteData, id: editingQuoteId || `Q-${getToday().replace(/-/g,'')}-${quotes.length+1}`, amount: newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0), status: '草稿'}; if(editingQuoteId) setQuotes(quotes.map(x=>x.id===editingQuoteId?q:x)); else setQuotes([q,...quotes]); setQuoteView('list'); showToast("存檔完成")}} className="bg-indigo-600 text-white px-10 py-5 rounded-[2rem] font-black shadow-2xl active:scale-95 transition-transform hover:bg-indigo-700">完成並儲存估價單</button></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {!printDoc && activeTab === 'orders' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-black tracking-wider text-slate-800 uppercase">採購與訂貨中心</h2>
                                    <button onClick={generateOrdersFromQuotes} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-indigo-700 active:scale-95 transition-all"><i className="ph ph-magic-wand"></i> 執行智慧拆單拋轉</button>
                                </div>
                                <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs font-black text-slate-400">採購單號</th><th className="p-5 text-xs font-black text-slate-400">供應商廠牌</th><th className="p-5 text-xs font-black text-slate-400">內部管理備註</th><th className="p-5 text-xs font-black text-slate-400 text-center">操作</th></tr></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50/80 transition-colors">
                                                    <td className="p-5 font-mono font-bold text-slate-700">{o.id}<div className="text-xs font-normal text-slate-400 mt-1">{o.date}</div></td>
                                                    <td className="p-5 font-black text-indigo-700 text-lg uppercase">{o.supplier}</td>
                                                    <td className="p-5">
                                                        <input 
                                                            type="text" 
                                                            value={o.customRemark || ''} 
                                                            onChange={(e) => setOrders(orders.map(x => x.id === o.id ? {...x, customRemark: e.target.value} : x))}
                                                            className="w-full bg-slate-50 px-3 py-2 rounded-lg text-sm border border-transparent focus:border-indigo-300 focus:bg-white transition-all font-bold text-slate-600"
                                                            placeholder="點擊輸入管理標記..."
                                                        />
                                                    </td>
                                                    <td className="p-5 text-center flex justify-center gap-2">
                                                        <button onClick={()=>handlePrint('order', o)} className="bg-amber-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-amber-600/20 hover:bg-amber-700 transition-colors">列印採購單</button>
                                                        <button onClick={()=>{if(window.confirm("徹底刪除此訂單記錄？")) setOrders(orders.filter(x=>x.id!==o.id))}} className="text-slate-300 hover:text-red-400 px-3 transition-colors"><i className="ph ph-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {orders.length === 0 && <tr><td colSpan="4" className="p-16 text-center text-slate-300 font-bold tracking-widest italic">目前無進行中採購任務</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {!printDoc && activeTab === 'logistics' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                                <h2 className="text-2xl font-black mb-8 tracking-widest text-slate-800">出貨簽收看板</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {logistics.map(t=>(
                                        <div key={t.id} className="bg-white p-8 rounded-[2.5rem] border shadow-sm relative group overflow-hidden">
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${t.status==='待進貨'?'bg-amber-400':'bg-emerald-500'}`}></div>
                                            <div className="flex justify-between items-start mb-6">
                                                <div><div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">{t.id}</div><h3 className="text-xl font-black text-slate-800 mt-1">{t.client}</h3></div>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100 min-h-[100px]">
                                                {t.items.map((it,i)=>(<div key={i} className="flex justify-between text-sm mb-1 last:mb-0"><span className="text-slate-600 font-bold truncate pr-4">{it.name}</span><span className="font-black text-indigo-600 shrink-0">x{it.qty}</span></div>))}
                                            </div>
                                            <div className="space-y-2">
                                                <button onClick={()=>handlePrint('delivery', t)} className="w-full py-3 bg-white border-2 border-emerald-600 text-emerald-700 rounded-2xl font-black text-sm flex items-center justify-center gap-2 hover:bg-emerald-50 transition-colors shadow-sm">
                                                    <i className="ph ph-printer"></i> 列印送貨單 (四聯)
                                                </button>
                                                {t.status !== '已送達' ? (
                                                    <button onClick={()=>{setLogistics(logistics.map(x=>x.id===t.id?{...x, status:t.status==='待進貨'?'配送中':'已送達'}:x)); showToast("進度已更新")}} className={`w-full py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all text-sm ${t.status==='待進貨'?'bg-indigo-600 text-white shadow-indigo-600/20 hover:bg-indigo-700':'bg-emerald-600 text-white shadow-emerald-600/20 hover:bg-emerald-700'}`}>
                                                        {t.status==='待進貨'?'確認入庫，準備配送':'確認送達完成簽收'}
                                                    </button>
                                                ) : (
                                                    <div className="w-full py-4 bg-emerald-50 text-emerald-700 rounded-2xl font-black text-center flex items-center justify-center gap-2 border border-emerald-200 text-sm italic">
                                                        <i className="ph-fill ph-check-circle"></i> 任務已送抵結案
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {logistics.length === 0 && <div className="col-span-full p-20 text-center text-slate-300 font-black italic tracking-widest bg-white rounded-[2.5rem] border-2 border-dashed">暫無出貨配送任務</div>}
                                </div>
                            </div>
                        )}

                        {!printDoc && activeTab === 'invoices' && renderInvoices()}
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`flex flex-col items-center p-2 rounded-2xl transition-colors ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50 shadow-inner' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
