<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.7</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; border: 2px solid black !important; }
            th, td { border: 1px solid black !important; padding: 8px !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = (prefix = '') => prefix + Math.random().toString(36).substr(2, 6).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 ---
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('sb_p_v5_7') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q_v5_7') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o_v5_7') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l_v5_7') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i_v5_7') || '[]'));
            const [inputInvoices, setInputInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_input_v5_7') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p_v5_7', JSON.stringify(products));
                localStorage.setItem('sb_q_v5_7', JSON.stringify(quotes));
                localStorage.setItem('sb_o_v5_7', JSON.stringify(orders));
                localStorage.setItem('sb_l_v5_7', JSON.stringify(logistics));
                localStorage.setItem('sb_i_v5_7', JSON.stringify(invoices));
                localStorage.setItem('sb_input_v5_7', JSON.stringify(inputInvoices));
            }, [products, quotes, orders, logistics, invoices, inputInvoices]);

            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // ==========================================
            // ⭐️ 商品資料庫 (CRUD)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const handlePSave = () => {
                if (!pForm.name) return triggerToast("請輸入商品名稱");
                if (pEdit === 'new') setProducts([{ ...pForm, id: pForm.id || generateId('P') }, ...products]);
                else setProducts(products.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); triggerToast("商品庫已更新");
            };

            // ==========================================
            // ⭐️ 採購管理 (手動新增，無金額報表)
            // ==========================================
            const [oView, setOView] = useState('list');
            const [oForm, setOForm] = useState({ supplier: '', client: '', date: getToday(), items: [] });
            const [selSku, setSelSku] = useState('');
            const [selQty, setSelQty] = useState(1);

            const handleAddOrderItem = () => {
                const p = products.find(x => x.id === selSku);
                if (!p) return;
                setOForm({ ...oForm, items: [...oForm.items, { ...p, qty: selQty }] });
                setSelSku(''); setSelQty(1);
            };

            const saveOrder = () => {
                if (!oForm.supplier || oForm.items.length === 0) return triggerToast("請填寫供應商與品項");
                const newO = { ...oForm, id: generateId('PO'), status: 'Ordered' };
                setOrders([newO, ...orders]);
                setLogistics([{ ...newO, status: '待配送' }, ...logistics]);
                setOView('list'); triggerToast("採購單已建立");
            };

            // ==========================================
            // ⭐️ 財務發票 (進項/銷項、二三聯)
            // ==========================================
            const [invType, setInvType] = useState('銷項'); // 銷項 vs 進項
            const [invForm, setInvForm] = useState({ 
                category: '三聯式', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, date: getToday() 
            });

            const updateInvAmount = (val, field) => {
                let net = 0, tax = 0, total = 0;
                if (field === 'net') {
                    net = Number(val);
                    tax = Math.round(net * 0.05);
                    total = net + tax;
                } else if (field === 'total') {
                    total = Number(val);
                    net = Math.round(total / 1.05);
                    tax = total - net;
                }
                setInvForm({ ...invForm, netAmount: net, taxAmount: tax, totalAmount: total });
            };

            const handleCreateInvoice = () => {
                if (!invForm.client || invForm.totalAmount <= 0) return triggerToast("資料不完整");
                if (invForm.category === '三聯式' && !/^\d{8}$/.test(invForm.taxId)) return triggerToast("三聯式發票必須輸入 8 位數統編");
                
                const finalInv = { ...invForm, id: generateId('INV') };
                if (invType === '銷項') setInvoices([finalInv, ...invoices]);
                else setInputInvoices([finalInv, ...inputInvoices]);
                
                setInvForm({ category: '三聯式', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, date: getToday() });
                triggerToast(`${invType}發票紀錄已建立`);
            };

            // ==========================================
            // ⭐️ 智慧匯入與備份
            // ==========================================
            const [importReview, setImportReview] = useState(null);
            const handleRestoreRequest = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        let importedProducts = json.products || (Array.isArray(json) ? json : []);
                        const existingIds = new Set(products.map(p => p.id));
                        const news = importedProducts.filter(p => !existingIds.has(p.id));
                        const conflicts = importedProducts.filter(p => existingIds.has(p.id));
                        setImportReview({ news, conflicts, fullData: json, isFullSystem: !!json.products });
                        e.target.value = '';
                    } catch (err) { triggerToast("檔案格式錯誤"); }
                };
                reader.readAsText(file);
            };

            const commitImport = (strategy) => {
                if (strategy === 'replace' && importReview.isFullSystem) {
                    const { fullData: fd } = importReview;
                    setProducts(fd.products || []); setQuotes(fd.quotes || []); setOrders(fd.orders || []);
                    setLogistics(fd.logistics || []); setInvoices(fd.invoices || []); setInputInvoices(fd.inputInvoices || []);
                    triggerToast("全系統還原成功");
                } else {
                    setProducts([...importReview.news, ...products]);
                    triggerToast(`新增 ${importReview.news.length} 筆品項`);
                }
                setImportReview(null);
            };

            const handleExport = () => {
                const data = { products, quotes, orders, logistics, invoices, inputInvoices };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `SB_Core_v5.7_${getToday()}.json`; a.click();
            };

            // ==========================================
            // ⭐️ 列印引擎 (採購單無金額)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                const isOrder = printDoc.type === 'order';
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4">
                            <button onClick={()=>window.print()} className="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg">直接列印</button>
                            <button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-8 py-2 rounded-xl font-bold border">返回中樞</button>
                        </div>
                        <h1 className="text-center text-5xl font-bold tracking-[0.8em] border-b-8 border-black pb-6 mb-8 uppercase italic">{isOrder ? '採購訂製單' : '估價單'}</h1>
                        <div className="flex justify-between mb-8 text-2xl font-bold">
                            <div className="underline decoration-4 underline-offset-8 leading-loose">{d.client || d.supplier} 台照</div>
                            <div className="text-right leading-relaxed font-mono text-lg">日期：{d.date} <br/> 單號：{d.id} {d.supplier && isOrder && <><br/>供應商：{d.supplier}</>}</div>
                        </div>
                        <table className="w-full border-collapse border-[2px] border-black text-center mb-0">
                            <thead className="bg-slate-50">
                                <tr className="text-xl font-black">
                                    <th className="p-4 border-r border-black w-[60%]">品名規格項目</th>
                                    <th className="p-4 border-r border-black w-[20%]">數量</th>
                                    {!isOrder && <><th className="p-4 border-r border-black w-[10%]">單價</th><th className="p-4 w-[10%]">金額</th></>}
                                    {isOrder && <th className="p-4 w-[20%]">備註</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="text-xl h-16 border-b border-black">
                                        <td className="p-4 border-r border-black text-left font-black">{it.name} <span className="text-sm font-normal block">{it.specs}</span></td>
                                        <td className="p-4 border-r border-black font-mono">{it.qty}</td>
                                        {!isOrder && <><td className="p-4 border-r border-black font-mono">{it.unitPrice?.toLocaleString()}</td><td className="p-4 font-mono font-bold text-right">{(it.qty * it.unitPrice).toLocaleString()}</td></>}
                                        {isOrder && <td className="p-4"></td>}
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 12 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="h-16 border-b border-black"><td className="border-r border-black"></td><td className="border-r border-black"></td>{!isOrder && <><td className="border-r border-black"></td><td></td></>} {isOrder && <td></td>}</tr>
                                ))}
                            </tbody>
                            {!isOrder && (
                                <tfoot>
                                    <tr className="bg-slate-100 font-black text-2xl border-t-2 border-black">
                                        <td colSpan="3" className="p-6 border-r border-black text-left tracking-[0.2em]">總計新台幣：{numberToChinese(d.total)}</td>
                                        <td className="p-6 text-right font-mono text-3xl">${d.total?.toLocaleString()}</td>
                                    </tr>
                                </tfoot>
                            )}
                        </table>
                        <div className="mt-20 flex justify-end">
                            <img src="./因張good.png" className="w-64 h-auto opacity-95" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden relative">
                    {/* 智慧還原彈窗 */}
                    {importReview && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="bg-white p-12 rounded-[4rem] max-w-2xl w-full shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-8 flex items-center gap-3"><i className="ph ph-shield-check text-indigo-600"></i> 數據匯入校驗</h3>
                                <div className="grid grid-cols-2 gap-6 mb-10 text-center">
                                    <div className="p-8 bg-emerald-50 rounded-3xl">
                                        <div className="text-5xl font-black text-emerald-600 mb-2">{importReview.news.length}</div>
                                        <div className="text-xs font-black uppercase text-emerald-800 tracking-widest">全新商品</div>
                                    </div>
                                    <div className="p-8 bg-red-50 rounded-3xl">
                                        <div className="text-5xl font-black text-red-600 mb-2">{importReview.conflicts.length}</div>
                                        <div className="text-xs font-black uppercase text-red-800 tracking-widest">重複衝突</div>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <button onClick={()=>commitImport('newOnly')} className="w-full py-6 bg-indigo-600 text-white rounded-[2.5rem] font-black text-xl shadow-xl flex items-center justify-center gap-3">僅匯入新品項</button>
                                    {importReview.isFullSystem && <button onClick={()=>commitImport('replace')} className="w-full py-6 bg-white border-4 border-slate-900 text-slate-900 rounded-[2.5rem] font-black text-xl">全系統數據還原 (含進項發票)</button>}
                                    <button onClick={()=>setImportReview(null)} className="w-full py-4 text-slate-400 font-black">放棄取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 no-print shadow-2xl">
                        <div className="p-10 border-b border-slate-800"><h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none text-blue-400">SHENBAO <span className="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded ml-1 tracking-normal">v5.7</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => { setActiveTab(tab); setOView('list'); }} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${tab==='dashboard'?'ph-layout':tab==='products'?'ph-package':tab==='quotations'?'ph-file-text':tab==='orders'?'ph-shopping-cart':tab==='logistics'?'ph-truck':'ph-receipt'} mr-3 text-lg align-middle`}></i> {tab==='orders'?'採購管理':tab==='products'?'庫存資料':tab==='invoices'?'財務系統':tab==='quotations'?'報價單':'物流看板'}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800 bg-slate-950/40">
                            <div className="flex items-center gap-4 p-2 bg-slate-800/50 rounded-3xl border border-white/5 shadow-inner">
                                <div className="w-12 h-12 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black">莊</div>
                                <div><div className="text-sm font-black text-slate-200 leading-none mb-1">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase tracking-widest">Master Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/50 custom-scrollbar relative">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3 border border-white/10"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* Dashboard */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto space-y-16 py-10 text-center animate-slide-in">
                                <div className="space-y-4"><h1 className="text-7xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡中樞營運系統</h1><p className="text-slate-400 font-black text-sm tracking-[0.6em] uppercase">Enterprise Finance & Logistics v5.7</p></div>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-10">
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-indigo-600 mb-2">{products.length}</div><div className="text-xs font-black text-slate-400 uppercase tracking-widest">商品SKU</div></div>
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-emerald-600 mb-2">{invoices.length}</div><div className="text-xs font-black text-slate-400 uppercase tracking-widest">銷項發票</div></div>
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-red-500 mb-2">{inputInvoices.length}</div><div className="text-xs font-black text-slate-400 uppercase tracking-widest">進項發票</div></div>
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-amber-500 mb-2">{orders.length}</div><div className="text-xs font-black text-slate-400 uppercase tracking-widest">採購訂單</div></div>
                                </div>
                                <div className="flex justify-center gap-6 pt-10 no-print">
                                    <button onClick={handleExport} className="bg-slate-900 text-white px-12 py-6 rounded-[2.5rem] font-black shadow-xl hover:bg-black transition-all flex items-center gap-3"><i className="ph ph-export text-xl"></i> 下載全系統備份</button>
                                    <button onClick={()=>document.getElementById('sysRes').click()} className="bg-white border-4 border-slate-900 text-slate-900 px-12 py-6 rounded-[2.5rem] font-black shadow-xl hover:bg-slate-50 transition-all flex items-center gap-3"><i className="ph ph-import text-xl"></i> 智慧還原</button>
                                    <input id="sysRes" type="file" className="hidden" onChange={handleRestoreRequest} />
                                </div>
                            </div>
                        )}

                        {/* 產品資料庫 */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">商品資料庫</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Master Product Hub</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black shadow-xl">+ 新增商品項目</button>
                                </div>
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100"><input type="text" placeholder="搜尋 SKU 或 品名..." value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full px-10 py-5 bg-slate-50 border-transparent rounded-[2rem] outline-none font-bold text-lg" /></div>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">編號 / 廠牌</th><th className="p-10 w-1/2">品名規格</th><th className="p-10 text-right w-1/4">單價</th><th className="p-10 text-center w-40">操作</th></thead>
                                        <tbody>{filteredP.map(p => (<tr key={p.id} className="border-b hover:bg-slate-50 transition-colors group"><td className="p-10 font-mono text-sm text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-2 text-base uppercase">{p.supplier || 'N/A'}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{p.name}<div className="text-sm font-normal text-slate-400 mt-2 italic">{p.specs}</div></td><td className="p-10 text-right font-mono font-black text-3xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td><td className="p-10 text-center"><button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-4 bg-slate-50 text-slate-400 rounded-2xl hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-2xl"></i></button></td></tr>))}</tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 採購管理 (手動新增，無金額報表) */}
                        {activeTab === 'orders' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">採購管理</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Supplier Order Control</p></div>
                                    {oView === 'list' && <button onClick={()=>{setOForm({supplier:'', client:'', date:getToday(), items:[]}); setOView('create')}} className="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black shadow-xl">+ 建立採購訂製單</button>}
                                </div>
                                {oView === 'create' ? (
                                    <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12 animate-slide-in max-w-5xl mx-auto">
                                        <div className="grid grid-cols-2 gap-10">
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">供應商/廠牌</label><input type="text" value={oForm.supplier} onChange={e=>setOForm({...oForm, supplier:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none focus:border-indigo-200" placeholder="大日 / 寶維 / ..." /></div>
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">對應客戶專案</label><input type="text" value={oForm.client} onChange={e=>setOForm({...oForm, client:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none" placeholder="環保局 / 某某課室" /></div>
                                        </div>
                                        <div className="bg-slate-50 p-10 rounded-[4rem] border-4 border-dashed border-slate-200 space-y-6">
                                            <div className="flex gap-6 items-end">
                                                <div className="flex-1 space-y-2"><select value={selSku} onChange={e=>setSelSku(e.target.value)} className="w-full px-8 py-5 rounded-3xl border-2 border-white bg-white font-black text-lg outline-none shadow-sm"><option value="">-- 選取產品項目 --</option>{products.map(p => <option key={p.id} value={p.id}>[{p.supplier}] {p.name}</option>)}</select></div>
                                                <div className="w-32 space-y-2"><input type="number" value={selQty} onChange={e=>setSelQty(Number(e.target.value))} className="w-full px-8 py-5 rounded-3xl border-2 border-white text-center font-black text-xl shadow-sm outline-none" /></div>
                                                <button onClick={handleAddOrderItem} className="bg-slate-900 text-white px-10 py-5 rounded-3xl font-black shadow-lg">加入</button>
                                            </div>
                                        </div>
                                        {oForm.items.length > 0 && (
                                            <div className="rounded-[3rem] border-2 border-slate-100 overflow-hidden bg-white shadow-inner">
                                                <table className="w-full text-left table-fixed">
                                                    <thead className="bg-slate-50 font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-8 w-3/4">品項規格項目</th><th className="p-8 text-center w-1/4">數量</th><th className="p-8 w-20"></th></thead>
                                                    <tbody>{oForm.items.map((it, i) => (<tr key={i} className="border-t font-black"><td className="p-8 text-lg">{it.name}<div className="text-xs font-normal text-slate-400 mt-1">{it.specs}</div></td><td className="p-8 text-center font-mono font-bold text-xl">{it.qty}</td><td className="p-8 text-center"><button onClick={()=>setOForm({...oForm, items: oForm.items.filter((_,idx)=>idx!==i)})} className="text-red-300 hover:text-red-500"><i className="ph ph-trash text-2xl"></i></button></td></tr>))}</tbody>
                                                </table>
                                            </div>
                                        )}
                                        <div className="flex justify-end gap-6 pt-10">
                                            <button onClick={saveOrder} className="bg-indigo-600 text-white px-16 py-6 rounded-[2.5rem] font-black text-2xl shadow-xl hover:bg-indigo-700 transition-all">確認簽發採購單</button>
                                            <button onClick={()=>setOView('list')} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-[2.5rem] font-black">取消</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden animate-slide-in border-slate-100">
                                        <table className="w-full text-left table-fixed">
                                            <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">單號 / 日期</th><th className="p-10 w-48">供應商廠牌</th><th className="p-10 w-1/2">客戶來源</th><th className="p-10 text-center w-40">功能</th></thead>
                                            <tbody>{orders.map(o => (<tr key={o.id} className="border-b hover:bg-slate-50 transition-colors group"><td className="p-10 font-mono text-sm text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-2 text-base">{o.date}</div></td><td className="p-10"><span className="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-2xl font-black text-sm uppercase">{o.supplier}</span></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{o.client}</td><td className="p-10 text-center"><button onClick={()=>setPrintDoc({type:'order', data:o})} className="p-5 bg-slate-50 text-amber-600 rounded-3xl hover:bg-amber-500 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-3xl"></i></button></td></tr>))}</tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 財務系統 (銷項/進項、二三聯) */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-10 max-w-5xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">財務中樞系統</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Financial & Tax Control</p></div>
                                    <div className="flex bg-slate-200 p-2 rounded-3xl gap-2 font-black">
                                        <button onClick={()=>setInvType('銷項')} className={`px-8 py-3 rounded-2xl transition-all ${invType==='銷項'?'bg-white text-indigo-600 shadow-md':'text-slate-500'}`}>銷項發票(給客)</button>
                                        <button onClick={()=>setInvType('進項')} className={`px-8 py-3 rounded-2xl transition-all ${invType==='進項'?'bg-white text-red-600 shadow-md':'text-slate-500'}`}>進項發票(廠商)</button>
                                    </div>
                                </div>
                                <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票類型</label><select value={invForm.category} onChange={e=>setInvForm({...invForm, category:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 bg-slate-50 font-black text-xl outline-none focus:bg-white shadow-inner"><option>三聯式</option><option>二聯式</option><option>電子收據</option></select></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">統一編號 (三聯式必填)</label><input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} placeholder="8 位數字" className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-mono text-3xl tracking-[0.4em] bg-slate-50 focus:bg-white outline-none" /></div>
                                        <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{invType==='銷項'?'客戶買受人':'開立供應商'}</label><input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none focus:bg-white shadow-inner" /></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">未稅金額</label><input type="number" value={invForm.netAmount} onChange={e=>updateInvAmount(e.target.value, 'net')} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-mono text-3xl font-black bg-slate-50 focus:bg-white shadow-inner" /></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">含稅總計</label><input type="number" value={invForm.totalAmount} onChange={e=>updateInvAmount(e.target.value, 'total')} className={`w-full px-8 py-5 rounded-3xl border-4 font-mono text-3xl font-black bg-white shadow-inner ${invType==='銷項'?'border-emerald-100 text-emerald-600':'border-red-100 text-red-600'}`} /></div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-14 rounded-[4rem] flex justify-between items-center shadow-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/10 rounded-full -mr-40 -mt-40 blur-3xl group-hover:bg-indigo-500/20 transition-all"></div>
                                        <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-2 font-black tracking-widest">國字大寫金額 (自動計算)</div><div className="text-3xl font-black tracking-[0.2em] text-indigo-300">{numberToChinese(invForm.totalAmount)}</div></div>
                                        <div className="text-right z-10"><div className="text-[10px] opacity-30 mb-2 uppercase font-black tracking-widest">營業稅(5%): ${invForm.taxAmount.toLocaleString()}</div><div className={`text-8xl font-black font-mono tracking-tighter ${invType==='銷項'?'text-emerald-400':'text-red-400'}`}>${invForm.totalAmount.toLocaleString()}</div></div>
                                    </div>
                                    <button onClick={handleCreateInvoice} className={`w-full py-10 rounded-[3rem] font-black text-4xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-4 ${invType==='銷項'?'bg-indigo-600 text-white':'bg-red-600 text-white shadow-red-200'}`}><i className="ph ph-receipt text-5xl"></i> 確認簽發紀錄</button>
                                </div>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden border-slate-100">
                                    <h4 className="p-10 font-black text-slate-400 uppercase tracking-widest border-b bg-slate-50 text-xs">{invType}發票歷史清單</h4>
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">日期 / 統編</th><th className="p-10 w-1/2">對象資訊</th><th className="p-10 text-right w-1/4">總計金額</th></thead>
                                        <tbody>{(invType==='銷項'?invoices:inputInvoices).map(i => (<tr key={i.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-10 font-mono text-sm text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-2 text-base uppercase">{i.taxId || i.category}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{i.client}</td><td className="p-10 text-right font-black text-slate-800 text-3xl">${i.totalAmount?.toLocaleString()}</td></tr>))}</tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 物流與報價單暫略展示（保留功能邏輯） */}
                        {activeTab === 'quotations' && <div className="p-20 text-center text-slate-300 font-black text-4xl italic uppercase animate-slide-in">報價單模組運作中 <br/><span className="text-sm font-bold tracking-widest opacity-50 uppercase">Quotation Logic Active</span></div>}
                        {activeTab === 'logistics' && <div className="p-20 text-center text-slate-300 font-black text-4xl italic uppercase animate-slide-in">物流調度看板運作中 <br/><span className="text-sm font-bold tracking-widest opacity-50 uppercase">Logistics Logic Active</span></div>}

                    </main>

                    {/* 編輯品項彈窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-10 text-indigo-600 italic uppercase">編輯商品</h3>
                                <div className="space-y-6 mb-10">
                                    <div className="grid grid-cols-2 gap-4"><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">SKU編號</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-mono" /></div><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">廠牌供應商</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-8 py-4 rounded-2xl border-2 font-black" /></div></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">品名規格</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">詳細參數</label><input type="text" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">建議單價</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-6 py-4 rounded-2xl border-2 text-right font-black text-3xl text-emerald-600" /></div>
                                </div>
                                <div className="flex gap-4"><button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl">儲存</button><button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black">取消</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
