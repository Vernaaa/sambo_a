<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 MVP - 全功能旗艦版</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        /* 列印專屬樣式黑科技 */
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; max-width: 100%; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // --- 輔助函式與防呆 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const fraction = ['角', '分'];
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            for (let i = 0; i < fraction.length; i++) { s += (digit[Math.floor(num * 10 * Math.pow(10, i)) % 10] + fraction[i]).replace(/零./, ''); }
            s = s || '整'; num = Math.floor(num);
            for (let i = 0; i < unit[0].length && num > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && num > 0; j++) { p = digit[num % 10] + unit[1][j] + p; num = Math.floor(num / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零').replace(/^整$/, '零元整');
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        
        // 轉換西元年為民國年
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145",
            storeImageUrl: "https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=800&q=80"
        };

        function App() {
            // --- 系統狀態 ---
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null); // 報表預覽

            // --- 核心資料庫 (本機快取優先) ---
            const [productMaster, setProductMaster] = useState(() => {
                const saved = localStorage.getItem('shenbao_products');
                return saved ? JSON.parse(saved) : [
                    { id: 'S001', supplier: '大日', name: '大日 菲莉絲屏風(全布)', specs: 'W120xD3xH110 cm', unitPrice: 3500 },
                    { id: 'S002', supplier: '寶維', name: '寶維 不銹鋼五分類資源回收箱', specs: 'W180xD45xH105 cm', unitPrice: 28000 },
                    { id: 'S003', supplier: '大日', name: '活動高櫃', specs: 'W40*D56*H65cm', unitPrice: 1300 }
                ];
            });
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));

            // --- 商品資料庫系統狀態 ---
            const [productView, setProductView] = useState('list');
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            // --- 估價單系統狀態 ---
            const [quoteView, setQuoteView] = useState('list'); 
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', clientPhone: '', date: getToday(), items: [] });
            
            // --- 智慧搜尋框狀態 ---
            const [quoteSearch, setQuoteSearch] = useState('');
            const [customSpec, setCustomSpec] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [qty, setQty] = useState(1);
            const [showDropdown, setShowDropdown] = useState(false);

            const filteredProducts = productMaster.filter(p => 
                (p.name || '').toLowerCase().includes(quoteSearch.toLowerCase()) || 
                (p.id || '').toLowerCase().includes(quoteSearch.toLowerCase())
            );

            // 資料連動儲存
            useEffect(() => { localStorage.setItem('shenbao_products', JSON.stringify(productMaster)); }, [productMaster]);
            useEffect(() => { localStorage.setItem('shenbao_invoices', JSON.stringify(invoices)); }, [invoices]);
            useEffect(() => { localStorage.setItem('shenbao_quotes', JSON.stringify(quotes)); }, [quotes]);
            useEffect(() => { localStorage.setItem('shenbao_orders', JSON.stringify(orders)); }, [orders]);
            useEffect(() => { localStorage.setItem('shenbao_logistics', JSON.stringify(logistics)); }, [logistics]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            const handlePrint = (type, data) => {
                setPrintDoc({ type, data });
                setTimeout(() => window.print(), 300);
            };

            // ==========================================
            // 報表引擎 (Print Engine - 包含客戶電話與印章)
            // ==========================================
            if (printDoc) {
                if (printDoc.type === 'quote') {
                    const q = printDoc.data;
                    const qTotal = (q.amount || 0);
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container animate-slide-in max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-indigo-50 border border-indigo-200 rounded-xl flex justify-between items-center shadow-lg">
                                <span className="font-bold text-indigo-800"><i className="ph-fill ph-printer"></i> 報表預覽模式：請使用瀏覽器列印功能匯出 PDF</span>
                                <div className="flex gap-4">
                                    <button onClick={() => window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-indigo-700">立即列印 / 存為 PDF</button>
                                    <button onClick={() => setPrintDoc(null)} className="bg-slate-200 text-slate-700 px-6 py-2 rounded-lg font-bold shadow hover:bg-slate-300">返回系統</button>
                                </div>
                            </div>
                            
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4">估價單</h1>
                            <div className="flex justify-between items-end mb-4 text-lg">
                                <div className="font-bold border-b border-black pb-1 min-w-[300px]">
                                    {q.client} <span className="ml-10">台照</span>
                                </div>
                                <div className="text-right">
                                    電話: <span className="font-sans">{q.clientPhone || '未提供聯絡電話'}</span>
                                </div>
                            </div>
                            <div className="mb-6 text-lg tracking-wider font-bold">
                                中華民國 <span className="mx-2">{toTaiwanYear(q.date)}</span>
                            </div>
                            
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4">
                                <thead>
                                    <tr className="bg-slate-100">
                                        <th className="border border-black p-3 w-1/3">品          名</th>
                                        <th className="border border-black p-3">規  格</th>
                                        <th className="border border-black p-3">數 量</th>
                                        <th className="border border-black p-3">單 價</th>
                                        <th className="border border-black p-3">金 額</th>
                                        <th className="border border-black p-3">備註</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-3 text-left font-bold">{item.name}</td>
                                            <td className="border border-black p-3">{item.specs}</td>
                                            <td className="border border-black p-3">{item.qty || 0} 個</td>
                                            <td className="border border-black p-3">{(item.unitPrice || 0).toLocaleString()}</td>
                                            <td className="border border-black p-3">{( (item.qty || 0) * (item.unitPrice || 0) ).toLocaleString()}</td>
                                            <td className="border border-black p-3"></td>
                                        </tr>
                                    ))}
                                    <tr>
                                        <td className="border border-black p-3 text-left">以下空白</td>
                                        <td className="border border-black p-3"></td>
                                        <td className="border border-black p-3"></td>
                                        <td className="border border-black p-3"></td>
                                        <td className="border border-black p-3"></td>
                                        <td className="border border-black p-3"></td>
                                    </tr>
                                    {[...Array(4)].map((_, i) => (
                                        <tr key={`empty-${i}`}>
                                            <td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td>
                                        </tr>
                                    ))}
                                    <tr>
                                        <td colSpan="4" className="border border-black p-3 text-left font-bold tracking-widest">
                                            總額新台幣 &nbsp;&nbsp;&nbsp; {numberToChinese(qTotal).split('').join('  ')}
                                        </td>
                                        <td colSpan="2" className="border border-black p-3 text-left font-bold font-mono text-xl">
                                            NT$ {qTotal.toLocaleString()}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div className="mt-8 flex justify-end pr-16 relative">
                                <img 
                                    src="./因張good.png" 
                                    alt="申堡印章" 
                                    className="w-48 h-auto object-contain z-10"
                                    style={{ mixBlendMode: 'multiply' }}
                                    onError={(e) => { e.target.style.opacity = '0.3'; e.target.alt="[圖檔 因張good.png 遺失，請檢查大小寫與重新整理]"; }}
                                />
                            </div>
                        </div>
                    );
                } else if (printDoc.type === 'order') {
                    const o = printDoc.data;
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-sans print-container animate-slide-in max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-amber-50 border border-amber-200 rounded-xl flex justify-between items-center shadow-lg">
                                <span className="font-bold text-amber-800"><i className="ph-fill ph-printer"></i> 報表預覽模式：請使用瀏覽器列印功能匯出 PDF</span>
                                <div className="flex gap-4">
                                    <button onClick={() => window.print()} className="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-amber-700">立即列印 / 存為 PDF</button>
                                    <button onClick={() => setPrintDoc(null)} className="bg-slate-200 text-slate-700 px-6 py-2 rounded-lg font-bold shadow hover:bg-slate-300">返回系統</button>
                                </div>
                            </div>

                            <div className="flex justify-between items-start mb-6 border-b-2 border-black pb-6">
                                <div className="text-lg space-y-1 relative">
                                    <h2 className="text-2xl font-black mb-2">{companyInfo.name}</h2>
                                    <p>統一編號: {companyInfo.taxId}</p>
                                    <p>店址: {companyInfo.address}</p>
                                    <p>電話: {companyInfo.phone}</p>
                                    <p>傳真: {companyInfo.fax}</p>
                                    <img 
                                        src="./因張good.png" 
                                        alt="" 
                                        className="absolute -right-32 top-0 w-36 h-auto object-contain z-10"
                                        style={{ mixBlendMode: 'multiply' }}
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                </div>
                                <div className="text-right">
                                    <h1 className="text-4xl font-black tracking-widest mb-6">訂貨明細單</h1>
                                    <p className="text-lg">訂單編號: <span className="font-mono">{o.id}</span></p>
                                    <p className="text-lg">訂貨日期: <span className="font-mono">{toTaiwanYear(o.date)}</span></p>
                                </div>
                            </div>

                            <div className="flex justify-between text-lg mb-6 bg-slate-100 p-4 rounded border border-black">
                                <div className="font-bold">訂貨廠商: <span className="ml-2 text-xl">{o.supplier}</span></div>
                                <div className="font-bold">聯絡人: <span className="ml-2 text-slate-400 font-normal">________________</span></div>
                            </div>

                            <table className="w-full border-collapse border border-black text-center text-lg">
                                <thead>
                                    <tr className="bg-slate-200">
                                        <th className="border border-black p-3 w-16">編號</th>
                                        <th className="border border-black p-3 w-1/3">品名</th>
                                        <th className="border border-black p-3">規格</th>
                                        <th className="border border-black p-3 w-20">數量</th>
                                        <th className="border border-black p-3">備註</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(o.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-4 font-mono">{idx + 1}</td>
                                            <td className="border border-black p-4 text-left font-bold">{item.name}</td>
                                            <td className="border border-black p-4">{item.specs}</td>
                                            <td className="border border-black p-4 font-bold">{item.qty || 0}</td>
                                            <td className="border border-black p-4 text-left text-sm text-slate-500">來源: {o.client}</td>
                                        </tr>
                                    ))}
                                    {[...Array(5)].map((_, i) => (
                                        <tr key={`empty-${i}`}>
                                            <td className="border border-black p-6"></td><td className="border border-black p-6"></td><td className="border border-black p-6"></td><td className="border border-black p-6"></td><td className="border border-black p-6"></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    );
                }
            }

            // ==========================================
            // 0. 營運全景儀表板
            // ==========================================
            const renderDashboard = () => (
                <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                    <h2 className="text-2xl font-bold tracking-wider text-slate-800 mb-6">營運全景儀表板</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm border-l-4 border-l-blue-500">
                            <p className="text-slate-500 text-sm font-bold tracking-widest uppercase mb-1">本月累計估價金額</p>
                            <h3 className="text-3xl font-black text-slate-800 font-mono">${(quotes.reduce((s,q)=>s+(q.amount||0),0)).toLocaleString()}</h3>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm border-l-4 border-l-emerald-500">
                            <p className="text-slate-500 text-sm font-bold tracking-widest uppercase mb-1">待出貨任務</p>
                            <h3 className="text-3xl font-black text-slate-800 font-mono">{(logistics || []).filter(l=>l.status!=='已送達').length} <span className="text-sm font-bold text-slate-400">單</span></h3>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm border-l-4 border-l-amber-500">
                            <p className="text-slate-500 text-sm font-bold tracking-widest uppercase mb-1">雲端商品庫存</p>
                            <h3 className="text-3xl font-black text-slate-800 font-mono">{(productMaster || []).length} <span className="text-sm font-bold text-slate-400">項</span></h3>
                        </div>
                    </div>
                </div>
            );

            // ==========================================
            // 1. 商品資料庫 (Products) 完整 CRUD
            // ==========================================
            const handleSaveProduct = () => {
                if (!newProductData.name) return showToast("請填寫商品名稱");
                
                const unitPriceNum = Number(newProductData.unitPrice) || 0;

                if (editingProductId) {
                    setProductMaster(productMaster.map(p => p.id === editingProductId ? { ...newProductData, unitPrice: unitPriceNum } : p));
                    showToast("商品資料已更新");
                } else {
                    const newId = newProductData.id || `SKU-${Date.now().toString().slice(-5)}`;
                    setProductMaster([{ ...newProductData, id: newId, unitPrice: unitPriceNum }, ...productMaster]);
                    showToast("新商品已建檔");
                }
                
                setProductView('list');
                setEditingProductId(null);
                setNewProductData({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            };

            const handleEditProduct = (p) => {
                setEditingProductId(p.id);
                setNewProductData({ ...p });
                setProductView('create');
            };

            const handleDeleteProduct = (id) => {
                if (window.confirm("確定要刪除這筆商品資料嗎？")) {
                    setProductMaster(productMaster.filter(p => p.id !== id));
                    showToast("商品已刪除");
                }
            };

            const renderProducts = () => {
                if (productView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-5xl mx-auto no-print">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold tracking-wider text-slate-800">
                                    {editingProductId ? '編輯商品資料' : '新增商品建檔'}
                                </h2>
                                <button onClick={() => { setProductView('list'); setEditingProductId(null); setNewProductData({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 }); }} className="text-slate-500 hover:text-slate-800 font-bold bg-white px-4 py-2 rounded-xl shadow-sm"><i className="ph ph-arrow-left"></i> 返回列表</button>
                            </div>
                            
                            <div className="bg-white rounded-[2rem] border border-slate-200 p-8 shadow-sm">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">商品編號 / SKU</label>
                                        <input type="text" value={newProductData.id} onChange={(e) => setNewProductData({...newProductData, id: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-indigo-500 font-mono" placeholder="留白則由系統自動產生" disabled={!!editingProductId} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">供應商 / 廠牌</label>
                                        <input type="text" value={newProductData.supplier} onChange={(e) => setNewProductData({...newProductData, supplier: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-indigo-500" placeholder="例：大日、寶維..." />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">商品名稱 <span className="text-red-500">*</span></label>
                                        <input type="text" value={newProductData.name} onChange={(e) => setNewProductData({...newProductData, name: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-indigo-500 font-bold text-lg" placeholder="請輸入完整品名" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">尺寸規格</label>
                                        <input type="text" value={newProductData.specs} onChange={(e) => setNewProductData({...newProductData, specs: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-indigo-500" placeholder="W x D x H cm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">標準單價 (NT$)</label>
                                        <input type="number" min="0" value={newProductData.unitPrice} onChange={(e) => setNewProductData({...newProductData, unitPrice: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-indigo-500 font-mono text-lg text-right text-emerald-600 font-bold" placeholder="0" />
                                    </div>
                                </div>
                                <div className="text-right border-t pt-6">
                                    <button onClick={handleSaveProduct} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black hover:bg-indigo-700 shadow-lg flex items-center gap-2 ml-auto">
                                        <i className="ph-fill ph-floppy-disk"></i> {editingProductId ? '儲存變更' : '確認建檔'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold tracking-wider text-slate-800">商品資料庫管理</h2>
                            <button onClick={() => { setProductView('create'); setEditingProductId(null); setNewProductData({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 }); }} className="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 font-black shadow-lg flex items-center gap-2">
                                <i className="ph-bold ph-plus-circle"></i> 新增商品
                            </button>
                        </div>
                        
                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th className="p-5 text-xs font-black text-slate-400">編號/供應商</th>
                                        <th className="p-5 text-xs font-black text-slate-400">品名與規格</th>
                                        <th className="p-5 text-xs font-black text-slate-400 text-right">標準單價</th>
                                        <th className="p-5 text-xs font-black text-slate-400 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {(productMaster || []).map(p => (
                                        <tr key={p.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-5">
                                                <div className="font-mono text-sm text-slate-500">{p.id}</div>
                                                <div className="font-bold text-indigo-600 mt-1">{p.supplier || '未指定'}</div>
                                            </td>
                                            <td className="p-5">
                                                <div className="font-bold text-slate-800 text-lg">{p.name}</div>
                                                <div className="text-sm text-slate-500 mt-1">{p.specs || '無規格描述'}</div>
                                            </td>
                                            <td className="p-5 text-right font-black text-emerald-600 font-mono text-lg">
                                                ${(p.unitPrice || 0).toLocaleString()}
                                            </td>
                                            <td className="p-5 text-center flex justify-center items-center gap-2">
                                                <button onClick={() => handleEditProduct(p)} className="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-200 shadow-sm"><i className="ph-bold ph-pencil-simple"></i> 編輯</button>
                                                <button onClick={() => handleDeleteProduct(p.id)} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-100 shadow-sm"><i className="ph-bold ph-trash-simple"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {productMaster.length === 0 && <tr><td colSpan="4" className="p-16 text-center text-slate-400 font-bold">資料庫目前無商品，請點擊右上方新增。</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // 2. 估價單系統
            // ==========================================
            const handleAddQuoteItem = () => {
                if (!newQuoteData.client) return showToast("請先填寫客戶名稱");
                if (!quoteSearch.trim()) return showToast("請輸入或選擇產品名稱");
                
                const priceNum = parseFloat(customPrice) || 0;
                
                setNewQuoteData({ 
                    ...newQuoteData, 
                    items: [...(newQuoteData.items || []), { 
                        name: quoteSearch, 
                        specs: customSpec, 
                        unitPrice: priceNum, 
                        qty: qty || 1,
                        supplier: productMaster.find(p => p.name === quoteSearch)?.supplier || '' 
                    }] 
                });
                
                setQuoteSearch(''); setCustomSpec(''); setCustomPrice(''); setQty(1); setShowDropdown(false);
            };

            const handleRemoveQuoteItem = (idxToRemove) => {
                const newItems = newQuoteData.items.filter((_, idx) => idx !== idxToRemove);
                setNewQuoteData({ ...newQuoteData, items: newItems });
            };

            const quoteTotal = (newQuoteData.items || []).reduce((sum, item) => sum + ((item.unitPrice || 0) * (item.qty || 0)), 0);

            const handleSaveQuote = () => {
                if ((newQuoteData.items || []).length === 0) return showToast("估價單內必須至少有一項商品");
                if (!newQuoteData.client) return showToast("請填寫客戶名稱");

                const updatedQuote = {
                    id: editingQuoteId || `Q-${getToday().replace(/-/g,'')}-${String(quotes.length+1).padStart(3,'0')}`,
                    client: newQuoteData.client,
                    clientPhone: newQuoteData.clientPhone || '',
                    date: newQuoteData.date || getToday(),
                    amount: quoteTotal,
                    status: newQuoteData.status || '草稿',
                    items: newQuoteData.items
                };

                if (editingQuoteId) {
                    setQuotes(quotes.map(q => q.id === editingQuoteId ? updatedQuote : q));
                    showToast("估價單已成功修改");
                } else {
                    setQuotes([updatedQuote, ...quotes]);
                    showToast("全新估價單已建立");
                }
                
                setQuoteView('list');
                setEditingQuoteId(null);
                setNewQuoteData({ client: '', clientPhone: '', date: getToday(), items: [] });
            };

            const handleEditQuote = (q) => {
                setEditingQuoteId(q.id);
                setNewQuoteData({ ...q });
                setQuoteView('create');
            };

            const handleDeleteQuote = (id) => {
                if (window.confirm("確定刪除此估價單？")) {
                    setQuotes(quotes.filter(q => q.id !== id));
                    showToast("估價單已刪除");
                }
            };

            const confirmQuote = (id) => {
                setQuotes(quotes.map(q => q.id === id ? { ...q, status: '已確認' } : q));
                showToast("估價單已確認，可前往訂貨系統");
            };

            const renderQuotations = () => {
                if (quoteView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold tracking-wider text-slate-800">
                                    {editingQuoteId ? `編輯估價單 (${editingQuoteId})` : '新增估價單'}
                                </h2>
                                <button onClick={() => { setQuoteView('list'); setEditingQuoteId(null); setNewQuoteData({client: '', clientPhone: '', date: getToday(), items: []}) }} className="text-slate-500 bg-white px-4 py-2 rounded-xl shadow-sm"><i className="ph ph-arrow-left"></i> 返回</button>
                            </div>
                            
                            <div className="bg-white rounded-[2rem] border border-slate-200 p-6 mb-6 shadow-sm">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end mb-4 pb-4 border-b">
                                    <div className="col-span-2 md:col-span-4 flex gap-4">
                                        <div className="flex-[2]">
                                            <label className="block text-xs font-black text-slate-400 mb-2">客戶台照 <span className="text-red-500">*</span></label>
                                            <input type="text" value={newQuoteData.client} onChange={(e) => setNewQuoteData({...newQuoteData, client: e.target.value})} className="w-full px-4 py-3 border rounded-xl" />
                                        </div>
                                        <div className="flex-[1]">
                                            <label className="block text-xs font-black text-slate-400 mb-2">聯絡電話</label>
                                            <input type="text" value={newQuoteData.clientPhone || ''} onChange={(e) => setNewQuoteData({...newQuoteData, clientPhone: e.target.value})} className="w-full px-4 py-3 border rounded-xl" />
                                        </div>
                                        <div className="w-48">
                                            <label className="block text-xs font-black text-slate-400 mb-2">開立日期</label>
                                            <input type="date" value={newQuoteData.date} onChange={(e) => setNewQuoteData({...newQuoteData, date: e.target.value})} className="w-full px-4 py-3 border rounded-xl" />
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex flex-wrap gap-4 items-start bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                    <div className="flex-1 min-w-[250px] relative">
                                        <label className="block text-xs font-black text-indigo-800 mb-2">品名搜尋 (帶出資料庫庫存)</label>
                                        <input 
                                            type="text" 
                                            value={quoteSearch} 
                                            onChange={(e) => { setQuoteSearch(e.target.value); setShowDropdown(true); }}
                                            onFocus={() => setShowDropdown(true)}
                                            className="w-full px-4 py-3 border rounded-xl bg-white font-bold" 
                                        />
                                        {showDropdown && quoteSearch && (
                                            <div className="absolute z-10 w-full mt-1 bg-white border rounded-xl shadow-2xl max-h-48 overflow-y-auto">
                                                {filteredProducts.map(p => (
                                                    <div key={p.id} className="px-4 py-3 hover:bg-indigo-50 cursor-pointer border-b"
                                                        onClick={() => { setQuoteSearch(p.name); setCustomSpec(p.specs); setCustomPrice(p.unitPrice); setShowDropdown(false); }}>
                                                        <div className="font-bold">{p.name}</div>
                                                        <div className="text-xs text-slate-500 mt-1 flex justify-between"><span>{p.specs}</span><span>${p.unitPrice}</span></div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex-1 min-w-[150px]">
                                        <label className="block text-xs font-black text-slate-400 mb-2">規格</label>
                                        <input type="text" value={customSpec} onChange={(e) => setCustomSpec(e.target.value)} className="w-full px-4 py-3 border rounded-xl" />
                                    </div>
                                    <div className="w-28">
                                        <label className="block text-xs font-black text-slate-400 mb-2">單價</label>
                                        <input type="number" value={customPrice} onChange={(e) => setCustomPrice(e.target.value)} className="w-full px-4 py-3 border rounded-xl text-right" />
                                    </div>
                                    <div className="w-20">
                                        <label className="block text-xs font-black text-slate-400 mb-2">數量</label>
                                        <input type="number" min="1" value={qty} onChange={(e) => setQty(parseInt(e.target.value) || 1)} className="w-full px-4 py-3 border rounded-xl text-center" />
                                    </div>
                                    <div className="flex items-end h-[68px]">
                                        <button onClick={handleAddQuoteItem} className="w-full h-12 bg-indigo-600 text-white px-6 rounded-xl hover:bg-indigo-700 font-bold shadow-md"><i className="ph-bold ph-plus-circle"></i> 加入</button>
                                    </div>
                                </div>
                            </div>

                            {(newQuoteData.items || []).length > 0 && (
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-sm mt-0 border-t border-slate-200">
                                        <thead className="bg-slate-50 border-b border-slate-200">
                                            <tr><th className="p-4">品名/規格</th><th className="p-4 text-center">數量</th><th className="p-4 text-right">單價</th><th className="p-4 text-right">小計</th><th className="p-4 text-center w-16">移除</th></tr>
                                        </thead>
                                        <tbody>
                                            {newQuoteData.items.map((item, idx) => (
                                                <tr key={idx} className="border-b">
                                                    <td className="p-4 font-bold">{item.name} <div className="text-xs font-normal text-slate-500">{item.specs}</div></td>
                                                    <td className="p-4 text-center">{item.qty}</td>
                                                    <td className="p-4 text-right">${(item.unitPrice || 0).toLocaleString()}</td>
                                                    <td className="p-4 text-right font-bold text-indigo-600">${((item.unitPrice || 0) * (item.qty || 0)).toLocaleString()}</td>
                                                    <td className="p-4 text-center"><button onClick={() => handleRemoveQuoteItem(idx)} className="text-red-500"><i className="ph-fill ph-trash-simple"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="bg-slate-50 p-6 flex justify-between items-center">
                                        <div className="font-bold">{numberToChinese(quoteTotal)}</div>
                                        <div className="text-right">
                                            <div className="text-3xl font-black mb-4">總計: ${(quoteTotal || 0).toLocaleString()}</div>
                                            <button onClick={handleSaveQuote} className="bg-emerald-600 text-white px-8 py-4 rounded-xl font-black">儲存估價單</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold tracking-wider text-slate-800">估價單總覽</h2>
                            <button onClick={() => { setQuoteView('create'); setEditingQuoteId(null); setNewQuoteData({client: '', clientPhone: '', date: getToday(), items: []})}} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black shadow-lg"><i className="ph-bold ph-plus-circle"></i> 建立新估價</button>
                        </div>
                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 border-b">
                                    <tr><th className="p-5">單號/日期</th><th className="p-5">客戶/聯絡</th><th className="p-5 text-right">金額</th><th className="p-5 text-center">狀態</th><th className="p-5 text-center">單據操作</th></tr>
                                </thead>
                                <tbody>
                                    {(quotes || []).map(q => (
                                        <tr key={q.id} className="border-b">
                                            <td className="p-5 font-bold">{q.id}<div className="text-xs font-normal text-slate-500">{q.date}</div></td>
                                            <td className="p-5 font-bold">{q.client}<div className="text-xs font-normal text-slate-500">{q.clientPhone}</div></td>
                                            <td className="p-5 text-right font-black">${(q.amount || 0).toLocaleString()}</td>
                                            <td className="p-5 text-center"><span className="px-3 py-1 bg-slate-100 rounded-full text-xs">{q.status}</span></td>
                                            <td className="p-5 text-center flex flex-wrap gap-2 justify-center max-w-[200px] mx-auto">
                                                <button onClick={() => handlePrint('quote', q)} className="text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg w-full text-xs font-bold mb-1"><i className="ph-bold ph-printer"></i> 匯出報表</button>
                                                {q.status !== '已確認' && <button onClick={()=>confirmQuote(q.id)} className="bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex-1"><i className="ph-bold ph-check"></i> 確認</button>}
                                                <button onClick={() => handleEditQuote(q)} className="bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-bold flex-1"><i className="ph-bold ph-pencil-simple"></i></button>
                                                <button onClick={() => handleDeleteQuote(q.id)} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold flex-1"><i className="ph-bold ph-trash-simple"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // 3. & 4. Orders & Logistics (縮略邏輯，維持功能)
            // ==========================================
            const generateOrdersFromQuotes = () => {
                const confirmedQuotes = (quotes || []).filter(q => q.status === '已確認');
                if (confirmedQuotes.length === 0) return showToast("無可拋轉的估價單");
                let newAdded = 0;
                const newOrdersList = [...(orders || [])], newLogisticsList = [...(logistics || [])];
                confirmedQuotes.forEach(quote => {
                    if (newOrdersList.some(o => o.refQuote === quote.id)) return;
                    const groups = {};
                    (quote.items || []).forEach(item => { const s = item.supplier || '未指定'; if(!groups[s]) groups[s]=[]; groups[s].push(item); });
                    Object.keys(groups).forEach(sup => {
                        const poId = `PO-${getToday().replace(/-/g,'')}-${generateId().substring(0,4).toUpperCase()}`;
                        newOrdersList.push({ id: poId, date: getToday(), supplier: sup, refQuote: quote.id, client: quote.client, items: groups[sup], status: '已建立' });
                        newLogisticsList.push({ id: `DO-${poId.split('-')[1]}-${generateId().substring(0,3).toUpperCase()}`, client: quote.client, refPo: poId, items: groups[sup], status: '待進貨' });
                        newAdded++;
                    });
                });
                if (newAdded > 0) { setOrders(newOrdersList); setLogistics(newLogisticsList); showToast(`拋轉成功！產生 ${newAdded} 張訂貨單`); } 
                else showToast("皆已拋轉過。");
            };

            const renderOrders = () => (
                <div className="p-8 max-w-7xl mx-auto no-print">
                    <h2 className="text-2xl font-bold mb-6">訂貨與採購</h2>
                    <div className="bg-indigo-50 p-6 rounded-[2rem] mb-8">
                        <button onClick={generateOrdersFromQuotes} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black">一鍵拋轉產生訂貨單</button>
                    </div>
                    <div className="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 border-b"><tr><th className="p-5">訂貨單號</th><th className="p-5">供應商</th><th className="p-5">客戶(來源)</th><th className="p-5 text-center">操作</th></tr></thead>
                            <tbody>
                                {(orders || []).map(o => (
                                    <tr key={o.id} className="border-b">
                                        <td className="p-5 font-bold font-mono">{o.id}</td>
                                        <td className="p-5 font-black text-indigo-700">{o.supplier}</td>
                                        <td className="p-5">{o.client} <span className="text-xs text-slate-400">({o.refQuote})</span></td>
                                        <td className="p-5 text-center"><button onClick={() => handlePrint('order', o)} className="text-amber-700 bg-amber-50 px-4 py-2 rounded-xl font-bold"><i className="ph-bold ph-printer"></i> 列印</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const updateLogisticsStatus = (id, s) => {
                const next = s === '待進貨' ? '準備出車' : '已送達';
                setLogistics(logistics.map(l => l.id === id ? { ...l, status: next } : l));
            };

            const renderLogistics = () => (
                <div className="p-8 max-w-7xl mx-auto no-print">
                    <h2 className="text-2xl font-bold mb-6">出貨任務看板</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {(logistics || []).map(task => (
                            <div key={task.id} className="bg-white rounded-3xl p-6 border shadow-sm">
                                <div className="text-[10px] text-slate-400 font-bold mb-2">{task.id}</div>
                                <h3 className="text-lg font-black mb-4">{task.client}</h3>
                                {task.status !== '已送達' ? (
                                    <button onClick={() => updateLogisticsStatus(task.id, task.status)} className={`w-full py-4 rounded-xl font-black text-white ${task.status === '待進貨' ? 'bg-blue-600' : 'bg-emerald-600'}`}>{task.status === '待進貨' ? '準備出車' : '抵達簽收'}</button>
                                ) : (<div className="text-emerald-600 font-bold text-center">任務已結案</div>)}
                            </div>
                        ))}
                    </div>
                </div>
            );

            // ==========================================
            // Main Layout 
            // ==========================================
            const menuItems = [
                { id: 'dashboard', name: '營運儀表板', icon: 'ph-chart-pie' },
                { id: 'products', name: '商品資料庫', icon: 'ph-database' }, // ⭐️ 新增商品資料庫選單
                { id: 'quotations', name: '估價單 (列印)', icon: 'ph-file-text' },
                { id: 'orders', name: '訂貨與採購', icon: 'ph-shopping-cart' },
                { id: 'logistics', name: '出貨看板', icon: 'ph-truck' }
            ];

            return (
                <div className="flex h-screen w-full bg-slate-50 font-sans text-slate-800 overflow-hidden">
                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col shadow-2xl z-20 shrink-0 no-print">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold tracking-wider flex items-center gap-2 mb-2">申堡中樞 <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-mono">v3.2 完整版</span></h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all font-bold ${activeTab === item.id && !printDoc ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    <i className={`ph ${item.icon} text-xl`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-5 border-t border-slate-800 bg-slate-950/50">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center text-sm font-bold">莊</div>
                                <div className="text-left"><div className="text-sm font-bold text-slate-200">莊惠呅</div><div className="text-[10px] text-slate-500 font-black mt-0.5 uppercase">系統管理員</div></div>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full relative bg-slate-50/50 overflow-y-auto print-container">
                        {toast && <div className="fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl bg-slate-900 text-white border-l-4 border-emerald-500 z-50 font-bold">{toast}</div>}
                        
                        {!printDoc && activeTab === 'dashboard' && renderDashboard()}
                        {!printDoc && activeTab === 'products' && renderProducts()} {/* ⭐️ 渲染商品模組 */}
                        {!printDoc && activeTab === 'quotations' && renderQuotations()}
                        {!printDoc && activeTab === 'orders' && renderOrders()}
                        {!printDoc && activeTab === 'logistics' && renderLogistics()}
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-2 z-50 flex justify-around shadow-lg pb-safe no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`flex flex-col items-center p-2 rounded-xl ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                                <span className="text-[10px] mt-1">{item.name}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
