<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.0</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            .seal-only { display: block !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 核心公用工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const i18n = {
            zh: {
                dashboard: "營運儀表板", products: "商品資料庫", quotations: "報價單系統", orders: "採購管理", logistics: "物流看板", invoices: "財務發票",
                search: "搜尋...", add: "新增", edit: "編輯", delete: "刪除", save: "儲存", cancel: "取消",
                sku: "編號", brand: "廠牌", name: "品名", specs: "規格", price: "單價", qty: "數量", total: "總計",
                taxId: "統一編號", client: "客戶對象", date: "日期", status: "狀態", actions: "操作",
                confirmDelete: "確定要刪除此筆資料嗎？此操作不可逆。", backup: "導出備份", restore: "還原數據",
                langToggle: "English Mode", sealTag: "簽章處", print: "列印單據", smartSplit: "執行智慧拆單",
                quoteCreate: "建立新報價", quoteList: "報價單總覽", pushOrder: "拋轉採購", address: "地址", phone: "電話"
            },
            en: {
                dashboard: "Dashboard", products: "Inventory", quotations: "Quotes", orders: "Purchase", logistics: "Logistics", invoices: "Invoices",
                search: "Search...", add: "Add", edit: "Edit", delete: "Delete", save: "Save", cancel: "Cancel",
                sku: "SKU", brand: "Brand", name: "Product Name", specs: "Specs", price: "Price", qty: "Qty", total: "Total",
                taxId: "Tax ID", client: "Client", date: "Date", status: "Status", actions: "Actions",
                confirmDelete: "Are you sure? This cannot be undone.", backup: "Export", restore: "Import",
                langToggle: "中文模式", sealTag: "Seal Only", print: "Print", smartSplit: "Smart Split",
                quoteCreate: "Create Quote", quoteList: "Quote List", pushOrder: "Push to PO", address: "Address", phone: "Phone"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('sb_p') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p', JSON.stringify(productMaster));
                localStorage.setItem('sb_q', JSON.stringify(quotes));
                localStorage.setItem('sb_o', JSON.stringify(orders));
                localStorage.setItem('sb_l', JSON.stringify(logistics));
                localStorage.setItem('sb_i', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const t = i18n[lang];
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // ==========================================
            // ⭐️ 商品資料庫維護模組 (CRUD)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const filteredP = productMaster.filter(p => 
                p.name.toLowerCase().includes(pSearch.toLowerCase()) || 
                p.id.toLowerCase().includes(pSearch.toLowerCase()) ||
                (p.supplier && p.supplier.toLowerCase().includes(pSearch.toLowerCase()))
            );

            const handlePSave = () => {
                if (!pForm.name) return showToast(lang === 'zh' ? "品名必填" : "Name required");
                if (pEdit === 'new') setProductMaster([{ ...pForm, id: pForm.id || `P-${generateId()}` }, ...productMaster]);
                else setProductMaster(productMaster.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); showToast(lang === 'zh' ? "商品庫已更新" : "Inventory updated");
            };

            const handlePDelete = (id) => {
                setConfirmBox({
                    msg: t.confirmDelete,
                    action: () => { setProductMaster(productMaster.filter(p => p.id !== id)); setConfirmBox(null); showToast("Deleted"); }
                });
            };

            const handleRestore = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data)) {
                            setProductMaster([...data, ...productMaster]);
                            showToast(lang === 'zh' ? "已併入導入資料" : "Imported products merged");
                        } else if (data.products) {
                            setProductMaster(data.products); setQuotes(data.quotes); setOrders(data.orders);
                            setLogistics(data.logistics); setInvoices(data.invoices);
                            showToast("System Restore Complete");
                        }
                    } catch (err) { showToast("Error reading file"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // ⭐️ 報價單系統與拋轉邏輯
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qSearch, setQSearch] = useState('');
            const [qForm, setQForm] = useState({ id: '', client: '', date: getToday(), items: [], total: 0 });
            const [selectedSku, setSelectedSku] = useState('');
            const [selectedQty, setSelectedQty] = useState(1);

            const filteredQuotes = quotes.filter(q => q.client.toLowerCase().includes(qSearch.toLowerCase()) || q.id.includes(qSearch));

            const handleAddQuoteItem = () => {
                const prod = productMaster.find(p => p.id === selectedSku);
                if (!prod) return showToast("Please select product");
                setQForm({
                    ...qForm,
                    items: [...qForm.items, { ...prod, qty: selectedQty }],
                    total: qForm.total + (prod.unitPrice * selectedQty)
                });
                setSelectedSku(''); setSelectedQty(1);
            };

            const handleSaveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return showToast("Missing client or items");
                const newQ = { ...qForm, id: qForm.id || `Q-${generateId()}`, status: '已確認' };
                setQuotes([newQ, ...quotes]);
                setQView('list');
                showToast("Quote Saved");
            };

            const handleQuoteToOrder = (quote) => {
                const poId = `PO-${generateId()}`;
                const newOrder = { ...quote, id: poId, refQuote: quote.id, status: '已下訂' };
                setOrders([newOrder, ...orders]);
                setLogistics([{ ...newOrder, status: '待進貨' }, ...logistics]);
                setQuotes(quotes.map(q => q.id === quote.id ? { ...q, status: '已拋轉' } : q));
                showToast(lang === 'zh' ? "已拋轉至採購與物流" : "Pushed to PO & Logistics");
            };

            // ==========================================
            // ⭐️ 財務與發票邏輯
            // ==========================================
            const [invForm, setInvForm] = useState({ taxId: '', client: '', amount: 0, status: '未開立' });
            const handleCreateInvoice = () => {
                if (!invForm.client) return showToast("Client required");
                setInvoices([{ ...invForm, id: `INV-${generateId()}`, date: getToday() }, ...invoices]);
                setInvForm({ taxId: '', client: '', amount: 0, status: '未開立' });
                showToast("Invoice Logged");
            };

            // ==========================================
            // ⭐️ 列印渲染 (保持印章模式)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                const isOrder = printDoc.type === 'order';
                return (
                    <div className="bg-white text-black min-h-screen p-10 font-serif print-container">
                        <div className="no-print flex justify-between mb-10 bg-slate-100 p-4 rounded-xl border">
                            <span className="font-bold">A4 Print Preview (No Header/Footer Text)</span>
                            <div className="flex gap-2">
                                <button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Print Now</button>
                                <button onClick={()=>setPrintDoc(null)} className="bg-white px-6 py-2 rounded-xl border font-bold">Return</button>
                            </div>
                        </div>
                        <h1 className="text-center text-4xl font-bold tracking-[0.8em] mb-10 border-b-4 border-black pb-4">{isOrder ? t.orders : t.quotations}</h1>
                        <div className="flex justify-between mb-6 text-lg">
                            <div className="font-bold underline decoration-2 underline-offset-8">{d.client} 台照</div>
                            <div className="text-right font-mono text-sm">DATE: {d.date} <br/> NO: {d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-[2.5px] border-black text-center table-fixed">
                            <thead className="bg-slate-50 border-b-[2.5px] border-black">
                                <tr className="text-sm">
                                    <th className="p-3 border-r-[2px] border-black w-1/2">{t.name} / {t.specs}</th>
                                    <th className="p-3 border-r-[2px] border-black w-12">{t.qty}</th>
                                    <th className="p-3 border-r-[2px] border-black w-24">{t.price}</th>
                                    <th className="p-3 w-24">{t.total}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="border-b border-black text-sm">
                                        <td className="p-3 border-r-[2px] border-black text-left font-bold">{it.name} <span className="block text-xs font-normal text-slate-500 mt-1">{it.specs}</span></td>
                                        <td className="p-3 border-r-[2px] border-black font-mono">{it.qty}</td>
                                        <td className="p-3 border-r-[2px] border-black font-mono">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-3 font-mono font-bold">{(it.qty * it.unitPrice).toLocaleString()}</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 12 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="border-b border-black h-10"><td className="border-r-[2px] border-black"></td><td className="border-r-[2px] border-black"></td><td className="border-r-[2px] border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="mt-6 flex justify-between items-end">
                            <div className="border-2 border-black p-4 rounded-xl bg-slate-50 min-w-[300px]">
                                <div className="text-[10px] font-bold text-slate-400 mb-1">TOTAL AMOUNT (CHINESE)</div>
                                <div className="text-lg font-black tracking-widest">{numberToChinese(d.total)}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-xs font-bold text-slate-400 mb-1 uppercase tracking-widest">Grand Total</div>
                                <div className="text-4xl font-black font-mono">NT$ {d.total?.toLocaleString()}</div>
                            </div>
                        </div>
                        <div className="mt-12 flex justify-end pr-8">
                            <img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 確認視窗 */}
                    {confirmBox && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-[3rem] max-w-sm shadow-2xl animate-slide-in border border-slate-100 text-center">
                                <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl"><i className="ph ph-warning"></i></div>
                                <p className="font-black text-slate-600 mb-10 leading-relaxed">{confirmBox.msg}</p>
                                <div className="flex gap-3">
                                    <button onClick={confirmBox.action} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg">確認刪除</button>
                                    <button onClick={()=>setConfirmBox(null)} className="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 商品編輯視窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[90] flex items-center justify-center p-4">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-8 italic uppercase tracking-tighter">{pEdit === 'new' ? t.add : t.edit} {t.products}</h3>
                                <div className="space-y-6 mb-10">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.sku}</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 font-mono text-lg focus:border-indigo-400 outline-none transition-all" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.brand}</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 font-bold focus:border-indigo-400 outline-none transition-all" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.name}</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 font-black text-xl focus:border-indigo-400 outline-none transition-all" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.specs}</label><input type="text" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 focus:border-indigo-400 outline-none transition-all" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.price}</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-5 py-4 rounded-2xl border-2 border-slate-100 font-mono text-right text-2xl font-black text-emerald-600 focus:border-indigo-400 outline-none transition-all" /></div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl hover:bg-indigo-700 active:scale-95 transition-all">{t.save}</button>
                                    <button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black hover:bg-slate-200 transition-all">{t.cancel}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col no-print shrink-0 z-20">
                        <div className="p-8 border-b border-slate-800"><h1 className="text-xl font-black italic tracking-tighter uppercase">SHENBAO HUB <span className="text-[10px] bg-indigo-600 px-2 rounded ml-1">v5.0</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => { setActiveTab(tab); setQView('list'); }} className={`w-full text-left px-6 py-4 rounded-2xl font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-slate-800 space-y-4">
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-3 bg-slate-800 rounded-xl text-[10px] font-black tracking-widest uppercase flex items-center justify-center gap-2 transition-colors hover:bg-slate-700"><i className="ph ph-translate text-lg"></i> {t.langToggle}</button>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black shadow-lg">莊</div>
                                <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase tracking-widest">Master Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-10 custom-scrollbar relative bg-slate-50/50">
                        {toast && <div className="fixed top-10 right-10 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 font-bold animate-slide-in flex items-center gap-2"><i className="ph ph-check-circle text-emerald-400"></i> {toast}</div>}

                        {/* 1. Dashboard */}
                        {activeTab === 'dashboard' && (
                            <div className="p-10 text-center animate-slide-in max-w-6xl mx-auto space-y-16">
                                <h1 className="text-6xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡營運管理旗艦中樞</h1>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm flex flex-col items-center group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-indigo-600 mb-4 group-hover:scale-110 transition-transform">{productMaster.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.products}</div>
                                    </div>
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm flex flex-col items-center group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-emerald-600 mb-4 group-hover:scale-110 transition-transform">{quotes.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.quotations}</div>
                                    </div>
                                    <div className="bg-white p-12 rounded-[4rem] border shadow-sm flex flex-col items-center group hover:shadow-2xl transition-all">
                                        <div className="text-6xl font-black text-red-600 mb-4 group-hover:scale-110 transition-transform">{logistics.filter(l=>l.status!=='已送達').length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">待處理任務</div>
                                    </div>
                                </div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={()=>document.getElementById('mImport').click()} className="bg-slate-900 text-white px-10 py-5 rounded-[2rem] font-black shadow-xl hover:bg-black transition-all active:scale-95">{t.restore} JSON</button>
                                    <input id="mImport" type="file" className="hidden" onChange={handleRestore} />
                                    <button onClick={()=>{
                                        const blob = new Blob([JSON.stringify({products:productMaster, quotes, orders, logistics, invoices}, null, 2)], {type:'application/json'});
                                        const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=`SHENBAO_BACKUP_${getToday()}.json`; a.click();
                                    }} className="bg-white border-2 border-slate-900 px-10 py-5 rounded-[2rem] font-black shadow-xl hover:bg-slate-50 transition-all active:scale-95">{t.backup}</button>
                                </div>
                            </div>
                        )}

                        {/* 2. 商品資料庫 (CRUD + Search) */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.products}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">PRODUCT DATABASE MANAGEMENT</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-10 py-4 rounded-3xl font-black shadow-xl hover:bg-indigo-700 transition-all">+ {t.add}</button>
                                </div>
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="flex-1 relative"><i className="ph ph-magnifying-glass absolute left-6 top-4 text-slate-300 text-xl"></i><input type="text" placeholder={t.search} value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full pl-16 pr-6 py-4 bg-slate-50 border-transparent rounded-2xl focus:bg-white focus:border-indigo-100 outline-none font-bold transition-all" /></div>
                                    <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">{filteredP.length} Items</div>
                                </div>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">{t.sku} / {t.brand}</th><th className="p-8 w-1/2">{t.name}</th><th className="p-8 text-right w-1/4">{t.price}</th><th className="p-8 text-center w-32">{t.actions}</th></tr></thead>
                                        <tbody>
                                            {filteredP.map(p => (
                                                <tr key={p.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-1 uppercase text-sm">{p.supplier}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{p.name}<div className="text-sm font-normal text-slate-400 mt-1 italic">{p.specs}</div></td>
                                                    <td className="p-8 text-right font-mono font-black text-2xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-8 text-center space-x-2">
                                                        <button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-xl"></i></button>
                                                        <button onClick={()=>handlePDelete(p.id)} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-red-50 hover:text-red-600 transition-all"><i className="ph ph-trash text-xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 3. 報價單系統 (Create + List) */}
                        {activeTab === 'quotations' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.quotations}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">CLIENT SALES PROCESS</p></div>
                                    {qView === 'list' && <button onClick={()=>{setQForm({id:'', client:'', date:getToday(), items:[], total:0}); setQView('create')}} className="bg-indigo-600 text-white px-10 py-4 rounded-3xl font-black shadow-xl">+ {t.quoteCreate}</button>}
                                </div>

                                {qView === 'create' ? (
                                    <div className="bg-white p-12 rounded-[4rem] shadow-sm border border-slate-100 space-y-10 animate-slide-in">
                                        <div className="grid grid-cols-2 gap-8">
                                            <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.client}</label><input type="text" value={qForm.client} onChange={e=>setQForm({...qForm, client:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 font-black text-xl outline-none focus:border-indigo-400 transition-all" placeholder="Enter Client Name" /></div>
                                            <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.date}</label><input type="date" value={qForm.date} onChange={e=>setQForm({...qForm, date:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 font-bold outline-none" /></div>
                                        </div>
                                        <div className="bg-slate-50 p-8 rounded-[3rem] border-2 border-dashed border-slate-200">
                                            <h4 className="font-black text-slate-500 mb-6 uppercase tracking-widest text-xs">Add Items to Quote</h4>
                                            <div className="flex gap-4 items-end">
                                                <div className="flex-1 space-y-1">
                                                    <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">Select Product</label>
                                                    <select value={selectedSku} onChange={e=>setSelectedSku(e.target.value)} className="w-full px-6 py-4 rounded-2xl border-2 border-white bg-white font-bold outline-none">
                                                        <option value="">-- Choose Product --</option>
                                                        {productMaster.map(p => <option key={p.id} value={p.id}>[{p.supplier}] {p.name}</option>)}
                                                    </select>
                                                </div>
                                                <div className="w-32 space-y-1">
                                                    <label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.qty}</label>
                                                    <input type="number" value={selectedQty} onChange={e=>setSelectedQty(Number(e.target.value))} className="w-full px-6 py-4 rounded-2xl border-2 border-white text-center font-black" />
                                                </div>
                                                <button onClick={handleAddQuoteItem} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-black transition-all">Add</button>
                                            </div>
                                        </div>
                                        {qForm.items.length > 0 && (
                                            <div className="rounded-[2.5rem] border overflow-hidden">
                                                <table className="w-full text-left table-fixed">
                                                    <thead className="bg-slate-50"><tr className="text-[10px] font-black text-slate-400 uppercase"><th className="p-6 w-1/2">Item</th><th className="p-6 text-center w-20">Qty</th><th className="p-6 text-right w-32">Total</th><th className="p-6 w-16"></th></tr></thead>
                                                    <tbody>
                                                        {qForm.items.map((it, i) => (
                                                            <tr key={i} className="border-t">
                                                                <td className="p-6 font-bold">{it.name}<div className="text-xs font-normal text-slate-400">{it.specs}</div></td>
                                                                <td className="p-6 text-center font-mono">{it.qty}</td>
                                                                <td className="p-6 text-right font-black text-indigo-600">${(it.qty * it.unitPrice).toLocaleString()}</td>
                                                                <td className="p-6 text-center"><button onClick={()=>setQForm({...qForm, items: qForm.items.filter((_,idx)=>idx!==i), total: qForm.total - (it.qty * it.unitPrice)})} className="text-red-300 hover:text-red-500"><i className="ph ph-x-circle text-xl"></i></button></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center p-10 bg-slate-900 text-white rounded-[3rem]">
                                            <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-1">Chinese Amount</div><div className="text-xl font-bold">{numberToChinese(qForm.total)}</div></div>
                                            <div className="text-right">
                                                <div className="text-5xl font-black font-mono text-emerald-400 mb-6">${qForm.total.toLocaleString()}</div>
                                                <div className="flex gap-4">
                                                    <button onClick={handleSaveQuote} className="bg-emerald-600 text-white px-12 py-5 rounded-[2rem] font-black text-xl shadow-xl hover:bg-emerald-700 transition-all">{t.save} {t.quotations}</button>
                                                    <button onClick={()=>setQView('list')} className="px-8 py-5 bg-white/10 text-white rounded-[2rem] font-black">{t.cancel}</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-6 animate-slide-in">
                                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex gap-4 items-center">
                                            <div className="flex-1 relative"><i className="ph ph-magnifying-glass absolute left-6 top-4 text-slate-300 text-xl"></i><input type="text" placeholder={t.search} value={qSearch} onChange={e=>setQSearch(e.target.value)} className="w-full pl-16 pr-6 py-4 bg-slate-50 border-transparent rounded-2xl focus:bg-white outline-none font-bold" /></div>
                                        </div>
                                        <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden border-slate-100">
                                            <table className="w-full text-left table-fixed">
                                                <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">ID / Date</th><th className="p-8 w-1/2">Client</th><th className="p-8 text-right w-1/4">Amount</th><th className="p-8 text-center w-48">Actions</th></tr></thead>
                                                <tbody>
                                                    {filteredQuotes.map(q => (
                                                        <tr key={q.id} className="border-b hover:bg-slate-50 transition-colors">
                                                            <td className="p-8 font-mono text-xs text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-1">{q.date}</div></td>
                                                            <td className="p-8 font-black text-slate-800 text-lg">{q.client}</td>
                                                            <td className="p-8 text-right font-black text-indigo-600 text-xl">${q.total?.toLocaleString()}</td>
                                                            <td className="p-8 text-center space-x-2">
                                                                <button onClick={()=>handlePrint('quote', q)} className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-black border hover:bg-white transition-all">{t.print}</button>
                                                                {q.status !== '已拋轉' && <button onClick={()=>handleQuoteToOrder(q)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-black shadow-lg hover:bg-indigo-700 transition-all">{t.pushOrder}</button>}
                                                                {q.status === '已拋轉' && <span className="text-[10px] font-black text-emerald-500 italic">Pushed</span>}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4. 物流看板 (行動版友善視角) */}
                        {activeTab === 'logistics' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.logistics}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">REAL-TIME DELIVERY TRACKING</p></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                                    {logistics.map(l => (
                                        <div key={l.id} className="bg-white p-10 rounded-[4rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                                            <div className={`absolute top-0 left-0 w-full h-3 ${l.status==='已送達'?'bg-emerald-500':'bg-amber-400'}`}></div>
                                            <div className="flex justify-between items-start mb-8">
                                                <div><div className="text-[10px] font-black text-slate-300 font-mono">{l.id}</div><h3 className="text-2xl font-black text-slate-800 mt-1">{l.client}</h3></div>
                                                <span className={`px-4 py-1 rounded-full text-[10px] font-black uppercase ${l.status==='已送達'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}`}>{l.status}</span>
                                            </div>
                                            <div className="space-y-3 mb-10 bg-slate-50 p-8 rounded-[3rem] min-h-[140px] border border-slate-100">
                                                {l.items.map((it, i) => (
                                                    <div key={i} className="flex justify-between text-sm font-bold border-b border-white pb-2"><span className="text-slate-500 truncate pr-4">{it.name}</span><span className="text-indigo-600 shrink-0">x{it.qty}</span></div>
                                                ))}
                                            </div>
                                            {l.status !== '已送達' ? (
                                                <button onClick={()=>{setLogistics(logistics.map(x=>x.id===l.id?{...x, status:'已送達'}:x)); showToast("Delivery Confirmed")}} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black shadow-xl flex items-center justify-center gap-2 hover:bg-indigo-700 transition-all active:scale-95"><i className="ph ph-truck text-2xl"></i> 確認送達並簽收</button>
                                            ) : (
                                                <div className="w-full py-5 bg-emerald-50 text-emerald-700 rounded-3xl font-black flex items-center justify-center gap-2 border border-emerald-100 italic"><i className="ph ph-check-circle text-2xl"></i> 配送任務已完成</div>
                                            )}
                                        </div>
                                    ))}
                                    {logistics.length === 0 && <div className="col-span-full p-40 text-center text-slate-200 font-black italic text-4xl uppercase tracking-tighter">No active delivery tasks.</div>}
                                </div>
                            </div>
                        )}

                        {/* 5. 財務與發票 (8位數統編與大寫邏輯) */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-8 max-w-5xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.invoices}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">ACCOUNTING & TAX ID CONTROL</p></div>
                                </div>
                                <div className="bg-white p-12 rounded-[4rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.taxId} (8 digits)</label><input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} placeholder="統編 (三聯式)" className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-mono text-2xl tracking-[0.3em] bg-slate-50 focus:bg-white focus:border-indigo-400 outline-none transition-all" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.client}</label><input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-black text-xl outline-none focus:border-indigo-400 transition-all" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase tracking-widest">{t.price} (含稅總額)</label><input type="number" value={invForm.amount} onChange={e=>setInvForm({...invForm, amount:Number(e.target.value)})} className="w-full px-6 py-5 rounded-2xl border-2 border-slate-50 font-mono text-2xl font-black text-emerald-600" /></div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-12 rounded-[3.5rem] flex justify-between items-center shadow-2xl">
                                        <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-1">Chinese Capital Amount</div><div className="text-2xl font-black tracking-widest">{numberToChinese(invForm.amount)}</div></div>
                                        <div className="text-right"><div className="text-[10px] opacity-30 uppercase tracking-widest mb-1">Total Due</div><div className="text-6xl font-black font-mono text-emerald-400">${invForm.amount.toLocaleString()}</div></div>
                                    </div>
                                    <button onClick={handleCreateInvoice} className="w-full py-8 bg-emerald-600 text-white rounded-[2.5rem] font-black text-3xl shadow-xl hover:bg-emerald-700 active:scale-95 transition-all">確認開立發票帳項</button>
                                </div>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">Date / Tax ID</th><th className="p-8 w-1/2">Client</th><th className="p-8 text-right w-1/4">Total</th></tr></thead>
                                        <tbody>
                                            {invoices.map(i => (
                                                <tr key={i.id} className="border-b hover:bg-slate-50 transition-colors">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-1 uppercase text-sm">{i.taxId || 'N/A'}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{i.client}</td>
                                                    <td className="p-8 text-right font-black text-emerald-600 text-xl">${i.amount?.toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 6. 採購單管理 (拋轉結果) */}
                        {activeTab === 'orders' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-4xl font-black text-slate-800 italic uppercase tracking-tighter">{t.orders}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">SUPPLIER PROCUREMENT MANAGEMENT</p></div>
                                </div>
                                <div className="bg-white rounded-[3.5rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">PO 編號 / 日期</th><th className="p-8 w-1/2">客戶對象 / 來源報價</th><th className="p-8 text-right w-1/4">總額</th><th className="p-8 text-center w-32">操作</th></tr></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-1">{o.date}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{o.client}<div className="text-xs text-indigo-500 font-bold mt-1 uppercase">REF: {o.refQuote}</div></td>
                                                    <td className="p-8 text-right font-black text-amber-600 text-xl">${o.total?.toLocaleString()}</td>
                                                    <td className="p-8 text-center"><button onClick={()=>handlePrint('order', o)} className="p-3 bg-slate-50 text-amber-600 rounded-xl hover:bg-amber-500 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-2xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {orders.length === 0 && <div className="p-40 text-center text-slate-200 font-black italic text-4xl uppercase tracking-tighter">No purchase orders found.</div>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
