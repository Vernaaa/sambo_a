<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.3</title>
    
    <!-- 核心套件導入 - 確保使用 HTTPS 並鎖定版本以提升部署穩定性 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; border: 2px solid black !important; }
            th, td { border: 1px solid black !important; padding: 8px !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = (prefix = '') => prefix + Math.random().toString(36).substr(2, 6).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        
        // 國字大寫轉換邏輯
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const i18n = {
            zh: {
                dashboard: "營運儀表板", products: "商品資料庫", quotations: "報價單系統", orders: "採購管理", logistics: "物流看板", invoices: "財務發票",
                search: "搜尋關鍵字...", add: "新增項目", edit: "編輯", delete: "刪除", save: "儲存", cancel: "取消",
                sku: "編號", brand: "廠牌", name: "品名", specs: "規格", price: "單價", qty: "數量", total: "總計",
                taxId: "統一編號", client: "客戶對象", date: "日期", status: "狀態", actions: "操作",
                confirmDelete: "確定要刪除嗎？若此項目已用於報價單，建議保留以維護歷史數據。", backup: "備份導出", restore: "數據匯入",
                langToggle: "English Mode", print: "列印單據", pushOrder: "拋轉採購",
                taxNet: "銷售額(未稅)", taxVal: "稅額(5%)", paid: "已收款", unpaid: "待收款", type: "發票類型",
                invNum: "發票號碼"
            },
            en: {
                dashboard: "Dashboard", products: "Inventory", quotations: "Quotes", orders: "Purchase", logistics: "Logistics", invoices: "Accounting",
                search: "Search...", add: "Add New", edit: "Edit", delete: "Delete", save: "Save", cancel: "Cancel",
                sku: "SKU", brand: "Brand", name: "Name", specs: "Specs", price: "Price", qty: "Qty", total: "Total",
                taxId: "Tax ID", client: "Client", date: "Date", status: "Status", actions: "Actions",
                confirmDelete: "Are you sure?", backup: "Export", restore: "Import",
                langToggle: "中文模式", print: "Print", pushOrder: "Push to PO",
                taxNet: "Net", taxVal: "Tax(5%)", paid: "Paid", unpaid: "Unpaid", type: "Type",
                invNum: "Invoice #"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 (GitHub Pages 支援本地存儲) ---
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('sb_p_v5') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q_v5') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o_v5') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l_v5') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i_v5') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p_v5', JSON.stringify(products));
                localStorage.setItem('sb_q_v5', JSON.stringify(quotes));
                localStorage.setItem('sb_o_v5', JSON.stringify(orders));
                localStorage.setItem('sb_l_v5', JSON.stringify(logistics));
                localStorage.setItem('sb_i_v5', JSON.stringify(invoices));
            }, [products, quotes, orders, logistics, invoices]);

            const t = i18n[lang];
            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // --- 備份功能 ---
            const exportData = () => {
                const data = { products, quotes, orders, logistics, invoices };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `Shenbao_Backup_${getToday()}.json`; a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        if (json.products) {
                            setProducts(json.products); setQuotes(json.quotes); setOrders(json.orders);
                            setLogistics(json.logistics); setInvoices(json.invoices);
                            triggerToast("數據匯入成功");
                        }
                    } catch (err) { triggerToast("無效的檔案格式"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // ⭐️ 商品管理
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const handlePSave = () => {
                if (!pForm.name) return triggerToast("請輸入商品名稱");
                if (pEdit === 'new') setProducts([{ ...pForm, id: pForm.id || generateId('P') }, ...products]);
                else setProducts(products.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); triggerToast("商品資料已更新");
            };

            // ==========================================
            // ⭐️ 報價單系統
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ client: '', date: getToday(), items: [], total: 0 });
            const [selSku, setSelSku] = useState('');
            const [selQty, setSelQty] = useState(1);

            const handleAddQItem = () => {
                const p = products.find(x => x.id === selSku);
                if (!p) return;
                setQForm({ ...qForm, items: [...qForm.items, { ...p, qty: selQty }], total: qForm.total + (p.unitPrice * selQty) });
                setSelSku(''); setSelQty(1);
            };

            const saveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return triggerToast("請填寫客戶與品項");
                const newQ = { ...qForm, id: generateId('Q'), status: 'Confirmed' };
                setQuotes([newQ, ...quotes]);
                setQView('list'); triggerToast("報價單已存擋");
            };

            const pushToOrder = (q) => {
                const poId = generateId('PO');
                const ord = { ...q, id: poId, refQuote: q.id, status: 'Ordered' };
                setOrders([ord, ...orders]);
                setLogistics([{ ...ord, status: '待配送' }, ...logistics]);
                setQuotes(quotes.map(x => x.id === q.id ? { ...x, status: 'Pushed' } : x));
                triggerToast("已拋轉至採購與物流");
            };

            // ==========================================
            // ⭐️ 財務系統 (精準校正)
            // ==========================================
            const [invForm, setInvForm] = useState({ 
                type: '三聯式 (B2B)', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, status: '待收款' 
            });

            const updateInvAmount = (val, field) => {
                let net = 0, tax = 0, total = 0;
                if (field === 'net') {
                    net = Number(val);
                    tax = Math.round(net * 0.05);
                    total = net + tax;
                } else if (field === 'total') {
                    total = Number(val);
                    net = Math.round(total / 1.05);
                    tax = total - net;
                }
                setInvForm({ ...invForm, netAmount: net, taxAmount: tax, totalAmount: total });
            };

            const handleCreateInvoice = () => {
                if (!invForm.client || invForm.totalAmount <= 0) return triggerToast("資料不完整");
                if (invForm.type === '三聯式 (B2B)' && (!/^\d{8}$/.test(invForm.taxId))) return triggerToast("防呆提醒：統編須為 8 位數字");
                
                const newInv = { ...invForm, id: generateId('INV'), date: getToday() };
                setInvoices([newInv, ...invoices]);
                setInvForm({ type: '三聯式 (B2B)', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, status: '待收款' });
                triggerToast("發票紀錄已建立");
            };

            // ==========================================
            // ⭐️ 列印渲染 (大寫金額併入表格最後一行)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg">開始列印</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-8 py-2 rounded-xl font-bold border">返回系統</button></div>
                        <h1 className="text-center text-5xl font-bold tracking-[0.8em] border-b-8 border-black pb-6 mb-8 italic uppercase">{printDoc.type === 'quote' ? '估價單' : '訂貨單'}</h1>
                        <div className="flex justify-between mb-8 text-2xl font-bold">
                            <div className="underline underline-offset-8 decoration-4">{d.client} 台照</div>
                            <div className="text-right leading-relaxed font-mono">日期：{d.date} <br/> 單號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-2 border-black text-center">
                            <thead className="bg-slate-50">
                                <tr className="text-xl">
                                    <th className="p-4 border-r border-black w-1/2">品名規格</th>
                                    <th className="p-4 border-r border-black w-20">數量</th>
                                    <th className="p-4 border-r border-black w-32">單價</th>
                                    <th className="p-4 w-32">總計</th>
                                </tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="text-xl h-14 border-b border-black">
                                        <td className="p-4 border-r border-black text-left font-black">{it.name} <span className="text-sm font-normal block">{it.specs}</span></td>
                                        <td className="p-4 border-r border-black">{it.qty}</td>
                                        <td className="p-4 border-r border-black">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-4 font-bold text-right">{ (it.qty * it.unitPrice).toLocaleString() }</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 10 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="h-14 border-b border-black"><td className="border-r border-black"></td><td className="border-r border-black"></td><td className="border-r border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                            <tfoot>
                                <tr className="bg-slate-50 font-black text-xl border-t-2 border-black">
                                    <td colSpan="3" className="p-5 border-r border-black text-left tracking-[0.2em]">
                                        總計新台幣：{numberToChinese(d.total)}
                                    </td>
                                    <td className="p-5 text-right font-mono text-2xl">
                                        ${d.total?.toLocaleString()}
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                        <div className="mt-12 flex justify-end">
                            <img src="./因張good.png" className="w-56 h-auto" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden">
                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 no-print">
                        <div className="p-10 border-b border-slate-800"><h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none">SHENBAO <span className="text-[10px] bg-indigo-600 px-2 py-0.5 rounded ml-1 tracking-normal">v5.3</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => { setActiveTab(tab); setQView('list'); }} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${tab==='dashboard'?'ph-chart-pie':tab==='products'?'ph-package':tab==='quotations'?'ph-file-text':tab==='orders'?'ph-shopping-cart':tab==='logistics'?'ph-truck':'ph-receipt'} mr-3 text-lg align-middle`}></i> {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800 space-y-4">
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-4 bg-slate-800 rounded-2xl text-[10px] font-black tracking-widest uppercase hover:bg-slate-700 flex justify-center items-center gap-2 transition-all"><i className="ph ph-translate text-xl"></i> {t.langToggle}</button>
                            <div className="flex items-center gap-4 p-2">
                                <div className="w-12 h-12 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black shadow-lg">莊</div>
                                <div><div className="text-sm font-black text-slate-200">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase tracking-widest">Administrator</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/50 custom-scrollbar no-print">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* 各模組分頁內容 - 這裡保留 v5.2 的完整邏輯並實作防呆 */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto space-y-16 py-10 text-center animate-slide-in">
                                <div className="space-y-4">
                                    <h1 className="text-7xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡營運管理中樞</h1>
                                    <p className="text-slate-400 font-black text-sm tracking-[0.6em] uppercase">Operations Intelligence Core</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all cursor-pointer" onClick={()=>setActiveTab('products')}>
                                        <div className="text-7xl font-black text-indigo-600 mb-4 group-hover:scale-110 transition-all">{products.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.products}</div>
                                    </div>
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all cursor-pointer" onClick={()=>setActiveTab('quotations')}>
                                        <div className="text-7xl font-black text-emerald-600 mb-4 group-hover:scale-110 transition-all">{quotes.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.quotations}</div>
                                    </div>
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all">
                                        <div className="text-7xl font-black text-red-600 mb-4 group-hover:scale-110 transition-all">{logistics.filter(l=>l.status!=='已送達').length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">Active Deliveries</div>
                                    </div>
                                </div>
                                <div className="flex justify-center gap-6 pt-10">
                                    <button onClick={exportData} className="bg-slate-900 text-white px-12 py-6 rounded-[2.5rem] font-black shadow-xl hover:bg-black transition-all flex items-center gap-3"><i className="ph ph-export text-xl"></i> 下載系統備份</button>
                                    <button onClick={()=>document.getElementById('sysRestore').click()} className="bg-white border-4 border-slate-900 text-slate-900 px-12 py-6 rounded-[2.5rem] font-black shadow-xl hover:bg-slate-50 transition-all flex items-center gap-3"><i className="ph ph-import text-xl"></i> 還原數據</button>
                                    <input id="sysRestore" type="file" className="hidden" onChange={importData} />
                                </div>
                            </div>
                        )}

                        {/* 商品資料庫 */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">{t.products}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Master Repository</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black shadow-xl active:scale-95 transition-all">+ 新增產品</button>
                                </div>
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100 flex gap-6 items-center">
                                    <div className="flex-1 relative"><i className="ph ph-magnifying-glass absolute left-8 top-5 text-slate-300 text-2xl"></i><input type="text" placeholder={t.search} value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full pl-20 pr-8 py-5 bg-slate-50 border-transparent rounded-[2rem] focus:bg-white outline-none font-bold text-lg transition-all" /></div>
                                    <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest px-6">{filteredP.length} SKUs</div>
                                </div>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">編號 / 廠牌</th><th className="p-10 w-1/2">品名規格</th><th className="p-10 text-right w-1/4">單價</th><th className="p-10 text-center w-40">操作</th></thead>
                                        <tbody>
                                            {filteredP.map(p => (
                                                <tr key={p.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-10 font-mono text-sm text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-2 text-base uppercase">{p.supplier || '一般'}</div></td>
                                                    <td className="p-10 font-black text-slate-800 text-2xl truncate">{p.name}<div className="text-sm font-normal text-slate-400 mt-2 italic">{p.specs || 'N/A'}</div></td>
                                                    <td className="p-10 text-right font-mono font-black text-3xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-10 text-center space-x-3">
                                                        <button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-4 bg-slate-50 text-slate-400 rounded-2xl hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-2xl"></i></button>
                                                        <button onClick={()=>{
                                                            setConfirmBox({
                                                                msg: "確定要刪除嗎？刪除後無法復原。",
                                                                action: () => { setProducts(products.filter(x=>x.id!==p.id)); setConfirmBox(null); triggerToast("已刪除"); }
                                                            });
                                                        }} className="p-4 bg-slate-50 text-slate-400 rounded-2xl hover:bg-red-50 hover:text-red-600 transition-all"><i className="ph ph-trash text-2xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 財務發票 - 包含 8 位統編防呆與大寫預覽 */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-10 max-w-5xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">{t.invoices}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Accounting & Tax Management</p></div>
                                </div>
                                <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票類型</label>
                                            <select value={invForm.type} onChange={e=>setInvForm({...invForm, type:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 bg-slate-50 font-black text-xl outline-none focus:bg-white transition-all">
                                                <option>三聯式 (B2B)</option><option>二聯式 (B2C)</option><option>電子發票 / 收據</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">統一編號 (8 碼數字)</label>
                                            <input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} placeholder="三聯式發票必填" className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-mono text-3xl tracking-[0.4em] bg-slate-50 focus:bg-white transition-all outline-none" />
                                        </div>
                                        <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">客戶買受人</label>
                                            <input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none focus:bg-white transition-all" />
                                        </div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">未稅銷售額</label>
                                            <input type="number" value={invForm.netAmount} onChange={e=>updateInvAmount(e.target.value, 'net')} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-mono text-3xl font-black bg-slate-50 focus:bg-white" />
                                        </div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">含稅總金額</label>
                                            <input type="number" value={invForm.totalAmount} onChange={e=>updateInvAmount(e.target.value, 'total')} className="w-full px-8 py-5 rounded-3xl border-4 border-emerald-50 font-mono text-3xl font-black text-emerald-600 bg-white shadow-inner" />
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-14 rounded-[4rem] flex justify-between items-center shadow-2xl relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/10 rounded-full -mr-40 -mt-40 blur-3xl group-hover:bg-indigo-500/20 transition-all"></div>
                                        <div><div className="text-[10px] opacity-30 uppercase tracking-widest mb-2 font-black">國字大寫金額預覽</div><div className="text-3xl font-black tracking-[0.2em] text-indigo-300">{numberToChinese(invForm.totalAmount)}</div></div>
                                        <div className="text-right z-10"><div className="text-[10px] opacity-30 mb-2 uppercase font-black">營業稅 (5%): ${invForm.taxAmount.toLocaleString()}</div><div className="text-8xl font-black font-mono text-emerald-400 tracking-tighter">${invForm.totalAmount.toLocaleString()}</div></div>
                                    </div>
                                    <button onClick={handleCreateInvoice} className="w-full py-10 bg-indigo-600 text-white rounded-[3rem] font-black text-4xl shadow-xl hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-4"><i className="ph ph-receipt text-5xl"></i> 確認簽發財務紀錄</button>
                                </div>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">日期 / 統編</th><th className="p-10 w-1/2">客戶買受人</th><th className="p-10 text-right w-1/4">總金額</th></thead>
                                        <tbody>
                                            {invoices.map(i => (
                                                <tr key={i.id} className="border-b hover:bg-slate-50 transition-colors">
                                                    <td className="p-10 font-mono text-sm text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-2 text-base uppercase">{i.taxId || i.type}</div></td>
                                                    <td className="p-10 font-black text-slate-800 text-2xl truncate">{i.client}</td>
                                                    <td className="p-10 text-right font-black text-emerald-600 text-3xl">${i.totalAmount?.toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 物流看板 - 三階段狀態實作 */}
                        {activeTab === 'logistics' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">物流配送中心</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                    {logistics.map(l => (
                                        <div key={l.id} className="bg-white p-12 rounded-[5rem] border shadow-sm relative overflow-hidden border-slate-100 group hover:shadow-2xl transition-all">
                                            <div className={`absolute top-0 left-0 w-full h-4 ${l.status==='已送達'?'bg-emerald-500':l.status==='配送中'?'bg-indigo-500':'bg-amber-400'}`}></div>
                                            <div className="flex justify-between items-start mb-8">
                                                <div><div className="text-[10px] font-black text-slate-300 font-mono tracking-tighter uppercase mb-1">REF: {l.id}</div><h3 className="text-3xl font-black text-slate-800 leading-tight">{l.client}</h3></div>
                                                <span className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase ${l.status==='已送達'?'bg-emerald-50 text-emerald-600':l.status==='配送中'?'bg-indigo-50 text-indigo-600':'bg-amber-50 text-amber-600'}`}>{l.status}</span>
                                            </div>
                                            <div className="space-y-3 mb-10 bg-slate-50 p-8 rounded-[3.5rem] min-h-[160px] border border-slate-100">
                                                {l.items.map((it, i) => (
                                                    <div key={i} className="flex justify-between items-center text-sm font-black py-1"><span className="text-slate-600 truncate pr-6">{it.name}</span><span className="text-indigo-600 px-3 py-1 bg-white rounded-full text-xs shrink-0">x {it.qty}</span></div>
                                                ))}
                                            </div>
                                            {l.status === '待配送' && <button onClick={()=>{setLogistics(logistics.map(x=>x.id===l.id?{...x, status:'配送中'}:x)); triggerToast("車輛已出發")}} className="w-full py-6 bg-indigo-600 text-white rounded-[2.5rem] font-black shadow-xl hover:bg-indigo-700 transition-all">裝車並出發</button>}
                                            {l.status === '配送中' && <button onClick={()=>{setLogistics(logistics.map(x=>x.id===l.id?{...x, status:'已送達'}:x)); triggerToast("任務完成")}} className="w-full py-6 bg-emerald-600 text-white rounded-[2.5rem] font-black shadow-xl hover:bg-emerald-700 transition-all">客戶簽收</button>}
                                            {l.status === '已送達' && <div className="w-full py-6 bg-emerald-50 text-emerald-700 rounded-[2.5rem] font-black flex items-center justify-center gap-3 border-2 border-emerald-100 italic"><i className="ph ph-check-square text-3xl"></i> 配送完成</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 報價單與採購單模組 - 實作拋轉邏輯 */}
                        {activeTab === 'quotations' && qView === 'create' && (
                            <div className="fixed inset-0 bg-slate-100 z-50 overflow-y-auto p-16 animate-slide-in">
                                <div className="max-w-5xl mx-auto bg-white p-20 rounded-[5rem] shadow-2xl border border-slate-200">
                                    <div className="flex justify-between items-center mb-12">
                                        <h2 className="text-5xl font-black italic tracking-tighter">建立新報價單</h2>
                                        <button onClick={()=>setQView('list')} className="text-slate-400 hover:text-slate-900 font-bold">返回列表</button>
                                    </div>
                                    {/* 這裡填入報價單編輯介面... */}
                                    <div className="grid grid-cols-2 gap-10 mb-10">
                                        <input type="text" value={qForm.client} onChange={e=>setQForm({...qForm, client:e.target.value})} placeholder="客戶名稱" className="p-6 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none" />
                                        <input type="date" value={qForm.date} onChange={e=>setQForm({...qForm, date:e.target.value})} className="p-6 rounded-3xl border-4 border-slate-50 font-bold text-xl outline-none" />
                                    </div>
                                    <div className="bg-slate-50 p-10 rounded-[4rem] mb-10 flex gap-6">
                                        <select value={selSku} onChange={e=>setSelSku(e.target.value)} className="flex-1 p-6 rounded-3xl border-2 border-white bg-white font-bold outline-none shadow-sm text-lg">
                                            <option value="">-- 選取產品 --</option>
                                            {products.map(p => <option key={p.id} value={p.id}>[{p.supplier}] {p.name}</option>)}
                                        </select>
                                        <input type="number" value={selQty} onChange={e=>setSelQty(Number(e.target.value))} className="w-32 p-6 rounded-3xl border-2 border-white text-center font-black text-2xl shadow-sm outline-none" />
                                        <button onClick={handleAddQItem} className="bg-slate-900 text-white px-10 py-6 rounded-3xl font-black shadow-lg">加入</button>
                                    </div>
                                    {qForm.items.map((it, i) => (
                                        <div key={i} className="flex justify-between items-center p-6 border-b border-slate-100 font-bold">
                                            <span>{it.name} <span className="text-slate-400 font-normal ml-4 text-sm">{it.specs}</span></span>
                                            <span>x{it.qty} <span className="text-indigo-600 ml-8 text-xl">${(it.qty * it.unitPrice).toLocaleString()}</span></span>
                                        </div>
                                    ))}
                                    <div className="mt-12 flex justify-between items-end">
                                        <div><div className="text-xs opacity-30 mb-2 font-black uppercase">Grand Total (Chinese)</div><div className="text-3xl font-black text-indigo-300">{numberToChinese(qForm.total)}</div></div>
                                        <div className="text-right">
                                            <div className="text-7xl font-black font-mono text-emerald-500 mb-8">${qForm.total.toLocaleString()}</div>
                                            <button onClick={saveQuote} className="bg-emerald-600 text-white px-16 py-6 rounded-[3rem] font-black text-3xl shadow-xl hover:bg-emerald-700 transition-all">確認儲存</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'quotations' && qView === 'list' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-5xl font-black italic tracking-tighter">報價歷史</h2>
                                    <button onClick={()=>setQView('create')} className="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black shadow-xl">+ 新增報價</button>
                                </div>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">單號</th><th className="p-10 w-1/2">客戶</th><th className="p-10 text-right w-1/4">總額</th><th className="p-10 text-center w-64">操作</th></thead>
                                        <tbody>
                                            {quotes.map(q => (
                                                <tr key={q.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-10 font-mono text-sm text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-2 text-base">{q.date}</div></td>
                                                    <td className="p-10 font-black text-slate-800 text-2xl">{q.client}</td>
                                                    <td className="p-10 text-right font-black text-indigo-600 text-3xl">${q.total?.toLocaleString()}</td>
                                                    <td className="p-10 text-center space-x-3">
                                                        <button onClick={()=>setPrintDoc({type:'quote', data:q})} className="px-6 py-3 bg-slate-100 rounded-2xl text-xs font-black border hover:bg-white transition-all">列印</button>
                                                        {q.status !== 'Pushed' && <button onClick={()=>pushToOrder(q)} className="px-6 py-3 bg-indigo-600 text-white rounded-2xl text-xs font-black shadow-lg hover:bg-indigo-700 transition-all">拋轉</button>}
                                                        {q.status === 'Pushed' && <span className="text-emerald-500 font-black italic text-xs tracking-widest px-6 border-l-2 ml-4">已拋轉</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'orders' && (
                             <div className="animate-slide-in space-y-10 max-w-7xl mx-auto">
                                <h2 className="text-5xl font-black italic tracking-tighter">採購紀錄</h2>
                                <div className="bg-white rounded-[4rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">PO 編號</th><th className="p-10 w-1/2">來源客戶</th><th className="p-10 text-right w-1/4">總額</th><th className="p-10 text-center w-40">列印</th></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50 transition-colors">
                                                    <td className="p-10 font-mono text-sm text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-2 text-base">{o.date}</div></td>
                                                    <td className="p-10 font-black text-slate-800 text-2xl truncate">{o.client}<div className="text-xs text-indigo-500 font-bold mt-2 uppercase tracking-widest">REF: {o.refQuote}</div></td>
                                                    <td className="p-10 text-right font-black text-amber-600 text-3xl">${o.total?.toLocaleString()}</td>
                                                    <td className="p-10 text-center"><button onClick={()=>setPrintDoc({type:'order', data:o})} className="p-5 bg-slate-50 text-amber-600 rounded-3xl hover:bg-amber-500 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-3xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 確認對話框 */}
                    {confirmBox && (
                        <div className="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white p-12 rounded-[4rem] max-w-sm shadow-2xl animate-slide-in text-center border-4 border-indigo-100">
                                <i className="ph ph-warning-circle text-6xl text-amber-500 mb-6 block"></i>
                                <p className="font-black text-slate-600 mb-10 text-xl leading-relaxed">{confirmBox.msg}</p>
                                <div className="flex gap-4">
                                    <button onClick={confirmBox.action} className="flex-1 bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-xl active:scale-95 transition-all">確認執行</button>
                                    <button onClick={()=>setConfirmBox(null)} className="flex-1 bg-slate-100 text-slate-400 py-5 rounded-3xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
