<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v4.2</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; max-width: 100%; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            .page-break { page-break-after: always; }
            @page { margin: 10mm; size: A4 portrait; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            let numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            // 發票管理狀態
            const [invoiceView, setInvoiceView] = useState('list');
            const [editingInvoiceId, setEditingInvoiceId] = useState(null);
            const [focusedItemIndex, setFocusedItemIndex] = useState(null);
            const [newInvoiceData, setNewInvoiceData] = useState({ 
                invNo: '', type: '三聯式', transactionType: '銷項', taxType: 'taxable', date: getToday(), client: '', taxId: '', items: [], netAmount: 0, tax: 0, total: 0, status: '未付款' 
            });
            
            // 物流管理狀態
            const [logisticsView, setLogisticsView] = useState('list');
            const [editingLogisticsId, setEditingLogisticsId] = useState(null);
            const [tempLogisticsData, setTempLogisticsData] = useState({ id: '', client: '', refPo: '', items: [], status: '待進貨' });

            // 商品與估價單狀態
            const [productView, setProductView] = useState('list');
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            const [isIdLocked, setIsIdLocked] = useState(true);

            const [quoteView, setQuoteView] = useState('list');
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', contactName: '', contactPhone: '', date: getToday(), items: [] });
            
            const [quoteSearch, setQuoteSearch] = useState('');
            const [customSpec, setCustomSpec] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [qty, setQty] = useState(1);
            const [showDropdown, setShowDropdown] = useState(false);

            useEffect(() => {
                localStorage.setItem('shenbao_products', JSON.stringify(productMaster));
                localStorage.setItem('shenbao_quotes', JSON.stringify(quotes));
                localStorage.setItem('shenbao_orders', JSON.stringify(orders));
                localStorage.setItem('shenbao_logistics', JSON.stringify(logistics));
                localStorage.setItem('shenbao_invoices', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handlePrint = (type, data) => { setPrintDoc({ type, data }); setTimeout(() => window.print(), 300); };

            // ==========================================
            // 報表列印引擎
            // ==========================================
            if (printDoc) {
                const closePrint = () => setPrintDoc(null);
                if (printDoc.type === 'quote') {
                    const q = printDoc.data;
                    const qTotal = (q.amount || 0);
                    const totalRows = 12;
                    const itemsCount = q.items?.length || 0;
                    const emptyRows = Math.max(0, totalRows - itemsCount);

                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-indigo-50 rounded-xl flex justify-between items-center border border-indigo-200">
                                <span className="font-bold text-indigo-800 tracking-tighter">估價單預覽：表格已固定列數以維持工整</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold shadow">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4 uppercase">估價單</h1>
                            <div className="flex justify-between items-end mb-4 text-lg">
                                <div className="font-bold border-b border-black pb-1 min-w-[300px]">{q.client} 台照</div>
                                <div className="text-right tracking-tighter">聯絡人: {q.contactName || '未指定'} &nbsp; 電話: <span className="font-sans">{q.contactPhone || q.clientPhone}</span></div>
                            </div>
                            <div className="mb-6 text-lg tracking-wider font-bold">中華民國 <span className="mx-2">{toTaiwanYear(q.date)}</span></div>
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4">
                                <thead className="bg-slate-100"><tr><th className="border border-black p-3 w-1/3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">單價</th><th className="border border-black p-3">金額</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}><td className="border border-black p-3 text-left font-bold">{item.name}</td><td className="border border-black p-3">{item.specs}</td><td className="border border-black p-3">{item.qty} 個</td><td className="border border-black p-3">{(item.unitPrice || 0).toLocaleString()}</td><td className="border border-black p-3">{(item.qty * item.unitPrice).toLocaleString()}</td><td className="border border-black p-3"></td></tr>
                                    ))}
                                    {[...Array(emptyRows)].map((_, i) => (
                                        <tr key={`empty-${i}`}><td className="border border-black p-5 text-left">{i === 0 && itemsCount < totalRows ? '以下空白' : ''}</td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td><td className="border border-black p-5"></td></tr>
                                    ))}
                                    <tr className="bg-slate-50 font-bold"><td colSpan="4" className="border border-black p-3 text-left tracking-widest uppercase">總額新台幣 &nbsp;&nbsp; {numberToChinese(qTotal).split('').join(' ')}</td><td colSpan="2" className="border border-black p-3 text-left font-mono text-xl">NT$ {qTotal.toLocaleString()}</td></tr>
                                </tbody>
                            </table>
                            <div className="mt-8 flex justify-end pr-16 relative"><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} /></div>
                        </div>
                    );
                } else if (printDoc.type === 'order') {
                    const o = printDoc.data;
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-sans print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-amber-50 rounded-xl flex justify-between items-center border border-amber-200">
                                <span className="font-bold text-amber-800 tracking-tighter">訂貨明細單預覽：簽核區已簡化</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold shadow">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <div className="flex justify-between items-start mb-6 border-b-2 border-black pb-6">
                                <div className="space-y-1"><h2 className="text-2xl font-black">{companyInfo.name}</h2><p>統編: {companyInfo.taxId}</p><p>店址: {companyInfo.address}</p><p>電話: {companyInfo.phone}</p></div>
                                <div className="text-right"><h1 className="text-4xl font-black tracking-widest mb-6 uppercase">訂貨明細單</h1><p>訂單編號: {o.id}</p><p>訂貨日期: {toTaiwanYear(o.date)}</p></div>
                            </div>
                            <div className="bg-slate-100 p-4 border border-black mb-6 font-bold text-lg">採購廠商：{o.supplier}</div>
                            <table className="w-full border-collapse border border-black text-center text-lg">
                                <thead className="bg-slate-200"><tr><th className="border border-black p-3">序號</th><th className="border border-black p-3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(o.items || []).map((item, idx) => (
                                        <tr key={idx}><td className="border border-black p-4 font-mono">{idx+1}</td><td className="border border-black p-4 text-left font-bold">{item.name}</td><td className="border border-black p-4">{item.specs}</td><td className="border border-black p-4 font-bold">{item.qty}</td><td className="border border-black p-4 text-xs font-mono">{o.customRemark || `Ref: ${o.refQuote}`}</td></tr>
                                    ))}
                                    {[...Array(5)].map((_, i) => (<tr key={i}><td className="border border-black p-6" colSpan="5"></td></tr>))}
                                </tbody>
                            </table>
                            <div className="mt-16 flex justify-end"><div className="text-right pr-12 relative"><div className="mb-2 font-bold text-sm">申堡辦公家具行 負責人簽章</div><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} /></div></div>
                        </div>
                    );
                } else if (printDoc.type === 'delivery') {
                    const t = printDoc.data;
                    const labels = [{ title: "第一聯：會計聯 (白)", color: "border-slate-300" }, { title: "第二聯：客戶聯 (黃)", color: "border-amber-300" }, { title: "第三聯：存查聯 (藍)", color: "border-blue-300" }, { title: "第四聯：回單聯 (紅)", color: "border-red-300" }];
                    return (
                        <div className="bg-white text-black font-sans print-container">
                            <div className="no-print p-6 bg-emerald-50 mb-4 flex justify-between items-center border border-emerald-200">
                                <span className="font-bold text-emerald-800 tracking-tighter"><i className="ph ph-printer"></i> 一式四聯單列印模式 (A4 自動縮放)</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg">列印</button><button onClick={closePrint} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <div className="space-y-4 p-2">
                                {labels.map((label, idx) => (
                                    <div key={idx} className={`border-2 ${label.color} p-4 rounded-lg relative overflow-hidden mb-2`} style={{ pageBreakInside: 'avoid' }}>
                                        <div className="flex justify-between items-start mb-2 border-b-2 border-black pb-2">
                                            <div><h2 className="text-lg font-black">{companyInfo.name} - 送貨單</h2><p className="text-[10px]">地址: {companyInfo.address} / 電話: {companyInfo.phone}</p></div>
                                            <div className="text-right"><div className="font-bold text-sm bg-slate-900 text-white px-2 py-0.5 rounded mb-1">{label.title}</div><p className="text-[10px] font-mono">單號: {t.id} / 日期: {getToday()}</p></div>
                                        </div>
                                        <div className="flex justify-between text-xs mb-2 font-bold"><span>客戶名稱: {t.client}</span><span>來源單號: {t.refPo}</span></div>
                                        <table className="w-full border-collapse border border-black text-[10px] text-center mb-4">
                                            <thead className="bg-slate-100"><tr><th className="border border-black p-1 w-8">序</th><th className="border border-black p-1">品名規格</th><th className="border border-black p-1 w-12">數量</th><th className="border border-black p-1 w-16">備註</th></tr></thead>
                                            <tbody>
                                                {t.items.map((it, i) => (<tr key={i}><td className="border border-black p-1">{i+1}</td><td className="border border-black p-1 text-left font-bold">{it.name} {it.specs}</td><td className="border border-black p-1 font-bold">{it.qty}</td><td className="border border-black p-1"></td></tr>))}
                                                {[...Array(Math.max(1, 3 - t.items.length))].map((_, i) => (<tr key={i}><td className="border border-black p-2" colSpan="4"></td></tr>))}
                                            </tbody>
                                        </table>
                                        <div className="grid grid-cols-2 gap-8 mt-2"><div className="border-t border-black pt-1 text-[10px]"><span className="font-bold">送貨員簽章：</span><div className="h-6"></div></div><div className="border-t border-black pt-1 text-[10px]"><span className="font-bold">客戶簽章：</span><div className="h-6 text-slate-300 italic">請於此處簽署</div></div></div>
                                        {idx < 3 && <div className="mt-2 border-b border-dashed border-slate-300"></div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
            }

            // ==========================================
            // ⭐️ 智慧發票系統 (NextGen 錄入邏輯)
            // ==========================================
            const handleInvoiceInputChange = (e) => {
                const { name, value } = e.target;
                let val = value;
                if (name === 'invNo') {
                    val = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    if (val.length > 2 && !val.includes('-')) val = val.substring(0, 2) + '-' + val.substring(2, 10);
                }
                if (name === 'taxId') val = value.replace(/[^0-9]/g, '').substring(0, 8);
                const next = { ...newInvoiceData, [name]: val };
                if (name === 'taxType') {
                    const tax = val === 'taxable' ? Math.round(next.netAmount * 0.05) : 0;
                    setNewInvoiceData({ ...next, tax, total: next.netAmount + tax });
                } else setNewInvoiceData(next);
            };

            const handleInvoiceItemChange = (idx, field, val) => {
                const items = [...newInvoiceData.items];
                items[idx][field] = val;
                if (field === 'quantity' || field === 'unitPrice') {
                    items[idx].amount = Math.round((parseFloat(items[idx].quantity) || 0) * (parseFloat(items[idx].unitPrice) || 0));
                }
                const netAmount = items.reduce((s, it) => s + (it.amount || 0), 0);
                const tax = newInvoiceData.taxType === 'taxable' ? Math.round(netAmount * 0.05) : 0;
                setNewInvoiceData({ ...newInvoiceData, items, netAmount, tax, total: netAmount + tax });
            };

            const handleSaveInvoice = () => {
                if (!newInvoiceData.invNo || !newInvoiceData.client) return showToast("請輸入發票號碼與對象名稱");
                const newMaster = [...productMaster];
                let masterUpdated = false;
                newInvoiceData.items.forEach(it => {
                    if (!it.name) return;
                    if (!newMaster.some(p => p.name === it.name)) {
                        newMaster.push({ id: `SKU-${generateId().slice(0,5)}`, name: it.name, specs: it.specs, unitPrice: parseFloat(it.unitPrice) || 0 });
                        masterUpdated = true;
                    }
                });
                if (masterUpdated) setProductMaster(newMaster);
                if (editingInvoiceId) {
                    setInvoices(invoices.map(inv => inv.id === editingInvoiceId ? { ...newInvoiceData, id: editingInvoiceId } : inv));
                    showToast("更新成功");
                } else {
                    setInvoices([{ ...newInvoiceData, id: generateId() }, ...invoices]);
                    showToast("發票已存檔並學習商品");
                }
                setInvoiceView('list');
                setEditingInvoiceId(null);
            };

            const renderInvoiceView = () => {
                if (invoiceView === 'create') {
                    return (
                        <div className="p-8 animate-slide-in max-w-5xl mx-auto">
                            <div className="flex justify-between items-center mb-8">
                                <h2 className="text-2xl font-black text-slate-800">錄入發票數據</h2>
                                <button onClick={() => setInvoiceView('list')} className="bg-white border px-6 py-2 rounded-xl shadow-sm font-bold">返回列表</button>
                            </div>
                            <div className="bg-white rounded-[3rem] p-10 shadow-sm border border-slate-100">
                                <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-8 w-fit">
                                    <button onClick={()=>setNewInvoiceData({...newInvoiceData, transactionType:'銷項'})} className={`px-8 py-3 rounded-xl font-black text-sm ${newInvoiceData.transactionType==='銷項'?'bg-white text-indigo-700 shadow-md':'text-slate-400'}`}>銷項 (營收)</button>
                                    <button onClick={()=>setNewInvoiceData({...newInvoiceData, transactionType:'進項'})} className={`px-8 py-3 rounded-xl font-black text-sm ${newInvoiceData.transactionType==='進項'?'bg-white text-red-600 shadow-md':'text-slate-400'}`}>進項 (成本)</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400">發票號碼</label><input type="text" name="invNo" value={newInvoiceData.invNo} onChange={handleInvoiceInputChange} className="w-full px-5 py-4 rounded-2xl border font-mono text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400">日期</label><input type="date" name="date" value={newInvoiceData.date} onChange={handleInvoiceInputChange} className="w-full px-5 py-4 rounded-2xl border" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400">類型</label>
                                        <select name="type" value={newInvoiceData.type} onChange={handleInvoiceInputChange} className="w-full px-5 py-4 rounded-2xl border bg-slate-50">
                                            <option value="三聯式">三聯式 (B2B)</option><option value="二聯式">二聯式 (B2C)</option><option value="電子發票">電子發票</option>
                                        </select>
                                    </div>
                                    <div className="md:col-span-2 space-y-1"><label className="text-[10px] font-black text-slate-400">對象</label><input type="text" name="client" value={newInvoiceData.client} onChange={handleInvoiceInputChange} className="w-full px-5 py-4 rounded-2xl border font-bold" /></div>
                                    {newInvoiceData.type === '三聯式' && <div className="space-y-1"><label className="text-[10px] font-black text-indigo-500 uppercase tracking-widest">統編</label><input type="text" name="taxId" value={newInvoiceData.taxId} onChange={handleInvoiceInputChange} maxLength={8} className="w-full px-5 py-4 rounded-2xl border bg-indigo-50/20 font-mono" /></div>}
                                </div>
                                <div className="space-y-4 mb-10">
                                    {newInvoiceData.items.map((it, i) => (
                                        <div key={it.id} className="flex flex-col md:flex-row gap-4 p-6 bg-slate-50 rounded-[2rem] border relative group">
                                            <div className="flex-1">
                                                <input type="text" placeholder="品名" value={it.name} onChange={e=>handleInvoiceItemChange(i, 'name', e.target.value)} className="bg-transparent text-sm font-black w-full border-b border-transparent focus:border-indigo-500" />
                                                <input type="text" placeholder="規格" value={it.specs} onChange={e=>handleInvoiceItemChange(i, 'specs', e.target.value)} className="bg-transparent text-[10px] text-slate-400 italic w-full mt-1" />
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="w-20"><label className="text-[8px] text-slate-400">數量</label><input type="number" value={it.quantity} onChange={e=>handleInvoiceItemChange(i, 'quantity', e.target.value)} className="w-full py-2 border rounded-xl text-center" /></div>
                                                <div className="w-28"><label className="text-[8px] text-slate-400">單價</label><input type="number" value={it.unitPrice} onChange={e=>handleInvoiceItemChange(i, 'unitPrice', e.target.value)} className="w-full py-2 border rounded-xl text-right" /></div>

                                    <div className="w-24"><label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">數量</label><input type="number" value={qty} onChange={(e)=>setQty(parseInt(e.target.value)||1)} className="w-full px-5 py-4 rounded-2xl border bg-white text-center font-mono shadow-sm" /></div>
                                    <button onClick={()=>{setNewQuoteData({...newQuoteData, items:[...newQuoteData.items, {name:quoteSearch, specs:customSpec, unitPrice:Number(customPrice), qty:Number(qty)}]}); setQuoteSearch(''); setCustomSpec(''); setCustomPrice(''); setQty(1)}} className="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">加入明細</button>
                                </div>
                            </div>
                            {newQuoteData.items.length > 0 && (
                                <div className="bg-white rounded-[3rem] shadow-2xl border overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs text-slate-400 uppercase">品名規格描述</th><th className="p-5 text-center text-xs text-slate-400">數量</th><th className="p-5 text-right text-xs text-slate-400">預計單價</th><th className="p-5 text-right text-xs text-slate-400">合計額</th><th className="p-5 text-center"></th></tr></thead>
                                        <tbody>{newQuoteData.items.map((it, idx) => (<tr key={idx} className="border-b"><td className="p-5 font-bold text-slate-700">{it.name}<div className="text-[10px] font-normal text-slate-400 mt-1 italic">{it.specs}</div></td><td className="p-5 text-center font-mono">{it.qty}</td><td className="p-5 text-right font-mono">${it.unitPrice.toLocaleString()}</td><td className="p-5 text-right font-black text-indigo-600 font-mono text-lg">${(it.qty * it.unitPrice).toLocaleString()}</td><td className="p-5 text-center"><button onClick={()=>setNewQuoteData({...newQuoteData, items:newQuoteData.items.filter((_,i)=>i!==idx)})} className="text-red-300 hover:text-red-500 transition-colors"><i className="ph ph-trash"></i></button></td></tr>))}</tbody>
                                    </table>
                                    <div className="p-12 flex justify-between bg-slate-50 border-t items-center">
                                        <div className="bg-white p-5 rounded-[2rem] border-l-8 border-l-emerald-500 font-black shadow-sm text-emerald-800 tracking-widest">{numberToChinese(newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0))}</div>
                                        <div className="text-right">
                                            <div className="text-5xl font-black mb-8 font-mono text-slate-800 tracking-tighter italic">總計: ${newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0).toLocaleString()}</div>
                                            <button onClick={()=>{const q={...newQuoteData, id: editingQuoteId || `Q-${getToday().replace(/-/g,'')}-${quotes.length+1}`, amount: newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0), status: '草稿'}; if(editingQuoteId) setQuotes(quotes.map(x=>x.id===editingQuoteId?q:x)); else setQuotes([q,...quotes]); setQuoteView('list'); showToast("存檔成功")}} className="bg-indigo-600 text-white px-12 py-5 rounded-[2.5rem] font-black shadow-2xl active:scale-95 transition-all">確認儲存</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-black text-slate-800 uppercase italic">估價單管理中心</h2><button onClick={()=>{setQuoteView('create'); setEditingQuoteId(null); setNewQuoteData({client:'', contactName:'', contactPhone:'', date:getToday(), items:[]})}} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">+ 新增估價單</button></div>
                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden"><table className="w-full text-left"><thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs text-slate-400 font-black">編號/日期</th><th className="p-6 text-xs text-slate-400 font-black">客戶名稱</th><th className="p-6 text-xs text-slate-400 font-black text-right">金額</th><th className="p-6 text-xs text-slate-400 font-black text-center">操作</th></tr></thead><tbody>{quotes.map(q => (<tr key={q.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono text-sm">{q.id}<div className="text-xs font-normal text-slate-400 mt-1">{q.date}</div></td><td className="p-6 font-bold text-slate-800 text-lg">{q.client}<div className="text-xs font-normal text-slate-400 mt-1">{q.contactName} / {q.contactPhone}</div></td><td className="p-6 text-right font-black text-slate-700 font-mono text-lg">${(q.amount||0).toLocaleString()}</td><td className="p-6 text-center flex justify-center gap-2"><button onClick={()=>handlePrint('quote', q)} className="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-100 hover:bg-indigo-600 hover:text-white transition-all">列印</button>{q.status !== '已確認' && <button onClick={()=>{setQuotes(quotes.map(x=>x.id===q.id?{...x, status:'已確認'}:x)); showToast("已確認")}} className="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">確認</button>}<button onClick={()=>{setEditingQuoteId(q.id); setNewQuoteData(q); setQuoteView('create')}} className="bg-slate-100 p-3 rounded-2xl"><i className="ph ph-pencil-simple"></i></button></td></tr>))}</tbody></table></div>
                    </div>
                );
            };

            // ==========================================
            // ⭐️ 採購管理 (完整實作)
            // ==========================================
            const renderOrderView = () => {
                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tighter italic">採購訂貨中心</h2>
                            <button onClick={() => {
                                const confirmed = quotes.filter(q => q.status === '已確認' && !orders.some(o => o.refQuote === q.id));
                                if(!confirmed.length) return showToast("無可拋轉的單據");
                                const newO = [...orders], newL = [...logistics];
                                confirmed.forEach(q => {
                                    const groups = {};
                                    q.items.forEach(i => { const s = i.supplier || '未指定'; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
                                    Object.keys(groups).forEach(sup => {
                                        const poId = `PO-${getToday().replace(/-/g,'')}-${generateId().substring(0,4).toUpperCase()}`;
                                        newO.push({ id: poId, date: getToday(), supplier: sup, refQuote: q.id, client: q.client, items: groups[sup], customRemark: `來源：${q.id}` });
                                        newL.push({ id: `DO-${poId.split('-')[1]}`, client: q.client, refPo: poId, items: groups[sup], status: '待進貨' });
                                    });
                                });
                                setOrders(newO); setLogistics(newL); showToast("智慧拆單拋轉完成");
                            }} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition-all"><i className="ph ph-magic-wand"></i> 執行智慧拆單拋轉</button>
                        </div>
                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden"><table className="w-full text-left"><thead className="bg-slate-50 border-b"><tr><th className="p-6 text-xs text-slate-400 font-black">採購單號</th><th className="p-6 text-xs text-slate-400 font-black">供應商</th><th className="p-6 text-xs text-slate-400 font-black">備註</th><th className="p-6 text-xs text-slate-400 font-black text-center">操作</th></tr></thead><tbody>{orders.map(o => (<tr key={o.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-6 font-mono font-bold text-slate-700">{o.id}<div className="text-xs font-normal text-slate-400 mt-1">{o.date}</div></td><td className="p-6 font-black text-indigo-700 text-lg uppercase">{o.supplier}</td><td className="p-6"><input type="text" value={o.customRemark || ''} onChange={(e) => setOrders(orders.map(x => x.id === o.id ? {...x, customRemark: e.target.value} : x))} className="w-full bg-slate-50 px-3 py-2 rounded-xl text-sm border border-transparent focus:border-indigo-300 transition-all font-bold" /></td><td className="p-6 text-center flex justify-center gap-2"><button onClick={()=>handlePrint('order', o)} className="bg-amber-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg hover:bg-amber-700 transition-all">列印採購單</button></td></tr>))}</tbody></table></div>
                    </div>
                );
            };

            const renderDashboard = () => {
                const confirmedQuotes = quotes.filter(q => q.status === '已確認');
                const conversionRate = quotes.length ? ((confirmedQuotes.length / quotes.length) * 100).toFixed(0) : 0;
                const salesInvoices = invoices.filter(i => i.transactionType === '銷項' && i.status !== '作廢');
                const purchaseInvoices = invoices.filter(i => i.transactionType === '進項' && i.status !== '作廢');
                const paidSales = salesInvoices.filter(i => i.status === '已付款');
                const salesTotal = salesInvoices.reduce((s,i) => s + (i.total || 0), 0);
                const collectionRate = salesTotal ? ((paidSales.reduce((s,i) => s + (i.total || 0), 0) / salesTotal) * 100).toFixed(0) : 0;

                return (
                    <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                        <div className="flex justify-between items-center mb-8"><h2 className="text-3xl font-black tracking-tighter text-slate-900 uppercase italic tracking-widest">申堡營運智慧儀表板 v4.2</h2></div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <div className="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm relative overflow-hidden group">
                                <p className="text-slate-400 text-xs font-black uppercase mb-1 tracking-widest">估價轉化率</p>
                                <h3 className="text-4xl font-black text-indigo-600 font-mono">{conversionRate}%</h3>
                                <p className="text-[10px] text-slate-400 mt-2 font-bold italic">成交單：{confirmedQuotes.length} / 總單：{quotes.length}</p>
                            </div>
                            <div className="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm relative overflow-hidden group">
                                <p className="text-slate-400 text-xs font-black uppercase mb-1 tracking-widest">帳款回收率</p>
                                <h3 className="text-4xl font-black text-emerald-600 font-mono">{collectionRate}%</h3>
                                <div className="w-full bg-slate-100 h-1.5 rounded-full mt-4 overflow-hidden"><div className="bg-emerald-500 h-full transition-all duration-1000" style={{ width: `${collectionRate}%` }}></div></div>
                            </div>
                            <div className="bg-slate-900 p-7 rounded-[2.5rem] shadow-xl relative overflow-hidden group text-white">
                                <p className="text-white/40 text-xs font-black uppercase mb-1 tracking-widest">預估淨稅額</p>
                                <h3 className="text-3xl font-black text-emerald-400 font-mono">${(salesInvoices.reduce((s,i)=>s+(i.tax||0),0) - purchaseInvoices.reduce((s,i)=>s+(i.tax||0),0)).toLocaleString()}</h3>
                            </div>
                            <div className="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm relative overflow-hidden group">
                                <p className="text-slate-400 text-xs font-black uppercase mb-1 tracking-widest">目前待收總額</p>
                                <h3 className="text-3xl font-black text-amber-600 font-mono">${(salesTotal - paidSales.reduce((s,i) => s + (i.total || 0), 0)).toLocaleString()}</h3>
                            </div>
                        </div>
                    </div>
                );
            };

            const menuItems = [
                { id: 'dashboard', name: '營運智慧中心', icon: 'ph-chart-pie' },
                { id: 'products', name: '商品主檔庫', icon: 'ph-database' },
                { id: 'quotations', name: '估價單系統', icon: 'ph-file-text' },
                { id: 'orders', name: '採購管理', icon: 'ph-shopping-cart' },
                { id: 'logistics', name: '出貨與簽收', icon: 'ph-truck' },
                { id: 'invoices', name: '財務發票系統', icon: 'ph-receipt' }
            ];

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col shadow-2xl z-20 no-print">
                        <div className="p-6 border-b border-slate-800"><h1 className="text-xl font-black italic tracking-tighter flex items-center gap-2">申堡中樞 <span className="text-[10px] bg-indigo-500 px-2 py-0.5 rounded">v4.2</span></h1></div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); setLogisticsView('list'); setInvoiceView('list'); setQuoteView('list'); setProductView('list'); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all font-bold ${activeTab === item.id && !printDoc ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    <i className={`ph ${item.icon} text-xl`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-5 border-t border-slate-800 bg-slate-950/50 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center font-bold">莊</div>
                            <div className="text-left"><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 uppercase font-black">營運管理</div></div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full relative overflow-y-auto print-container">
                        {toast && <div className="fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl bg-slate-900 text-white border-l-4 border-emerald-500 z-[100] font-bold animate-slide-in">{toast}</div>}
                        
                        {!printDoc && activeTab === 'dashboard' && renderDashboard()}
                        {!printDoc && activeTab === 'products' && renderProductView()}
                        {!printDoc && activeTab === 'quotations' && renderQuoteView()}
                        {!printDoc && activeTab === 'orders' && renderOrderView()}
                        {!printDoc && activeTab === 'logistics' && renderLogisticsView()}
                        {!printDoc && activeTab === 'invoices' && renderInvoiceView()}
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-2xl z-50 no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); setLogisticsView('list'); }} className={`flex flex-col items-center p-2 rounded-2xl transition-colors ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50 shadow-inner' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
