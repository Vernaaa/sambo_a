<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v4.9</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { 
                width: 210mm; 
                margin: 0 auto !important; 
                padding: 0 !important; 
            }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const getToday = () => new Date().toISOString().split('T')[0];

        // --- ⭐️ 語系字典 (Translations) ---
        const i18n = {
            zh: {
                appTitle: "申堡營運中樞",
                dashboard: "營運指揮中心",
                products: "商品資料庫",
                quotations: "估價單管理",
                orders: "採購管理",
                logistics: "出貨與物流",
                invoices: "財務發票庫",
                searchPlaceholder: "搜尋商品、編號或廠牌...",
                newProduct: "新增商品",
                editProduct: "編輯商品",
                save: "儲存",
                cancel: "取消",
                delete: "刪除",
                sku: "商品編號",
                brand: "廠牌",
                name: "品名",
                specs: "規格",
                price: "單價",
                actions: "操作",
                restore: "數據還原",
                backup: "數據備份",
                confirmDelete: "確定要刪除此商品嗎？",
                noData: "目前無資料",
                langToggle: "English 版"
            },
            en: {
                appTitle: "Shenbao Hub",
                dashboard: "Operations",
                products: "Inventory",
                quotations: "Quotations",
                orders: "Purchasing",
                logistics: "Logistics",
                invoices: "Accounting",
                searchPlaceholder: "Search products, SKU, or brands...",
                newProduct: "New Product",
                editProduct: "Edit Product",
                save: "Save",
                cancel: "Cancel",
                delete: "Delete",
                sku: "SKU",
                brand: "Brand",
                name: "Product Name",
                specs: "Specs",
                price: "Price",
                actions: "Actions",
                restore: "Restore",
                backup: "Backup",
                confirmDelete: "Are you sure you want to delete this product?",
                noData: "No Data Found",
                langToggle: "中文版"
            }
        };

        const companyInfo = { name: "申堡辦公家具行", address: "澎湖縣馬公市西文里90-7號1樓", phone: "(06)9217228" };

        function App() {
            // --- 狀態管理 ---
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('products');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [showConfirm, setShowConfirm] = useState(null);

            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('shenbao_invoices') || '[]'));

            // 商品搜尋與編輯狀態
            const [searchTerm, setSearchTerm] = useState('');
            const [isEditing, setIsEditing] = useState(null); // null or {product object}
            const [editForm, setEditForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            useEffect(() => {
                localStorage.setItem('shenbao_products', JSON.stringify(productMaster));
                localStorage.setItem('shenbao_quotes', JSON.stringify(quotes));
                localStorage.setItem('shenbao_invoices', JSON.stringify(invoices));
            }, [productMaster, quotes, invoices]);

            const t = i18n[lang];
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // ==========================================
            // ⭐️ 商品資料庫 CRUD 邏輯
            // ==========================================
            const filteredProducts = useMemo(() => {
                return productMaster.filter(p => 
                    p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (p.supplier && p.supplier.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }, [productMaster, searchTerm]);

            const handleSaveProduct = () => {
                if (!editForm.name) return showToast(lang === 'zh' ? "品名不能為空" : "Product name is required");
                
                if (isEditing === 'new') {
                    setProductMaster([{ ...editForm, id: editForm.id || generateId() }, ...productMaster]);
                    showToast(lang === 'zh' ? "商品已新增" : "Product added");
                } else {
                    setProductMaster(productMaster.map(p => p.id === editForm.id ? editForm : p));
                    showToast(lang === 'zh' ? "商品已更新" : "Product updated");
                }
                setIsEditing(null);
            };

            const handleDeleteProduct = (id) => {
                setShowConfirm({
                    title: t.delete,
                    msg: t.confirmDelete,
                    onAction: () => {
                        setProductMaster(productMaster.filter(p => p.id !== id));
                        showToast(lang === 'zh' ? "商品已刪除" : "Product deleted");
                        setShowConfirm(null);
                    }
                });
            };

            const triggerEdit = (p) => {
                setIsEditing('edit');
                setEditForm(p);
            };

            const triggerNew = () => {
                setIsEditing('new');
                setEditForm({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            };

            // --- 數據備份與還原 ---
            const handleRestore = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data)) {
                            setProductMaster([...data, ...productMaster]);
                            showToast(lang === 'zh' ? "商品資料已匯入" : "Products imported");
                        }
                    } catch (err) { showToast("Error reading file"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // ⭐️ 頁面渲染
            // ==========================================
            if (printDoc) return <div className="p-20">Printing logic continues from v4.8...</div>;

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 確認對話框 */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="bg-white rounded-[3rem] p-10 max-w-lg w-full shadow-2xl animate-slide-in">
                                <h3 className="text-2xl font-black mb-4">{showConfirm.title}</h3>
                                <p className="text-slate-500 font-bold mb-10">{showConfirm.msg}</p>
                                <div className="flex gap-4">
                                    <button onClick={showConfirm.onAction} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black">{t.delete}</button>
                                    <button onClick={()=>setShowConfirm(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-2xl font-black">{t.cancel}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 編輯視窗 (Modal) */}
                    {isEditing && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[90] flex items-center justify-center p-6">
                            <div className="bg-white rounded-[4rem] p-12 max-w-2xl w-full shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-8 italic uppercase tracking-tighter">{isEditing === 'new' ? t.newProduct : t.editProduct}</h3>
                                <div className="grid grid-cols-2 gap-6 mb-10">
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.sku}</label><input type="text" value={editForm.id} onChange={e=>setEditForm({...editForm, id:e.target.value})} className="w-full px-6 py-4 rounded-2xl border font-mono" placeholder="Auto-gen if empty" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.brand}</label><input type="text" value={editForm.supplier} onChange={e=>setEditForm({...editForm, supplier:e.target.value})} className="w-full px-6 py-4 rounded-2xl border font-bold" /></div>
                                    <div className="col-span-2 space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.name}</label><input type="text" value={editForm.name} onChange={e=>setEditForm({...editForm, name:e.target.value})} className="w-full px-6 py-4 rounded-2xl border font-black text-lg" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.specs}</label><input type="text" value={editForm.specs} onChange={e=>setEditForm({...editForm, specs:e.target.value})} className="w-full px-6 py-4 rounded-2xl border font-medium" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.price}</label><input type="number" value={editForm.unitPrice} onChange={e=>setEditForm({...editForm, unitPrice:Number(e.target.value)})} className="w-full px-6 py-4 rounded-2xl border font-mono text-right font-black" /></div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={handleSaveProduct} className="flex-1 py-6 bg-indigo-600 text-white rounded-[2rem] font-black text-xl shadow-xl active:scale-95 transition-all">{t.save}</button>
                                    <button onClick={()=>setIsEditing(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-[2rem] font-black">{t.cancel}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col no-print z-20">
                        <div className="p-8 border-b border-slate-800 font-black text-2xl italic">SHENBAO <span className="text-[10px] bg-indigo-600 px-2 rounded ml-2">v4.9</span></div>
                        <nav className="flex-1 p-6 space-y-3">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={()=>setActiveTab(tab)} className={`w-full text-left px-6 py-4 rounded-[1.5rem] font-bold transition-all uppercase text-xs tracking-widest ${activeTab === tab ? 'bg-indigo-600 shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-slate-800 space-y-4">
                            {/* ⭐️ 語言切換按鈕 */}
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-3 bg-slate-800 rounded-xl font-black text-xs tracking-widest hover:bg-indigo-900 transition-colors">
                                <i className="ph ph-translate text-lg mr-2 inline-block align-middle"></i> {t.langToggle}
                            </button>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-emerald-500 rounded-full flex items-center justify-center font-black">莊</div>
                                <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 tracking-widest uppercase font-black">Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full overflow-y-auto custom-scrollbar p-10 bg-slate-50">
                        {toast && <div className="fixed top-10 right-10 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 font-bold animate-slide-in flex items-center gap-2"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-8 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.products}</h2>
                                        <p className="text-slate-400 text-[10px] font-black tracking-[0.3em] mt-1">PRODUCT LIFECYCLE MANAGEMENT</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={triggerNew} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition-all">+ {t.newProduct}</button>
                                        <div className="flex bg-white p-1 rounded-2xl shadow-sm border">
                                            <button onClick={()=>document.getElementById('pImport').click()} className="px-6 py-2 text-[10px] font-black text-slate-400 hover:text-indigo-600">{t.restore}</button>
                                            <input id="pImport" type="file" className="hidden" accept=".json" onChange={handleRestore} />
                                        </div>
                                    </div>
                                </div>

                                {/* ⭐️ 搜尋與工具列 */}
                                <div className="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 flex gap-6 items-center">
                                    <div className="flex-1 relative">
                                        <i className="ph ph-magnifying-glass absolute left-6 top-5 text-slate-300 text-xl"></i>
                                        <input 
                                            type="text" 
                                            value={searchTerm} 
                                            onChange={e=>setSearchTerm(e.target.value)}
                                            placeholder={t.searchPlaceholder} 
                                            className="w-full pl-16 pr-6 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:border-indigo-100 transition-all outline-none font-bold text-slate-700" 
                                        />
                                    </div>
                                    <div className="text-slate-400 font-bold text-xs uppercase tracking-widest">{filteredProducts.length} Results</div>
                                </div>

                                {/* 商品表格 */}
                                <div className="bg-white rounded-[3rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="p-8 text-[10px] font-black text-slate-400 uppercase tracking-widest w-[20%]">{t.sku} / {t.brand}</th>
                                                <th className="p-8 text-[10px] font-black text-slate-400 uppercase tracking-widest w-[40%]">{t.name}</th>
                                                <th className="p-8 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right w-[15%]">{t.price}</th>
                                                <th className="p-8 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center w-[15%]">{t.actions}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredProducts.map(p => (
                                                <tr key={p.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-1 text-sm">{p.supplier}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg">
                                                        <div className="truncate">{p.name}</div>
                                                        <div className="text-xs font-normal text-slate-400 mt-1 italic">{p.specs}</div>
                                                    </td>
                                                    <td className="p-8 text-right font-mono font-black text-xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-8 text-center space-x-2">
                                                        <button onClick={()=>triggerEdit(p)} className="p-3 bg-slate-100 rounded-xl hover:bg-indigo-100 text-slate-400 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-xl"></i></button>
                                                        <button onClick={()=>handleDeleteProduct(p.id)} className="p-3 bg-slate-100 rounded-xl hover:bg-red-100 text-slate-400 hover:text-red-600 transition-all"><i className="ph ph-trash text-xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {filteredProducts.length === 0 && (
                                        <div className="p-32 text-center text-slate-300 font-black italic text-2xl tracking-tighter uppercase">{t.noData}</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab !== 'products' && (
                            <div className="h-full flex items-center justify-center p-20 text-center">
                                <div className="space-y-4">
                                    <div className="text-8xl text-slate-100 font-black uppercase tracking-tighter">{activeTab}</div>
                                    <p className="text-slate-300 font-bold tracking-[1em] uppercase">Module Ready in v4.9 Global Logic</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
