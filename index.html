<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v6.1</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; border: 2px solid black !important; }
            th, td { border: 1px solid black !important; padding: 8px !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- Firebase 模組化導入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 全域配置
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shenbao-default';

        window.FB_TOOLS = { db, auth, appId, collection, doc, setDoc, deleteDoc, onSnapshot, query, signInAnonymously, signInWithCustomToken, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = (prefix = '') => prefix + Math.random().toString(36).substr(2, 6).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        function App() {
            // --- 狀態定義 ---
            const [user, setUser] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 雲端數據狀態 ---
            const [products, setProducts] = useState([]);
            const [quotes, setQuotes] = useState([]);
            const [orders, setOrders] = useState([]);
            const [logistics, setLogistics] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [inputInvoices, setInputInvoices] = useState([]);

            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // --- (1) 初始化 Firebase 驗證 (Rule 3) ---
            useEffect(() => {
                if (!window.FB_TOOLS) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FB_TOOLS;

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth failed", err); }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // --- (2) 監聽雲端數據同步 (Rule 1 & Rule 2) ---
            useEffect(() => {
                if (!user || !window.FB_TOOLS) return;
                const { db, appId, collection, onSnapshot } = window.FB_TOOLS;

                const syncCollection = (name, setter) => {
                    // 嚴格路徑：/artifacts/{appId}/public/data/{collectionName}
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', name);
                    return onSnapshot(colRef, (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                        setter(data);
                    }, (err) => console.error(`Sync error [${name}]:`, err));
                };

                const unsubP = syncCollection('products', setProducts);
                const unsubQ = syncCollection('quotes', setQuotes);
                const unsubO = syncCollection('orders', setOrders);
                const unsubL = syncCollection('logistics', setLogistics);
                const unsubI = syncCollection('invoices', setInvoices);
                const unsubInp = syncCollection('inputInvoices', setInputInvoices);

                return () => { unsubP(); unsubQ(); unsubO(); unsubL(); unsubI(); unsubInp(); };
            }, [user]);

            // --- 登入控制 ---
            const handleLogin = (e) => {
                e.preventDefault();
                if (loginForm.username === 'admin' && loginForm.password === '87739223') {
                    setIsLoggedIn(true);
                    setLoginError('');
                    triggerToast("雲端同步已就緒，歡迎回來");
                } else {
                    setLoginError('帳號或密碼錯誤');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setLoginForm({ username: '', password: '' });
                triggerToast("已安全登出並停止同步");
            };

            // ==========================================
            // ⭐️ 商品資料庫 CRUD (雲端版)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const handlePSave = async () => {
                if (!pForm.name || !window.FB_TOOLS) return;
                const { db, appId, doc, setDoc } = window.FB_TOOLS;
                const finalId = pForm.id || generateId('P');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', finalId);
                
                await setDoc(docRef, { ...pForm, id: finalId });
                setPEdit(null);
                triggerToast("雲端資料已儲存");
            };

            const handlePDelete = async (id) => {
                if (!window.FB_TOOLS) return;
                const { db, appId, doc, deleteDoc } = window.FB_TOOLS;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', id);
                await deleteDoc(docRef);
                triggerToast("已從雲端移除");
            };

            // ==========================================
            // ⭐️ 財務系統 (雲端寫入)
            // ==========================================
            const [invMode, setInvMode] = useState('銷項');
            const [invForm, setInvForm] = useState({ 
                category: '三聯式', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, date: getToday() 
            });

            const handleCreateInvoice = async () => {
                if (!invForm.client || invForm.totalAmount <= 0 || !window.FB_TOOLS) return;
                if (invForm.category === '三聯式' && !/^\d{8}$/.test(invForm.taxId)) return triggerToast("請輸入 8 碼統編");
                
                const { db, appId, doc, setDoc } = window.FB_TOOLS;
                const finalId = generateId('INV');
                const colName = invMode === '銷項' ? 'invoices' : 'inputInvoices';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, finalId);
                
                await setDoc(docRef, { ...invForm, id: finalId });
                setInvForm({ category: '三聯式', taxId: '', invNum: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, date: getToday() });
                triggerToast(`${invMode}紀錄已同步雲端`);
            };

            // ==========================================
            // ⭐️ 渲染邏輯
            // ==========================================
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen w-full flex items-center justify-center bg-slate-900 relative overflow-hidden font-sans">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-600/20 blur-[120px] rounded-full"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-600/10 blur-[120px] rounded-full"></div>
                        <div className="bg-white/95 backdrop-blur-xl p-16 rounded-[4rem] shadow-2xl w-full max-w-lg z-10 animate-fade-in">
                            <div className="text-center mb-12">
                                <h1 className="text-4xl font-black text-slate-900 italic tracking-tighter mb-2 italic uppercase">SHENBAO HUB</h1>
                                <p className="text-slate-400 font-bold uppercase tracking-[0.4em] text-[10px]">申堡營運管理中樞 v6.1 Cloud Sync</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-8">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">帳號</label>
                                    <input type="text" value={loginForm.username} onChange={e=>setLoginForm({...loginForm, username:e.target.value})} className="w-full px-8 py-5 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-[2rem] outline-none font-bold text-lg transition-all" required />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">密碼</label>
                                    <input type="password" value={loginForm.password} onChange={e=>setLoginForm({...loginForm, password:e.target.value})} className="w-full px-8 py-5 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-[2rem] outline-none font-bold text-lg transition-all" required />
                                </div>
                                {loginError && <div className="text-red-500 text-center font-bold">{loginError}</div>}
                                <button type="submit" className="w-full py-6 bg-indigo-600 text-white rounded-[2.5rem] font-black text-xl shadow-xl hover:bg-indigo-700 active:scale-95 transition-all">安全登入系統</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (printDoc) {
                // 列印邏輯維持不變...
                return <div className="p-10">列印模式準備中... <button onClick={()=>setPrintDoc(null)}>返回</button></div>;
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden relative font-sans">
                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 shadow-2xl">
                        <div className="p-10 border-b border-slate-800 flex items-center justify-between">
                            <h1 className="text-2xl font-black italic text-blue-400">SHENBAO <span className="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded ml-1 tracking-normal font-bold">Cloud</span></h1>
                            {user && <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" title="雲端連線中"></div>}
                        </div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${tab==='dashboard'?'ph-layout':tab==='products'?'ph-package':tab==='quotations'?'ph-file-text':tab==='orders'?'ph-shopping-cart':tab==='logistics'?'ph-truck':'ph-receipt'} mr-3 text-lg align-middle`}></i> {tab==='dashboard'?'營運儀表板':tab==='products'?'庫存資料庫':tab==='invoices'?'財務與稅務':'報價單系統'}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-red-500 hover:text-white transition-all"><i className="ph ph-power"></i> 安全登出</button>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/50 custom-scrollbar relative">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* 產品資料庫 (Cloud Sync) */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">商品資料庫</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Cloud Protected Inventory</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-10 py-5 rounded-3xl font-black shadow-xl hover:scale-105 transition-all">+ 新增雲端項目</button>
                                </div>
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100 shadow-indigo-100/20"><input type="text" placeholder="搜尋雲端 SKU 或品名..." value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full px-10 py-6 bg-slate-50 border-transparent rounded-[2rem] outline-none font-black text-2xl" /></div>
                                <div className="bg-white rounded-[4rem] border border-slate-100 shadow-xl overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50/80 border-b font-black text-slate-400 uppercase tracking-widest text-[11px]"><th className="p-10 w-48">編號 / 廠牌</th><th className="p-10">品名規格內容 (雲端同步)</th><th className="p-10 text-right w-64">建議單價</th><th className="p-10 text-center w-40">管理</th></thead>
                                        <tbody>
                                            {products.filter(p => p.name.includes(pSearch) || p.id.includes(pSearch)).map(p => (
                                                <tr key={p.id} className="border-b hover:bg-indigo-50/30 transition-all">
                                                    <td className="p-10 align-top">
                                                        <div className="inline-block px-3 py-1 bg-slate-100 text-slate-500 rounded-lg font-mono text-xs font-bold mb-2 uppercase">{p.id}</div>
                                                        <div className="text-indigo-600 font-black text-lg uppercase tracking-tight leading-none">{p.supplier || '一般'}</div>
                                                    </td>
                                                    <td className="p-10 align-top">
                                                        <div className="text-slate-900 font-bold text-xl leading-snug mb-1.5">{p.name}</div>
                                                        <div className="text-slate-600 font-medium text-base leading-relaxed bg-slate-50 p-3 rounded-2xl border border-slate-100 inline-block min-w-[200px]">{p.specs}</div>
                                                    </td>
                                                    <td className="p-10 text-right align-top">
                                                        <div className="font-mono font-black text-4xl text-emerald-700 tracking-tighter">${p.unitPrice?.toLocaleString()}</div>
                                                    </td>
                                                    <td className="p-10 text-center align-middle space-x-3">
                                                        <button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-5 bg-white border border-slate-100 text-slate-400 rounded-2xl hover:bg-indigo-600 hover:text-white transition-all"><i className="ph ph-pencil-simple text-2xl"></i></button>
                                                        <button onClick={()=>handlePDelete(p.id)} className="p-5 bg-white border border-slate-100 text-red-300 rounded-2xl hover:bg-red-500 hover:text-white transition-all"><i className="ph ph-trash text-2xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 財務與稅務 (Cloud Sync) */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-10 max-w-5xl mx-auto pb-40">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">雲端帳務管理</h2>
                                    <div className="flex bg-slate-200 p-2 rounded-3xl gap-2 font-black">
                                        <button onClick={()=>setInvMode('銷項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='銷項'?'bg-white text-indigo-600 shadow-md':'text-slate-500'}`}>銷項紀錄</button>
                                        <button onClick={()=>setInvMode('進項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='進項'?'bg-white text-red-600 shadow-md':'text-slate-500'}`}>進項支出</button>
                                    </div>
                                </div>
                                <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票類型</label><select value={invForm.category} onChange={e=>setInvForm({...invForm, category:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 bg-slate-50 font-black text-xl outline-none focus:bg-white shadow-inner"><option>三聯式</option><option>二聯式</option></select></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票號碼</label><input type="text" placeholder="AB-12345678" value={invForm.invNum} onChange={e=>setInvForm({...invForm, invNum:e.target.value.toUpperCase()})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-mono text-3xl font-black bg-slate-50 focus:bg-white shadow-inner" /></div>
                                        {invForm.category === '三聯式' && (
                                            <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-red-500 uppercase tracking-widest">統一編號 (必填 8 碼)</label><input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} className="w-full px-8 py-5 rounded-3xl border-4 border-red-50 font-mono text-4xl tracking-[0.5em] font-black bg-red-50/10 focus:bg-white outline-none shadow-inner" /></div>
                                        )}
                                        <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{invMode==='銷項'?'客戶買受人':'開立供應商'}</label><input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="w-full px-8 py-5 rounded-3xl border-4 border-slate-50 font-black text-2xl outline-none shadow-inner" /></div>
                                        <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">含稅總計</label><input type="number" value={invForm.totalAmount} onChange={e=>setInvForm({...invForm, totalAmount:Number(e.target.value), taxAmount:Math.round(Number(e.target.value)*0.05)})} className={`w-full px-8 py-5 rounded-3xl border-4 font-mono text-3xl font-black bg-white shadow-inner ${invMode==='銷項'?'border-emerald-100 text-emerald-600':'border-red-100 text-red-600'}`} /></div>
                                    </div>
                                    <button onClick={handleCreateInvoice} className={`w-full py-10 rounded-[3rem] font-black text-4xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-4 ${invMode==='銷項'?'bg-indigo-600 text-white shadow-indigo-200':'bg-red-600 text-white shadow-red-200'}`}><i className="ph ph-cloud-arrow-up"></i> 簽發並同步至雲端</button>
                                </div>
                            </div>
                        )}
                        
                        {/* 其他分頁維持結構... */}
                        {activeTab === 'dashboard' && <div className="p-20 text-center text-slate-400 font-bold animate-slide-in">儀表板雲端同步已就緒...</div>}
                    </main>

                    {/* 編輯產品彈窗 (雲端版) */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-10 text-indigo-600 italic uppercase">編輯雲端商品</h3>
                                <div className="space-y-6 mb-10">
                                    <div className="grid grid-cols-2 gap-4"><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">系統 SKU</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-mono" /></div><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">廠牌</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-8 py-4 rounded-2xl border-2 font-black" /></div></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">品名</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">規格</label><textarea rows="3" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-medium" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">單價</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-6 py-4 rounded-2xl border-2 text-right font-black text-4xl text-emerald-600" /></div>
                                </div>
                                <div className="flex gap-4"><button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl">確認同步</button><button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black">取消</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
