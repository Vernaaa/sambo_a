<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.1</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            .seal-only { display: block !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const i18n = {
            zh: {
                dashboard: "營運儀表板", products: "商品資料庫", quotations: "報價單系統", orders: "採購管理", logistics: "物流看板", invoices: "財務發票",
                search: "搜尋...", add: "新增", edit: "編輯", delete: "刪除", save: "儲存", cancel: "取消",
                sku: "編號", brand: "廠牌", name: "品名", specs: "規格", price: "單價", qty: "數量", total: "總計",
                taxId: "統一編號", client: "客戶對象", date: "日期", status: "狀態", actions: "操作",
                confirmDelete: "確定要刪除嗎？", backup: "數據備份", restore: "數據還原",
                langToggle: "English Mode", print: "列印單據", pushOrder: "拋轉採購",
                taxNet: "銷售額(未稅)", taxVal: "稅額(5%)", paid: "已付款", unpaid: "待結帳", type: "發票類型",
                systemTotal: "全系統數據包", aiProducts: "AI 商品資料", confirmRestore: "這將覆蓋現有數據，確定嗎？"
            },
            en: {
                dashboard: "Dashboard", products: "Inventory", quotations: "Quotes", orders: "Purchase", logistics: "Logistics", invoices: "Invoices",
                search: "Search...", add: "Add", edit: "Edit", delete: "Delete", save: "Save", cancel: "Cancel",
                sku: "SKU", brand: "Brand", name: "Product Name", specs: "Specs", price: "Price", qty: "Qty", total: "Total",
                taxId: "Tax ID", client: "Client", date: "Date", status: "Status", actions: "Actions",
                confirmDelete: "Confirm deletion?", backup: "Export", restore: "Restore",
                langToggle: "中文模式", print: "Print", pushOrder: "Push to PO",
                taxNet: "Net (Ex-tax)", taxVal: "Tax (5%)", paid: "Paid", unpaid: "Pending", type: "Invoice Type",
                systemTotal: "System Backup", aiProducts: "AI Products", confirmRestore: "This will overwrite existing data. Confirm?"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 ---
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('sb_p') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p', JSON.stringify(products));
                localStorage.setItem('sb_q', JSON.stringify(quotes));
                localStorage.setItem('sb_o', JSON.stringify(orders));
                localStorage.setItem('sb_l', JSON.stringify(logistics));
                localStorage.setItem('sb_i', JSON.stringify(invoices));
            }, [products, quotes, orders, logistics, invoices]);

            const t = i18n[lang];
            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // ==========================================
            // ⭐️ 全功能備援與恢復 (Restore & Backup)
            // ==========================================
            const exportData = () => {
                const data = { products, quotes, orders, logistics, invoices };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `Shenbao_Full_Backup_${getToday()}.json`; a.click();
                triggerToast("Backup Downloaded");
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        if (json.products && json.quotes) {
                            setConfirmBox({ msg: t.confirmRestore, action: () => {
                                setProducts(json.products || []); setQuotes(json.quotes || []); 
                                setOrders(json.orders || []); setLogistics(json.logistics || []); 
                                setInvoices(json.invoices || []);
                                setConfirmBox(null); triggerToast("Full System Restore Success");
                            }});
                        } else if (Array.isArray(json)) {
                            setProducts([...json, ...products]);
                            triggerToast("AI Product Data Merged");
                        }
                    } catch (err) { triggerToast("Invalid Data File"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // ⭐️ 商品維護模組 (CRUD)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const filteredP = products.filter(p => p.name.toLowerCase().includes(pSearch.toLowerCase()) || p.id.toLowerCase().includes(pSearch.toLowerCase()));

            const handlePSave = () => {
                if (!pForm.name) return triggerToast("Name required");
                if (pEdit === 'new') setProducts([{ ...pForm, id: pForm.id || `P-${generateId()}` }, ...products]);
                else setProducts(products.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); triggerToast("Inventory Database Updated");
            };

            // ==========================================
            // ⭐️ 報價單與自動拋轉物流流程
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ client: '', date: getToday(), items: [], total: 0 });
            const [selSku, setSelSku] = useState('');
            const [selQty, setSelQty] = useState(1);

            const handleAddQItem = () => {
                const p = products.find(x => x.id === selSku);
                if (!p) return;
                const newTotal = qForm.total + (p.unitPrice * selQty);
                setQForm({ ...qForm, items: [...qForm.items, { ...p, qty: selQty }], total: newTotal });
                setSelSku(''); setSelQty(1);
            };

            const saveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return triggerToast("Invalid Form");
                const newQ = { ...qForm, id: `Q-${generateId()}`, status: 'Confirmed' };
                setQuotes([newQ, ...quotes]);
                setQView('list'); triggerToast("Quote Saved & Locked");
            };

            const pushToOrderAndLogistics = (q) => {
                const poId = `PO-${generateId()}`;
                const ord = { ...q, id: poId, ref: q.id, status: 'Ordered' };
                setOrders([ord, ...orders]);
                // 物流初始化為「待配送」
                setLogistics([{ ...ord, status: '待配送', driverNote: '' }, ...logistics]);
                setQuotes(quotes.map(x => x.id === q.id ? { ...x, status: 'Pushed' } : x));
                triggerToast("Pushed to Purchase & Logistics");
            };

            // ==========================================
            // ⭐️ 財務發票校正模組 (Tax Calc + Types)
            // ==========================================
            const [invForm, setInvForm] = useState({ 
                type: '三聯式 (B2B)', taxId: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, status: '待結帳' 
            });

            const updateInvAmount = (val, field) => {
                let net = 0, tax = 0, total = 0;
                if (field === 'net') {
                    net = Number(val);
                    tax = Math.round(net * 0.05);
                    total = net + tax;
                } else if (field === 'total') {
                    total = Number(val);
                    net = Math.round(total / 1.05);
                    tax = total - net;
                }
                setInvForm({ ...invForm, netAmount: net, taxAmount: tax, totalAmount: total });
            };

            const createInvoice = () => {
                if (!invForm.client || invForm.totalAmount <= 0) return triggerToast("Incomplete Invoice Data");
                if (invForm.type === '三聯式 (B2B)' && invForm.taxId.length !== 8) return triggerToast("Invalid Tax ID (8 digits)");
                
                const newInv = { ...invForm, id: `INV-${generateId()}`, date: getToday() };
                setInvoices([newInv, ...invoices]);
                setInvForm({ type: '三聯式 (B2B)', taxId: '', client: '', netAmount: 0, taxAmount: 0, totalAmount: 0, status: '待結帳' });
                triggerToast("Financial Record Logged");
            };

            // ==========================================
            // ⭐️ 列印引擎 (Professional Report Output)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg">發送至印表機</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-8 py-3 rounded-2xl font-bold border">返回系統</button></div>
                        <h1 className="text-center text-5xl font-bold tracking-[0.8em] border-b-8 border-black pb-6 mb-8 uppercase italic">{printDoc.type === 'quote' ? '估價單' : '訂貨單'}</h1>
                        <div className="flex justify-between mb-10 text-2xl font-bold">
                            <div className="underline decoration-4 underline-offset-8">{d.client} 台照</div>
                            <div className="text-right leading-relaxed font-mono">日期：{d.date} <br/> 單號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-[3px] border-black text-center mb-10">
                            <thead className="bg-slate-50 border-b-[3px] border-black">
                                <tr className="text-xl">
                                    <th className="p-4 border-r-[2.5px] border-black w-1/2">品名規格項目</th>
                                    <th className="p-4 border-r-[2.5px] border-black w-24">數量</th>
                                    <th className="p-4 border-r-[2.5px] border-black w-40">單價</th>
                                    <th className="p-4 w-40">總計金額</th>
                                </tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="border-b-[1.5px] border-black text-xl h-16">
                                        <td className="p-4 border-r-[2.5px] border-black text-left font-black">{it.name} <span className="text-sm font-normal block text-slate-500 mt-1">{it.specs}</span></td>
                                        <td className="p-4 border-r-[2.5px] border-black font-mono">{it.qty}</td>
                                        <td className="p-4 border-r-[2.5px] border-black font-mono">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-4 font-mono font-bold">{(it.qty * it.unitPrice).toLocaleString()}</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 12 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="border-b border-black h-14"><td className="border-r-[2.5px] border-black"></td><td className="border-r-[2.5px] border-black"></td><td className="border-r-[2.5px] border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="flex justify-between items-end">
                            <div className="border-4 border-black p-6 rounded-3xl bg-slate-50 min-w-[450px]">
                                <div className="text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">Amount in Chinese</div>
                                <div className="text-3xl font-black tracking-widest leading-none">{numberToChinese(d.total)}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-sm font-black text-slate-400 mb-2 uppercase tracking-widest">Grand Total (TWD)</div>
                                <div className="text-6xl font-black font-mono tracking-tighter">NT$ {d.total?.toLocaleString()}</div>
                            </div>
                        </div>
                        <div className="mt-20 flex justify-end pr-10">
                            <div className="relative">
                                <img src="./因張good.png" className="w-56 h-auto opacity-90" style={{ mixBlendMode: 'multiply' }} />
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                    <div className="border-2 border-red-500/20 rounded-full w-40 h-40"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 確認視窗 */}
                    {confirmBox && (
                        <div className="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white p-12 rounded-[4rem] max-w-sm shadow-2xl animate-slide-in border-4 border-indigo-100 text-center">
                                <i className="ph ph-warning-circle text-6xl text-amber-500 mb-6 block"></i>
                                <p className="font-black text-slate-600 mb-10 text-xl leading-relaxed">{confirmBox.msg}</p>
                                <div className="flex gap-4">
                                    <button onClick={confirmBox.action} className="flex-1 bg-indigo-600 text-white py-5 rounded-3xl font-black shadow-xl active:scale-95 transition-all">確認執行</button>
                                    <button onClick={()=>setConfirmBox(null)} className="flex-1 bg-slate-100 text-slate-400 py-5 rounded-3xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 商品編輯視窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-2xl animate-slide-in border-2 border-indigo-50">
                                <h3 className="text-3xl font-black mb-10 italic uppercase tracking-tighter text-indigo-600">{pEdit === 'new' ? t.add : t.edit} {t.products}</h3>
                                <div className="space-y-6 mb-10">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">{t.sku}</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-mono text-lg focus:border-indigo-400 outline-none transition-all" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">{t.brand}</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black focus:border-indigo-400 outline-none transition-all" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">{t.name}</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 font-black text-xl focus:border-indigo-400 outline-none transition-all" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">{t.specs}</label><input type="text" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-6 py-4 rounded-2xl border-2 focus:border-indigo-400 outline-none transition-all" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">{t.price}</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-6 py-4 rounded-2xl border-2 text-right font-black text-3xl text-emerald-600 focus:border-indigo-400 outline-none transition-all" /></div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl hover:bg-indigo-700 transition-all">{t.save}</button>
                                    <button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 no-print shadow-2xl">
                        <div className="p-10 border-b border-slate-800"><h1 className="text-2xl font-black italic tracking-tighter uppercase leading-none">SHENBAO <span className="text-[10px] bg-indigo-600 px-2 py-0.5 rounded ml-1 font-bold">CORE v5.1</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {['dashboard', 'products', 'quotations', 'orders', 'logistics', 'invoices'].map(tab => (
                                <button key={tab} onClick={() => { setActiveTab(tab); setQView('list'); }} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${tab==='dashboard'?'ph-layout':tab==='products'?'ph-package':tab==='quotations'?'ph-file-text':tab==='orders'?'ph-shopping-cart':tab==='logistics'?'ph-truck':'ph-receipt'} mr-3 text-lg align-middle`}></i> {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800 space-y-4 bg-slate-950/40">
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-4 bg-slate-800 rounded-2xl text-[10px] font-black tracking-widest uppercase flex items-center justify-center gap-2 hover:bg-indigo-900 transition-all"><i className="ph ph-translate text-xl"></i> {t.langToggle}</button>
                            <div className="flex items-center gap-4 bg-white/5 p-4 rounded-3xl border border-white/5">
                                <div className="w-12 h-12 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black shadow-lg text-lg">莊</div>
                                <div><div className="text-sm font-black text-slate-200 tracking-tight">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase tracking-widest">Master Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/30 custom-scrollbar relative">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3 border border-white/10"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* 1. Dashboard - 數據樞紐 */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto space-y-16 py-10 text-center animate-slide-in">
                                <div className="space-y-4">
                                    <h1 className="text-7xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡營運管理中樞</h1>
                                    <p className="text-slate-400 font-black text-sm tracking-[0.6em] uppercase">Enterprise Resource Hub & Intelligence</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all cursor-default">
                                        <div className="text-7xl font-black text-indigo-600 mb-4 group-hover:scale-110 transition-transform">{products.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.products}</div>
                                    </div>
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all cursor-default">
                                        <div className="text-7xl font-black text-emerald-600 mb-4 group-hover:scale-110 transition-transform">{quotes.length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">{t.quotations}</div>
                                    </div>
                                    <div className="bg-white p-16 rounded-[4rem] border shadow-sm group hover:shadow-2xl transition-all cursor-default">
                                        <div className="text-7xl font-black text-red-600 mb-4 group-hover:scale-110 transition-transform">{logistics.filter(l=>l.status!=='已送達').length}</div>
                                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest">配送中任務</div>
                                    </div>
                                </div>
                                <div className="flex justify-center gap-6 pt-10">
                                    <button onClick={exportData} className="bg-slate-900 text-white px-12 py-6 rounded-[2.5rem] font-black shadow-xl hover:bg-black transition-all active:scale-95 flex items-center gap-3"><i className="ph ph-export text-xl"></i> {t.backup} (Full JSON)</button>

                                                    <td className="p-10 font-mono text-sm text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-2 text-base">{o.date}</div></td>
                                                    <td className="p-10 font-black text-slate-800 text-2xl truncate">{o.client}<div className="text-xs text-indigo-500 font-bold mt-2 uppercase">REF: {o.ref}</div></td>
                                                    <td className="p-10 text-right font-black text-amber-600 text-3xl">${o.total?.toLocaleString()}</td>
                                                    <td className="p-10 text-center"><button onClick={()=>setPrintDoc({type:'order', data:o})} className="p-5 bg-slate-50 text-amber-600 rounded-3xl hover:bg-amber-500 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-3xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {orders.length === 0 && <div className="p-40 text-center text-slate-200 font-black italic text-5xl uppercase tracking-tighter">No Purchase Records</div>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
