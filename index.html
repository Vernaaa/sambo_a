<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v7.0</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; border: 2px solid black !important; }
            th, td { border: 1px solid black !important; padding: 8px !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }

        .btn-primary { @apply bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all; }
        .input-standard { @apply w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-all font-bold; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 核心工具 ---
        const generateId = (prefix = '') => prefix + Math.random().toString(36).substr(2, 6).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        // 固定數據金鑰，確保不因版本號更新而流失資料
        const STORAGE_KEY = 'SHENBAO_V7_MASTER_DATA';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, showToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 全局狀態管理 ---
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {
                    products: [],
                    quotes: [],
                    orders: [],
                    invoices: [],
                    inputInvoices: [],
                    logistics: []
                };
            });

            // 自動存檔
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const triggerToast = (m) => { showToast(m); setTimeout(() => showToast(null), 3000); };

            // ==========================================
            // ⭐️ 系統管理 (備份/還原)
            // ==========================================
            const handleExport = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `申堡數據備份_${getToday()}.json`;
                a.click();
                triggerToast("備份檔已下載");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (imported.products) {
                            setData(imported);
                            triggerToast("系統資料已成功還原");
                        } else {
                            triggerToast("格式不符，請使用正確的備份檔");
                        }
                    } catch (err) { triggerToast("檔案解析失敗"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // ==========================================
            // ⭐️ 商品資料庫
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const handleProductSave = () => {
                if (!pForm.name) return triggerToast("請輸入品名");
                const newList = pEdit === 'new' 
                    ? [{ ...pForm, id: pForm.id || generateId('P') }, ...data.products]
                    : data.products.map(p => p.id === pForm.id ? pForm : p);
                
                setData({ ...data, products: newList });
                setPEdit(null);
                triggerToast("商品資料已儲存");
            };

            const handleProductDelete = (id) => {
                if (!window.confirm("確定要刪除此商品嗎？")) return;
                setData({ ...data, products: data.products.filter(p => p.id !== id) });
                triggerToast("商品已移除");
            };

            // ==========================================
            // ⭐️ 報價單系統
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ client: '', date: getToday(), items: [], total: 0 });
            const [qSelSku, setQSelSku] = useState('');
            const [qSelQty, setQSelQty] = useState(1);

            const handleAddQItem = () => {
                const p = data.products.find(x => x.id === qSelSku);
                if (!p) return;
                setQForm({ 
                    ...qForm, 
                    items: [...qForm.items, { ...p, qty: qSelQty }], 
                    total: qForm.total + (p.unitPrice * qSelQty) 
                });
                setQSelSku(''); setQSelQty(1);
            };

            const saveQuote = () => {
                if (!qForm.client || qForm.items.length === 0) return triggerToast("資料不完整");
                setData({ ...data, quotes: [{ ...qForm, id: generateId('Q') }, ...data.quotes] });
                setQView('list');
                triggerToast("報價單已存檔");
            };

            // ==========================================
            // ⭐️ 財務系統 (二三聯邏輯 & 號碼檢查)
            // ==========================================
            const [invMode, setInvMode] = useState('銷項'); 
            const [invForm, setInvForm] = useState({ 
                category: '三聯式', taxId: '', invNum: '', client: '', totalAmount: 0, date: getToday() 
            });

            const handleInvoiceSave = () => {
                if (!invForm.client || invForm.totalAmount <= 0) return triggerToast("請填寫完整資訊");
                
                // 1. 三聯式統編校驗
                if (invForm.category === '三聯式' && !/^\d{8}$/.test(invForm.taxId)) {
                    return triggerToast("三聯式發票必須輸入 8 位統一編號");
                }
                
                // 2. 發票號碼格式校驗
                const invPattern = /^[A-Z]{2}-\d{8}$/;
                if (invForm.invNum && !invPattern.test(invForm.invNum)) {
                    return triggerToast("發票號碼格式錯誤！範例：AB-12345678");
                }

                const col = invMode === '銷項' ? 'invoices' : 'inputInvoices';
                setData({ ...data, [col]: [{ ...invForm, id: generateId('INV') }, ...data[col]] });
                setInvForm({ category: '三聯式', taxId: '', invNum: '', client: '', totalAmount: 0, date: getToday() });
                triggerToast(`${invMode}發票紀錄已建立`);
            };

            // ==========================================
            // ⭐️ 列印引擎
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                const isPO = printDoc.type === 'order';
                return (
                    <div className="bg-white text-black min-h-screen p-12 font-serif print-container">
                        <div className="no-print mb-10 flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg">確認列印</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-100 px-8 py-2 rounded-xl font-bold border">取消</button></div>
                        <h1 className="text-center text-5xl font-bold tracking-[0.8em] border-b-8 border-black pb-6 mb-8 uppercase italic">{isPO ? '採購單' : '估價單'}</h1>
                        <div className="flex justify-between mb-8 text-2xl font-bold">
                            <div className="underline decoration-4 underline-offset-8 leading-loose">{d.client || d.supplier} 台照</div>
                            <div className="text-right font-mono text-lg">日期：{d.date} <br/> 單號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-[2px] border-black text-center">
                            <thead><tr className="bg-slate-50 font-black text-xl"><th className="p-4 border-r border-black">品名規格</th><th className="p-4 border-r border-black w-24">數量</th>{!isPO && <><th className="p-4 border-r border-black w-32">單價</th><th className="p-4 w-40">小計</th></>}</tr></thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="text-xl h-14 border-b border-black font-bold">
                                        <td className="p-4 border-r border-black text-left">{it.name} <div className="text-sm font-normal">{it.specs}</div></td>
                                        <td className="p-4 border-r border-black">{it.qty}</td>
                                        {!isPO && <><td className="p-4 border-r border-black text-right">{it.unitPrice?.toLocaleString()}</td><td className="p-4 text-right">{(it.qty * it.unitPrice).toLocaleString()}</td></>}
                                    </tr>
                                ))}
                            </tbody>
                            {!isPO && <tfoot><tr className="bg-slate-100 font-black text-2xl border-t-2 border-black"><td colSpan="3" className="p-6 border-r border-black text-left">總計：{numberToChinese(d.total)}</td><td className="p-6 text-right">${d.total?.toLocaleString()}</td></tr></tfoot>}
                        </table>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden relative">
                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col shrink-0 z-20 shadow-2xl">
                        <div className="p-10 border-b border-slate-800"><h1 className="text-2xl font-black italic text-blue-400">SHENBAO <span className="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded ml-1 tracking-normal font-bold">v7.0</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {[
                                { id: 'dashboard', name: '首頁儀表板', icon: 'ph-layout' },
                                { id: 'products', name: '商品資料庫', icon: 'ph-package' },
                                { id: 'quotations', name: '報價單系統', icon: 'ph-file-text' },
                                { id: 'invoices', name: '財務與稅務', icon: 'ph-receipt' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full text-left px-8 py-4 rounded-[2rem] font-bold transition-all text-xs tracking-widest uppercase ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className={`ph ${item.icon} mr-3 text-lg align-middle`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-8 border-t border-slate-800"><div className="flex items-center gap-4"><div className="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-black">莊</div><div><div className="text-sm font-bold leading-none">莊惠呅</div><div className="text-[10px] text-slate-500 font-bold mt-1 uppercase">Administrator</div></div></div></div>
                    </aside>

                    {/* 主顯示區 */}
                    <main className="flex-1 h-full overflow-y-auto p-12 bg-slate-50/50 custom-scrollbar relative">
                        {toast && <div className="fixed top-12 right-12 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl z-50 font-black animate-slide-in flex items-center gap-3 border border-white/10"><i className="ph ph-check-circle text-emerald-400 text-xl"></i> {toast}</div>}

                        {/* 1. 儀表板 */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto space-y-12 py-10 text-center animate-slide-in">
                                <h1 className="text-7xl font-black text-slate-900 italic tracking-tighter uppercase mb-2">申堡營運管理中樞</h1>
                                <p className="text-slate-400 font-black text-sm tracking-[0.4em] mb-12 uppercase">Data Ownership & Asset Protection</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-indigo-600 mb-2 font-mono">{data.products.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">商品品項總數</div></div>
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-emerald-600 mb-2 font-mono">{data.quotes.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">累計報價單</div></div>
                                    <div className="bg-white p-10 rounded-[3.5rem] border shadow-sm"><div className="text-6xl font-black text-amber-500 mb-2 font-mono">{data.invoices.length}</div><div className="text-xs font-black text-slate-400 tracking-widest uppercase">銷項發票數</div></div>
                                </div>

                                <div className="bg-slate-900 text-white p-16 rounded-[4rem] flex flex-col md:flex-row items-center justify-between gap-10 shadow-2xl">
                                    <div className="text-left"><h3 className="text-4xl font-black mb-2 flex items-center gap-4 italic uppercase"><i className="ph ph-shield-check text-blue-400"></i> 在地數據保險箱</h3><p className="text-slate-400 font-bold">為避免電腦故障或更換裝置，請定期下載備份存檔。</p></div>
                                    <div className="flex gap-4">
                                        <button onClick={handleExport} className="bg-indigo-600 px-10 py-5 rounded-[2rem] font-black hover:bg-indigo-700 transition shadow-lg flex items-center gap-2"><i className="ph ph-download-simple"></i> 下載備份</button>
                                        <button onClick={()=>document.getElementById('importFile').click()} className="bg-white text-slate-900 px-10 py-5 rounded-[2rem] font-black hover:bg-slate-100 transition shadow-lg flex items-center gap-2"><i className="ph ph-upload-simple"></i> 還原數據</button>
                                        <input id="importFile" type="file" className="hidden" onChange={handleImport} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. 商品資料庫 */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">商品資料庫</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.4em] mt-1 uppercase">Inventory Master Database</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="btn-primary">+ 新增產品品項</button>
                                </div>
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100"><input type="text" placeholder="搜尋 SKU 編號或品名關鍵字..." value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full px-10 py-6 bg-slate-50 border-transparent rounded-[2rem] outline-none font-black text-2xl" /></div>
                                <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[11px]"><th className="p-10 w-48">編號 / 廠牌</th><th className="p-10">品名規格內容 (可完整閱讀)</th><th className="p-10 text-right w-64">建議單價</th><th className="p-10 text-center w-48">管理操作</th></thead>
                                        <tbody>
                                            {data.products.filter(p => p.name.toLowerCase().includes(pSearch.toLowerCase()) || p.id.toLowerCase().includes(pSearch.toLowerCase())).map(p => (
                                                <tr key={p.id} className="border-b hover:bg-indigo-50/30 transition-all group">
                                                    <td className="p-10 align-top"><div className="px-3 py-1 bg-slate-100 text-slate-500 rounded-lg font-mono text-xs font-bold inline-block mb-1">{p.id}</div><div className="text-indigo-600 font-black text-lg uppercase leading-none">{p.supplier || '一般'}</div></td>
                                                    <td className="p-10 align-top"><div className="text-slate-900 font-bold text-2xl leading-snug mb-2">{p.name}</div><div className="text-slate-600 font-medium text-base leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100 whitespace-pre-wrap">{p.specs || '未填寫規格細節'}</div></td>
                                                    <td className="p-10 text-right align-top"><div className="font-mono font-black text-4xl text-emerald-700 tracking-tighter">${p.unitPrice?.toLocaleString()}</div></td>
                                                    <td className="p-10 text-center align-middle space-x-3"><button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-5 bg-white border border-slate-100 text-slate-400 rounded-2xl hover:bg-indigo-600 hover:text-white transition-all shadow-sm"><i className="ph ph-pencil-simple text-2xl"></i></button><button onClick={()=>handleProductDelete(p.id)} className="p-5 bg-white border border-slate-100 text-red-200 rounded-2xl hover:bg-red-500 hover:text-white transition-all shadow-sm"><i className="ph ph-trash text-2xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 3. 報價單系統 */}
                        {activeTab === 'quotations' && (
                            <div className="animate-slide-in space-y-10 max-w-7xl mx-auto pb-20">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">報價控制中樞</h2>
                                    {qView === 'list' && <button onClick={()=>{setQForm({client:'', date:getToday(), items:[], total:0}); setQView('create')}} className="btn-primary">+ 建立新報價單</button>}
                                </div>
                                {qView === 'create' ? (
                                    <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12 max-w-5xl mx-auto">
                                        <div className="grid grid-cols-2 gap-10">
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">客戶買受人抬頭</label><input type="text" value={qForm.client} onChange={e=>setQForm({...qForm, client:e.target.value})} className="input-standard" /></div>
                                            <div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">日期</label><input type="date" value={qForm.date} onChange={e=>setQForm({...qForm, date:e.target.value})} className="input-standard" /></div>
                                        </div>
                                        <div className="bg-slate-50 p-10 rounded-[4rem] border-4 border-dashed border-slate-200 flex gap-6 items-end">
                                            <div className="flex-1"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">選取產品</label><select value={qSelSku} onChange={e=>setQSelSku(e.target.value)} className="input-standard bg-white shadow-sm"><option value="">-- 請選取商品 --</option>{data.products.map(p => <option key={p.id} value={p.id}>[{p.supplier}] {p.name}</option>)}</select></div>
                                            <div className="w-32"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block text-center">數量</label><input type="number" value={qSelQty} onChange={e=>setQSelQty(Number(e.target.value))} className="input-standard text-center" /></div>
                                            <button onClick={handleAddQItem} className="bg-slate-900 text-white px-10 py-5 rounded-3xl font-black shadow-lg">加入明細</button>
                                        </div>
                                        <div className="space-y-4">{qForm.items.map((it, i) => (<div key={i} className="flex justify-between items-center p-8 bg-white border rounded-3xl font-black shadow-sm group"><span>{it.name}<span className="text-slate-400 font-normal text-sm ml-4 block mt-1">{it.specs}</span></span><span className="text-indigo-600 text-2xl">x{it.qty} / ${(it.qty * it.unitPrice).toLocaleString()}</span></div>))}</div>
                                        <div className="bg-slate-900 text-white p-14 rounded-[4rem] flex justify-between items-end relative overflow-hidden group">
                                            <div className="z-10">
                                                <div className="text-[10px] opacity-30 uppercase tracking-widest mb-2 font-black">中文大寫預覽</div>
                                                <div className="text-3xl font-black text-indigo-300">{numberToChinese(qForm.total)}</div>
                                            </div>
                                            <div className="text-right z-10"><div className="text-8xl font-black font-mono text-emerald-400 mb-8 tracking-tighter">${qForm.total.toLocaleString()}</div><div className="flex gap-4"><button onClick={saveQuote} className="bg-emerald-600 px-12 py-5 rounded-[2.5rem] font-black text-xl shadow-xl hover:bg-emerald-700 transition-all">確認儲存</button><button onClick={()=>setQView('list')} className="bg-white/10 px-12 py-5 rounded-[2.5rem] font-black text-xl hover:bg-white/20 transition-all">取消</button></div></div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">編號 / 日期</th><th className="p-10 w-1/2">買受人資訊</th><th className="p-10 text-right w-1/4">報價金額</th><th className="p-10 text-center w-40">列印</th></thead>
                                            <tbody>{data.quotes.map(q => (<tr key={q.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-10 font-mono text-sm text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-2 text-base">{q.date}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{q.client}</td><td className="p-10 text-right font-black text-indigo-600 text-3xl font-mono">${q.total?.toLocaleString()}</td><td className="p-10 text-center"><button onClick={()=>setPrintDoc({type:'quote', data:q})} className="p-5 bg-slate-50 text-indigo-600 rounded-3xl hover:bg-indigo-600 hover:text-white transition-all shadow-sm"><i className="ph ph-printer text-3xl"></i></button></td></tr>))}</tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4. 財務系統 */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-10 max-w-5xl mx-auto pb-40">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-5xl font-black text-slate-800 italic uppercase tracking-tighter">財務報表看板</h2>
                                    <div className="flex bg-slate-200 p-2 rounded-3xl gap-2 font-black shadow-inner">
                                        <button onClick={()=>setInvMode('銷項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='銷項'?'bg-white text-indigo-600 shadow-md':'text-slate-500'}`}>銷項紀錄</button>
                                        <button onClick={()=>setInvMode('進項')} className={`px-8 py-3 rounded-2xl transition-all ${invMode==='進項'?'bg-white text-red-600 shadow-md':'text-slate-500'}`}>進項支出</button>
                                    </div>
                                </div>
                                <div className="bg-white p-16 rounded-[5rem] shadow-sm border border-slate-100 space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票類型</label>
                                            <select value={invForm.category} onChange={e=>setInvForm({...invForm, category:e.target.value})} className="input-standard shadow-inner">
                                                <option>三聯式</option><option>二聯式</option><option>收據/領據</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">發票號碼 (範例：AB-12345678)</label>
                                            <input type="text" placeholder="大寫英文-8位數字" value={invForm.invNum} onChange={e=>setInvForm({...invForm, invNum:e.target.value.toUpperCase()})} className="input-standard font-mono text-3xl shadow-inner uppercase" />
                                        </div>
                                        {/* 三聯式才顯示統編欄位 */}
                                        {invForm.category === '三聯式' && (
                                            <div className="space-y-2 col-span-full animate-slide-in">
                                                <label className="text-[10px] font-black text-red-500 uppercase tracking-widest">統一編號 (必填 8 碼)</label>
                                                <input type="text" maxLength={8} value={invForm.taxId} onChange={e=>setInvForm({...invForm, taxId:e.target.value.replace(/\D/g,'')})} className="input-standard font-mono text-4xl tracking-[0.5em] bg-red-50/10 border-red-50 focus:bg-white shadow-inner" />
                                            </div>
                                        )}
                                        <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{invMode==='銷項'?'買受人名稱':'支出對象名稱'}</label><input type="text" value={invForm.client} onChange={e=>setInvForm({...invForm, client:e.target.value})} className="input-standard" /></div>
                                        <div className="space-y-2 col-span-full"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">含稅總計金額</label><input type="number" value={invForm.totalAmount} onChange={e=>setInvForm({...invForm, totalAmount:Number(e.target.value)})} className={`input-standard font-mono text-5xl ${invMode==='銷項'?'text-emerald-600 focus:border-emerald-500':'text-red-600 focus:border-red-500'}`} /></div>
                                    </div>
                                    <button onClick={handleInvoiceSave} className={`w-full py-10 rounded-[3rem] font-black text-4xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-4 ${invMode==='銷項'?'bg-indigo-600 text-white shadow-indigo-200':'bg-red-600 text-white shadow-red-200'}`}>存檔 {invMode}發票紀錄</button>
                                </div>
                                <div className="bg-white rounded-[4rem] border shadow-xl overflow-hidden">
                                    <h4 className="p-10 font-black text-slate-400 uppercase tracking-widest border-b bg-slate-50 text-xs">歷史紀錄 ({invMode})</h4>
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b font-black text-slate-400 uppercase tracking-widest text-[10px]"><th className="p-10 w-1/4">日期 / 統編</th><th className="p-10 w-1/2">對象資訊 / 號碼</th><th className="p-10 text-right w-1/4">帳項總額</th></thead>
                                        <tbody>{(invMode==='銷項'?data.invoices:data.inputInvoices).map(i => (<tr key={i.id} className="border-b hover:bg-slate-50 transition-colors"><td className="p-10 font-mono text-sm text-slate-400">{i.date}<div className="font-bold text-indigo-600 mt-2 text-base uppercase">{i.taxId || i.category}</div></td><td className="p-10 font-black text-slate-800 text-2xl truncate">{i.client}<div className="text-xs text-slate-400 font-mono mt-1 tracking-widest uppercase">{i.invNum || '無紀錄'}</div></td><td className="p-10 text-right font-black text-slate-800 text-3xl font-mono">${i.totalAmount?.toLocaleString()}</td></tr>))}</tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 商品編輯彈窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-2xl animate-slide-in">
                                <h3 className="text-3xl font-black mb-10 text-indigo-600 italic uppercase">編輯商品參數</h3>
                                <div className="space-y-6 mb-10 text-left">
                                    <div className="grid grid-cols-2 gap-4"><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">系統 SKU</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="input-standard py-3 font-mono" /></div><div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">供應廠牌</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="input-standard py-3" /></div></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">產品品名</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="input-standard py-3 text-xl" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">詳細規格</label><textarea rows="3" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="input-standard py-3 font-medium custom-scrollbar" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-30 uppercase">建議單價</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="input-standard py-3 text-right font-black text-4xl text-emerald-600" /></div>
                                </div>
                                <div className="flex gap-4"><button onClick={handleProductSave} className="flex-1 bg-indigo-600 text-white py-6 rounded-3xl font-black text-xl shadow-xl hover:bg-indigo-700">確認儲存</button><button onClick={()=>setPEdit(null)} className="px-10 py-6 bg-slate-100 text-slate-400 rounded-3xl font-black">取消</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
