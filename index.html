<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 - 旗艦整合版 v5.0</title>
    
    <!-- 核心套件導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-container { width: 210mm; margin: 0 auto !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
            .seal-only { display: block !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 核心公用工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9).toUpperCase();
        const getToday = () => new Date().toISOString().split('T')[0];
        const numberToChinese = (num) => {
            if (num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '', n = Math.floor(num);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };

        const i18n = {
            zh: {
                dashboard: "營運儀表板", products: "商品資料庫", quotations: "報價單系統", orders: "採購管理", logistics: "物流看板", invoices: "財務發票",
                search: "搜尋關鍵字...", add: "新增", edit: "編輯", delete: "刪除", save: "儲存儲存", cancel: "取消",
                sku: "編號", brand: "廠牌", name: "品名", specs: "規格", price: "單價", qty: "數量", total: "總計",
                taxId: "統一編號", client: "客戶對象", date: "日期", status: "狀態", actions: "操作",
                confirmDelete: "確定要刪除此筆資料嗎？此操作不可逆。", backup: "導出備份", restore: "還原數據",
                langToggle: "English Mode", sealTag: "簽章處", print: "列印單據", smartSplit: "執行智慧拆單"
            },
            en: {
                dashboard: "Dashboard", products: "Inventory", quotations: "Quotes", orders: "Purchase", logistics: "Logistics", invoices: "Invoices",
                search: "Search...", add: "Add", edit: "Edit", delete: "Delete", save: "Save", cancel: "Cancel",
                sku: "SKU", brand: "Brand", name: "Product Name", specs: "Specs", price: "Price", qty: "Qty", total: "Total",
                taxId: "Tax ID", client: "Client", date: "Date", status: "Status", actions: "Actions",
                confirmDelete: "Are you sure? This cannot be undone.", backup: "Export", restore: "Import",
                langToggle: "中文模式", sealTag: "Seal Only", print: "Print", smartSplit: "Smart Split"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);
            const [confirmBox, setConfirmBox] = useState(null);

            // --- 數據持久化 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('sb_p') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('sb_q') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('sb_o') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('sb_l') || '[]'));
            const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('sb_i') || '[]'));

            useEffect(() => {
                localStorage.setItem('sb_p', JSON.stringify(productMaster));
                localStorage.setItem('sb_q', JSON.stringify(quotes));
                localStorage.setItem('sb_o', JSON.stringify(orders));
                localStorage.setItem('sb_l', JSON.stringify(logistics));
                localStorage.setItem('sb_i', JSON.stringify(invoices));
            }, [productMaster, quotes, orders, logistics, invoices]);

            const t = i18n[lang];
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // ==========================================
            // ⭐️ 商品資料庫維護模組 (CRUD)
            // ==========================================
            const [pSearch, setPSearch] = useState('');
            const [pEdit, setPEdit] = useState(null);
            const [pForm, setPForm] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });

            const filteredP = productMaster.filter(p => 
                p.name.toLowerCase().includes(pSearch.toLowerCase()) || 
                p.id.toLowerCase().includes(pSearch.toLowerCase()) ||
                (p.supplier && p.supplier.toLowerCase().includes(pSearch.toLowerCase()))
            );

            const handlePSave = () => {
                if (!pForm.name) return showToast(lang === 'zh' ? "品名必填" : "Name required");
                if (pEdit === 'new') setProductMaster([{ ...pForm, id: pForm.id || `P-${generateId()}` }, ...productMaster]);
                else setProductMaster(productMaster.map(p => p.id === pForm.id ? pForm : p));
                setPEdit(null); showToast(lang === 'zh' ? "商品庫已更新" : "Inventory updated");
            };

            const handlePDelete = (id) => {
                setConfirmBox({
                    msg: t.confirmDelete,
                    action: () => { setProductMaster(productMaster.filter(p => p.id !== id)); setConfirmBox(null); showToast("Deleted"); }
                });
            };

            // ==========================================
            // ⭐️ 報價單與拋轉邏輯
            // ==========================================
            const [qView, setQView] = useState('list');
            const [qForm, setQForm] = useState({ id: '', client: '', date: getToday(), items: [], total: 0 });

            const handleQuoteToOrder = (quote) => {
                const poId = `PO-${generateId()}`;
                const newOrder = { ...quote, id: poId, refQuote: quote.id, status: '已採購' };
                setOrders([newOrder, ...orders]);
                setLogistics([{ ...newOrder, status: '待進貨' }, ...logistics]);
                setQuotes(quotes.map(q => q.id === quote.id ? { ...q, status: '已結案' } : q));
                showToast(lang === 'zh' ? "已拋轉至採購與物流" : "Pushed to PO & Logistics");
            };

            // ==========================================
            // ⭐️ 列印渲染 (保持印章模式)
            // ==========================================
            if (printDoc) {
                const d = printDoc.data;
                return (
                    <div className="bg-white text-black min-h-screen p-10 font-serif print-container">
                        <div className="no-print flex justify-between mb-10 bg-slate-100 p-4 rounded-xl">
                            <span className="font-bold">列印預覽模式 (A4)</span>
                            <div className="flex gap-2">
                                <button onClick={()=>window.print()} className="bg-indigo-600 text-white px-4 py-1 rounded">列印</button>
                                <button onClick={()=>setPrintDoc(null)} className="bg-white px-4 py-1 rounded border">關閉</button>
                            </div>
                        </div>
                        <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10">{printDoc.type === 'quote' ? '估價單' : '訂貨單'}</h1>
                        <div className="flex justify-between border-b-2 border-black pb-2 mb-4 font-bold">
                            <div>{d.client} 台照</div>
                            <div className="text-right">日期：{d.date} / 編號：{d.id}</div>
                        </div>
                        <table className="w-full border-collapse border-2 border-black text-center table-fixed">
                            <thead className="bg-slate-100 border-b-2 border-black">
                                <tr><th className="p-2 border-r border-black w-1/2">品名規格</th><th className="p-2 border-r border-black w-1/6">數量</th><th className="p-2 border-r border-black w-1/6">單價</th><th className="p-2 w-1/6">金額</th></tr>
                            </thead>
                            <tbody>
                                {d.items.map((it, i) => (
                                    <tr key={i} className="border-b border-black">
                                        <td className="p-2 border-r border-black text-left">{it.name} {it.specs}</td>
                                        <td className="p-2 border-r border-black">{it.qty}</td>
                                        <td className="p-2 border-r border-black">{it.unitPrice?.toLocaleString()}</td>
                                        <td className="p-2">{ (it.qty * it.unitPrice).toLocaleString() }</td>
                                    </tr>
                                ))}
                                {[...Array(Math.max(1, 8 - d.items.length))].map((_, i) => (
                                    <tr key={i} className="border-b border-black h-10"><td className="border-r border-black"></td><td className="border-r border-black"></td><td className="border-r border-black"></td><td></td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="mt-4 text-right text-xl font-bold">總計：NT$ {d.total?.toLocaleString()}</div>
                        <div className="flex justify-end mt-10 pr-10">
                            <img src="./因張good.png" className="w-40 h-auto" style={{ mixBlendMode: 'multiply' }} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {/* 確認視窗 */}
                    {confirmBox && (
                        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white p-8 rounded-[2rem] max-w-sm shadow-2xl animate-slide-in">
                                <p className="font-bold text-slate-600 mb-6">{confirmBox.msg}</p>
                                <div className="flex gap-2">
                                    <button onClick={confirmBox.action} className="flex-1 bg-red-600 text-white py-2 rounded-xl font-bold">確定</button>
                                    <button onClick={()=>setConfirmBox(null)} className="flex-1 bg-slate-100 py-2 rounded-xl font-bold">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 編輯模態窗 */}
                    {pEdit && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-[3rem] w-full max-w-lg shadow-2xl animate-slide-in">
                                <h3 className="text-2xl font-black mb-6">{pEdit === 'new' ? t.add : t.edit} {t.products}</h3>
                                <div className="space-y-4 mb-8">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.sku}</label><input type="text" value={pForm.id} onChange={e=>setPForm({...pForm, id:e.target.value})} className="w-full px-4 py-3 rounded-xl border font-mono" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.brand}</label><input type="text" value={pForm.supplier} onChange={e=>setPForm({...pForm, supplier:e.target.value})} className="w-full px-4 py-3 rounded-xl border font-bold" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.name}</label><input type="text" value={pForm.name} onChange={e=>setPForm({...pForm, name:e.target.value})} className="w-full px-4 py-3 rounded-xl border font-black" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.specs}</label><input type="text" value={pForm.specs} onChange={e=>setPForm({...pForm, specs:e.target.value})} className="w-full px-4 py-3 rounded-xl border" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.price}</label><input type="number" value={pForm.unitPrice} onChange={e=>setPForm({...pForm, unitPrice:Number(e.target.value)})} className="w-full px-4 py-3 rounded-xl border font-mono text-right" /></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handlePSave} className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">{t.save}</button>
                                    <button onClick={()=>setPEdit(null)} className="px-6 py-4 bg-slate-100 text-slate-400 rounded-2xl font-black">{t.cancel}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 側邊導覽 */}
                    <aside className="w-72 bg-slate-900 h-full text-white flex flex-col no-print shrink-0 z-20">
                        <div className="p-8 border-b border-slate-800"><h1 className="text-xl font-black italic tracking-tighter uppercase">申堡中樞 <span className="text-[10px] bg-indigo-600 px-2 rounded ml-1">v5.0</span></h1></div>
                        <nav className="flex-1 p-6 space-y-2 overflow-y-auto custom-scrollbar">
                            {Object.keys(i18n.zh).filter(k => i18n.zh[k] && typeof i18n.zh[k] === 'string' && k !== 'langToggle').slice(0, 6).map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`w-full text-left px-6 py-3.5 rounded-2xl font-bold transition-all text-xs tracking-widest uppercase ${activeTab === tab ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {t[tab]}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-slate-800 space-y-4">
                            <button onClick={()=>setLang(lang === 'zh' ? 'en' : 'zh')} className="w-full py-3 bg-slate-800 rounded-xl text-[10px] font-black tracking-widest uppercase"><i className="ph ph-translate mr-2"></i> {t.langToggle}</button>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center font-black">莊</div>
                                <div><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase">Master Admin</div></div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 h-full overflow-y-auto p-10 custom-scrollbar relative">
                        {toast && <div className="fixed top-10 right-10 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-50 font-bold animate-slide-in flex items-center gap-2"><i className="ph ph-check-circle text-emerald-400"></i> {toast}</div>}

                        {/* 商品資料庫分頁 */}
                        {activeTab === 'products' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.products}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">PRODUCT LIFECYCLE MANAGEMENT</p></div>
                                    <button onClick={()=>{setPForm({id:'', supplier:'', name:'', specs:'', unitPrice:0}); setPEdit('new')}} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition-all">+ {t.add}</button>
                                </div>
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="flex-1 relative"><i className="ph ph-magnifying-glass absolute left-6 top-4 text-slate-300"></i><input type="text" placeholder={t.search} value={pSearch} onChange={e=>setPSearch(e.target.value)} className="w-full pl-14 pr-6 py-3.5 bg-slate-50 border-transparent rounded-2xl focus:bg-white outline-none font-bold transition-all" /></div>
                                    <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">{filteredP.length} Items</div>
                                </div>
                                <div className="bg-white rounded-[3rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">{t.sku} / {t.brand}</th><th className="p-8 w-1/2">{t.name}</th><th className="p-8 text-right w-1/4">{t.price}</th><th className="p-8 text-center w-32">{t.actions}</th></tr></thead>
                                        <tbody>
                                            {filteredP.map(p => (
                                                <tr key={p.id} className="border-b hover:bg-slate-50 transition-colors group">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{p.id}<div className="text-indigo-600 font-black mt-1 uppercase text-sm">{p.supplier}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{p.name}<div className="text-xs font-normal text-slate-400 mt-1 italic">{p.specs}</div></td>
                                                    <td className="p-8 text-right font-mono font-black text-xl text-emerald-600">${p.unitPrice?.toLocaleString()}</td>
                                                    <td className="p-8 text-center space-x-2">
                                                        <button onClick={()=>{setPForm(p); setPEdit('edit')}} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-all"><i className="ph ph-pencil-simple text-xl"></i></button>
                                                        <button onClick={()=>handlePDelete(p.id)} className="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-red-50 hover:text-red-600 transition-all"><i className="ph ph-trash text-xl"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 報價單分頁 */}
                        {activeTab === 'quotations' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.quotations}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">CLIENT SALES PROCESS</p></div>
                                </div>
                                <div className="bg-white rounded-[3rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">{t.sku} / {t.date}</th><th className="p-8 w-1/2">{t.client}</th><th className="p-8 text-right w-1/4">{t.total}</th><th className="p-8 text-center w-48">{t.actions}</th></tr></thead>
                                        <tbody>
                                            {quotes.map(q => (
                                                <tr key={q.id} className="border-b hover:bg-slate-50">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{q.id}<div className="font-bold text-slate-800 mt-1">{q.date}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg">{q.client}</td>
                                                    <td className="p-8 text-right font-black text-indigo-600">${q.total?.toLocaleString()}</td>
                                                    <td className="p-8 text-center space-x-2">
                                                        <button onClick={()=>handlePrint('quote', q)} className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold border hover:bg-white transition-all">{t.print}</button>
                                                        <button onClick={()=>handleQuoteToOrder(q)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-lg hover:bg-indigo-700 transition-all">拋轉採購</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {quotes.length === 0 && <div className="p-20 text-center text-slate-300 italic uppercase font-black">Waiting for first quote data...</div>}
                                </div>
                            </div>
                        )}

                        {/* 物流看板分頁 */}
                        {activeTab === 'logistics' && (
                            <div className="animate-slide-in space-y-8">
                                <h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.logistics}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {logistics.map(l => (
                                        <div key={l.id} className="bg-white p-8 rounded-[3.5rem] border shadow-sm relative overflow-hidden group hover:shadow-2xl transition-all">
                                            <div className="absolute top-0 left-0 w-full h-2 bg-amber-400"></div>
                                            <div className="flex justify-between items-start mb-6">
                                                <div><div className="text-[10px] font-black text-slate-300 font-mono tracking-tighter">{l.id}</div><h3 className="text-xl font-black text-slate-800 mt-1">{l.client}</h3></div>
                                                <span className="px-3 py-1 bg-amber-50 text-amber-600 rounded-full text-[10px] font-black uppercase">{l.status}</span>
                                            </div>
                                            <div className="space-y-2 mb-8 bg-slate-50 p-6 rounded-[2.5rem] min-h-[120px]">
                                                {l.items.map((it, i) => (
                                                    <div key={i} className="flex justify-between text-xs font-bold border-b border-white pb-1"><span className="text-slate-500 truncate">{it.name}</span><span className="text-indigo-600 shrink-0">x{it.qty}</span></div>
                                                ))}
                                            </div>
                                            <button className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-xl flex items-center justify-center gap-2 hover:bg-indigo-700 transition-all active:scale-95"><i className="ph ph-truck"></i> 確認送達並簽收</button>
                                        </div>
                                    ))}
                                    {logistics.length === 0 && <div className="col-span-full p-20 text-center text-slate-300 italic font-black uppercase">No active delivery tasks.</div>}
                                </div>
                            </div>
                        )}

                        {/* 財務與發票分頁 */}
                        {activeTab === 'invoices' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.invoices}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">ACCOUNTING & TAX ID CONTROL</p></div>
                                </div>
                                <div className="bg-white p-10 rounded-[3rem] border shadow-sm space-y-10">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                        <div className="space-y-1"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.taxId} (三聯式必填)</label><input type="text" maxLength={8} placeholder="8位數字" className="w-full px-6 py-4 rounded-2xl border font-mono text-xl tracking-[0.2em] bg-indigo-50/30 outline-none focus:ring-4 focus:ring-indigo-100 transition-all" /></div>
                                        <div className="space-y-1 md:col-span-2"><label className="text-[10px] font-black opacity-40 uppercase tracking-widest">{t.client}</label><input type="text" className="w-full px-6 py-4 rounded-2xl border font-black text-lg outline-none focus:ring-4 focus:ring-indigo-100" /></div>
                                    </div>
                                    <div className="bg-slate-900 text-white p-10 rounded-[3rem] flex justify-between items-center">
                                        <div><div className="text-[10px] opacity-40 mb-1 tracking-widest uppercase">總額大寫</div><div className="text-xl font-bold">零元整</div></div>
                                        <div className="text-right">
                                            <div className="text-[10px] opacity-40 mb-2 tracking-widest uppercase">含稅總計</div>
                                            <div className="text-6xl font-black font-mono text-emerald-400">$0</div>
                                        </div>
                                    </div>
                                    <button className="w-full py-6 bg-emerald-600 text-white rounded-[2rem] font-black text-2xl shadow-xl hover:bg-emerald-700 active:scale-95 transition-all">確認開立發票帳項</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="p-20 text-center animate-slide-in space-y-10">
                                <h1 className="text-6xl font-black text-slate-900 italic tracking-tighter uppercase leading-none">申堡營運管理旗艦中樞</h1>
                                <div className="flex justify-center gap-4">
                                    <div className="bg-white p-10 rounded-[3rem] border w-64 shadow-sm"><div className="text-5xl font-black text-indigo-600 mb-2">{productMaster.length}</div><div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.products}</div></div>
                                    <div className="bg-white p-10 rounded-[3rem] border w-64 shadow-sm"><div className="text-5xl font-black text-emerald-600 mb-2">{quotes.length}</div><div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.quotations}</div></div>
                                    <div className="bg-white p-10 rounded-[3rem] border w-64 shadow-sm"><div className="text-5xl font-black text-red-600 mb-2">{logistics.length}</div><div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{t.logistics}</div></div>
                                </div>
                                <div className="max-w-xl mx-auto text-slate-400 font-bold text-lg leading-relaxed italic">"Integrated Operations. Absolute Reliability. Professional Results."</div>
                            </div>
                        )}
                        
                        {/* 採購管理 (演示邏輯) */}
                        {activeTab === 'orders' && (
                            <div className="animate-slide-in space-y-8">
                                <div className="flex justify-between items-end">
                                    <div><h2 className="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">{t.orders}</h2><p className="text-[10px] font-black text-slate-400 tracking-[0.3em] mt-1">SUPPLIER PROCUREMENT</p></div>
                                </div>
                                <div className="bg-white rounded-[3rem] border shadow-sm overflow-hidden border-slate-100">
                                    <table className="w-full text-left table-fixed">
                                        <thead className="bg-slate-50 border-b"><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest"><th className="p-8 w-1/4">PO 編號 / 日期</th><th className="p-8 w-1/2">對象 / 來源</th><th className="p-8 text-right w-1/4">單項總額</th><th className="p-8 text-center w-32">操作</th></tr></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50">
                                                    <td className="p-8 font-mono text-xs text-slate-400">{o.id}<div className="font-bold text-slate-800 mt-1">{o.date}</div></td>
                                                    <td className="p-8 font-black text-slate-800 text-lg truncate">{o.client}<div className="text-xs text-indigo-500 font-bold">來源：{o.refQuote}</div></td>
                                                    <td className="p-8 text-right font-black text-amber-600">${o.total?.toLocaleString()}</td>
                                                    <td className="p-8 text-center"><button onClick={()=>handlePrint('order', o)} className="p-3 bg-slate-50 rounded-xl hover:bg-amber-50 text-amber-600 transition-all"><i className="ph ph-printer text-xl"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {orders.length === 0 && <div className="p-20 text-center text-slate-300 italic uppercase font-black">No purchase orders yet.</div>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
