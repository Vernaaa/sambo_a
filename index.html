<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申堡營運中樞系統 MVP - 旗艦版 v3.5</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; max-width: 100%; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            @page { margin: 15mm; size: A4 portrait; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // --- 核心工具 ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const numberToChinese = (num) => {
            if (isNaN(num) || num == null || num === 0) return '零元整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['元', '萬', '億'], ['', '拾', '佰', '仟']];
            let s = '';
            let numInt = Math.floor(num);
            for (let i = 0; i < unit[0].length && numInt > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && numInt > 0; j++) { p = digit[numInt % 10] + unit[1][j] + p; numInt = Math.floor(numInt / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return (s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零') || '零元') + '整';
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const toTaiwanYear = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        };

        const companyInfo = {
            name: "申堡辦公家具行",
            taxId: "87739223",
            address: "澎湖縣馬公市西文里90-7號1樓",
            phone: "(06)9217228",
            fax: "(06)9216145"
        };

        function App() {
            // --- 核心狀態 ---
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [printDoc, setPrintDoc] = useState(null);

            // --- 資料庫 ---
            const [productMaster, setProductMaster] = useState(() => JSON.parse(localStorage.getItem('shenbao_products') || '[]'));
            const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('shenbao_quotes') || '[]'));
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('shenbao_orders') || '[]'));
            const [logistics, setLogistics] = useState(() => JSON.parse(localStorage.getItem('shenbao_logistics') || '[]'));

            // --- 商品資料庫狀態 ---
            const [productView, setProductView] = useState('list');
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProductData, setNewProductData] = useState({ id: '', supplier: '', name: '', specs: '', unitPrice: 0 });
            const [isIdLocked, setIsIdLocked] = useState(true);

            // --- 估價單狀態 ---
            const [quoteView, setQuoteView] = useState('list');
            const [editingQuoteId, setEditingQuoteId] = useState(null);
            const [newQuoteData, setNewQuoteData] = useState({ client: '', contactName: '', contactPhone: '', date: getToday(), items: [] });
            
            // --- 搜尋與輸入框狀態 ---
            const [quoteSearch, setQuoteSearch] = useState('');
            const [customSpec, setCustomSpec] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [qty, setQty] = useState(1);
            const [showDropdown, setShowDropdown] = useState(false);

            const filteredProducts = productMaster.filter(p => 
                (p.name || '').toLowerCase().includes(quoteSearch.toLowerCase()) || 
                (p.id || '').toLowerCase().includes(quoteSearch.toLowerCase())
            );

            // 數據同步
            useEffect(() => { localStorage.setItem('shenbao_products', JSON.stringify(productMaster)); }, [productMaster]);
            useEffect(() => { localStorage.setItem('shenbao_quotes', JSON.stringify(quotes)); }, [quotes]);
            useEffect(() => { localStorage.setItem('shenbao_orders', JSON.stringify(orders)); }, [orders]);
            useEffect(() => { localStorage.setItem('shenbao_logistics', JSON.stringify(logistics)); }, [logistics]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handlePrint = (type, data) => { setPrintDoc({ type, data }); setTimeout(() => window.print(), 300); };

            // ==========================================
            // 備份與還原
            // ==========================================
            const exportSystemData = () => {
                const backupData = { version: "3.5", timestamp: new Date().toISOString(), products: productMaster, quotes, orders, logistics };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `申堡中樞備份_${getToday().replace(/-/g,'')}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                showToast("備份成功！");
            };

            const importSystemData = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (window.confirm("確定還原？目前的資料將會被覆蓋。")) {
                            setProductMaster(imported.products || []);
                            setQuotes(imported.quotes || []);
                            setOrders(imported.orders || []);
                            setLogistics(imported.logistics || []);
                            showToast("還原成功！");
                        }
                    } catch (err) { showToast("無效的備份檔。"); }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // 報表列印引擎
            // ==========================================
            if (printDoc) {
                if (printDoc.type === 'quote') {
                    const q = printDoc.data;
                    const qTotal = (q.amount || 0);
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-serif print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-indigo-50 rounded-xl flex justify-between items-center border border-indigo-200">
                                <span className="font-bold text-indigo-800">估價單預覽模式</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">列印</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <h1 className="text-center text-4xl font-bold tracking-[1em] mb-10 ml-4">估價單</h1>
                            <div className="flex justify-between items-end mb-4 text-lg">
                                <div className="font-bold border-b border-black pb-1 min-w-[300px]">{q.client} 台照</div>
                                <div className="text-right tracking-tighter">聯絡人: {q.contactName || '未指定'} &nbsp; 電話: <span className="font-sans">{q.contactPhone || q.clientPhone}</span></div>
                            </div>
                            <div className="mb-6 text-lg tracking-wider font-bold">中華民國 <span className="mx-2">{toTaiwanYear(q.date)}</span></div>
                            <table className="w-full border-collapse border border-black text-center text-lg mb-4">
                                <thead className="bg-slate-100"><tr><th className="border border-black p-3 w-1/3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">單價</th><th className="border border-black p-3">金額</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(q.items || []).map((item, idx) => (
                                        <tr key={idx}><td className="border border-black p-3 text-left font-bold">{item.name}</td><td className="border border-black p-3">{item.specs}</td><td className="border border-black p-3">{item.qty} 個</td><td className="border border-black p-3">{(item.unitPrice || 0).toLocaleString()}</td><td className="border border-black p-3">{(item.qty * item.unitPrice).toLocaleString()}</td><td className="border border-black p-3"></td></tr>
                                    ))}
                                    <tr><td className="border border-black p-3 text-left">以下空白</td><td className="border border-black p-3"></td><td className="border border-black p-3"></td><td className="border border-black p-3"></td><td className="border border-black p-3"></td><td className="border border-black p-3"></td></tr>
                                    {[...Array(3)].map((_, i) => (<tr key={i}><td className="border border-black p-5" colSpan="6"></td></tr>))}
                                    <tr className="bg-slate-50"><td colSpan="4" className="border border-black p-3 text-left font-bold tracking-widest uppercase">總額新台幣 &nbsp;&nbsp; {numberToChinese(qTotal).split('').join(' ')}</td><td colSpan="2" className="border border-black p-3 text-left font-bold font-mono text-xl">NT$ {qTotal.toLocaleString()}</td></tr>
                                </tbody>
                            </table>
                            <div className="mt-8 flex justify-end pr-16"><img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} onError={(e)=>e.target.style.display='none'} /></div>
                        </div>
                    );
                } else if (printDoc.type === 'order') {
                    const o = printDoc.data;
                    return (
                        <div className="bg-white text-black min-h-screen p-10 font-sans print-container max-w-4xl mx-auto relative">
                            <div className="no-print mb-8 p-4 bg-amber-50 rounded-xl flex justify-between items-center border border-amber-200">
                                <span className="font-bold text-amber-800">訂貨明細單預覽</span>
                                <div className="flex gap-4"><button onClick={()=>window.print()} className="bg-amber-600 text-white px-6 py-2 rounded-lg font-bold">列印</button><button onClick={()=>setPrintDoc(null)} className="bg-slate-200 px-6 py-2 rounded-lg font-bold">返回</button></div>
                            </div>
                            <div className="flex justify-between items-start mb-6 border-b-2 border-black pb-6">
                                <div className="space-y-1"><h2 className="text-2xl font-black">{companyInfo.name}</h2><p>統編: {companyInfo.taxId}</p><p>店址: {companyInfo.address}</p><p>電話: {companyInfo.phone}</p></div>
                                <div className="text-right"><h1 className="text-4xl font-black tracking-widest mb-6 uppercase">訂貨明細單</h1><p>訂單編號: {o.id}</p><p>訂貨日期: {toTaiwanYear(o.date)}</p></div>
                            </div>
                            <div className="bg-slate-100 p-4 border border-black mb-6 font-bold text-lg">採購廠商：{o.supplier}</div>
                            <table className="w-full border-collapse border border-black text-center text-lg">
                                <thead className="bg-slate-200"><tr><th className="border border-black p-3">序號</th><th className="border border-black p-3">品名</th><th className="border border-black p-3">規格</th><th className="border border-black p-3">數量</th><th className="border border-black p-3">備註</th></tr></thead>
                                <tbody>
                                    {(o.items || []).map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="border border-black p-4 font-mono">{idx+1}</td>
                                            <td className="border border-black p-4 text-left font-bold">{item.name}</td>
                                            <td className="border border-black p-4">{item.specs}</td>
                                            <td className="border border-black p-4 font-bold">{item.qty}</td>
                                            {/* ⭐️ 備註顯示：可選 QuoteID 或 自定義內容 */}
                                            <td className="border border-black p-4 text-xs font-mono">{o.customRemark || `Ref: ${o.refQuote}`}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {/* ⭐️ 改版後更正式的頁尾簽章區 */}
                            <div className="mt-16 flex justify-between items-start">
                                <div className="w-1/3">
                                    <div className="border-b border-black pb-1 mb-2 font-bold text-sm">核章：</div>
                                    <div className="h-20 border border-slate-200 border-dashed rounded flex items-center justify-center text-xs text-slate-300">簽署處</div>
                                </div>
                                <div className="text-right pr-12 relative">
                                    <div className="mb-2 font-bold text-sm">申堡辦公家具行 負責人簽章</div>
                                    <img src="./因張good.png" className="w-48 h-auto" style={{ mixBlendMode: 'multiply' }} />
                                </div>
                            </div>
                        </div>
                    );
                }
            }

            // ==========================================
            // 功能處理
            // ==========================================
            const handleSaveProduct = () => {
                if(!newProductData.name) return showToast("品名必填");
                const price = Number(newProductData.unitPrice) || 0;
                if(editingProductId) {
                    setProductMaster(productMaster.map(p => p.id === editingProductId ? {...newProductData, unitPrice: price} : p));
                    showToast("商品已更新");
                } else {
                    const id = newProductData.id || `SKU-${Date.now().toString().slice(-5)}`;
                    if(productMaster.some(p => p.id === id)) return showToast("編號重複");
                    setProductMaster([{...newProductData, id, unitPrice: price}, ...productMaster]);
                    showToast("商品已建檔");
                }
                setProductView('list'); setEditingProductId(null); setIsIdLocked(true);
            };

            const generateOrdersFromQuotes = () => {
                const confirmed = quotes.filter(q => q.status === '已確認' && !orders.some(o => o.refQuote === q.id));
                if(!confirmed.length) return showToast("目前無可拋轉的確認單據");
                const newO = [...orders], newL = [...logistics];
                confirmed.forEach(q => {
                    const groups = {};
                    q.items.forEach(i => { const s = i.supplier || '未指定'; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
                    Object.keys(groups).forEach(sup => {
                        const poId = `PO-${getToday().replace(/-/g,'')}-${generateId().substring(0,4).toUpperCase()}`;
                        newO.push({
                            id: poId, date: getToday(), supplier: sup, 
                            refQuote: q.id, client: q.client, items: groups[sup],
                            customRemark: `估價單號: ${q.id}` // ⭐️ 預設備註改為估價單號
                        });
                        newL.push({id: `DO-${poId.split('-')[1]}`, client: q.client, refPo: poId, items: groups[sup], status: '待進貨'});
                    });
                });
                setOrders(newO); setLogistics(newL); showToast("智慧拋轉成功！");
            };

            // Layout
            const menuItems = [
                { id: 'dashboard', name: '首頁總覽', icon: 'ph-chart-pie' },
                { id: 'products', name: '商品庫存庫', icon: 'ph-database' },
                { id: 'quotations', name: '估價單系統', icon: 'ph-file-text' },
                { id: 'orders', name: '採購管理', icon: 'ph-shopping-cart' },
                { id: 'logistics', name: '出貨任務', icon: 'ph-truck' }
            ];

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden">
                    <aside className="hidden md:flex w-72 bg-slate-900 h-full text-white flex-col shadow-2xl z-20 no-print">
                        <div className="p-6 border-b border-slate-800"><h1 className="text-xl font-bold flex items-center gap-2">申堡中樞 <span className="text-[10px] bg-indigo-500/20 text-indigo-400 px-2 py-1 rounded">v3.5</span></h1></div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all font-bold ${activeTab === item.id && !printDoc ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/40' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    <i className={`ph ${item.icon} text-xl`}></i> {item.name}
                                </button>
                            ))}
                        </nav>
                        <div className="p-5 border-t border-slate-800 bg-slate-950/50 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-emerald-400 flex items-center justify-center font-bold shadow-inner">莊</div>
                            <div className="text-left"><div className="text-sm font-bold">莊惠呅</div><div className="text-[10px] text-slate-500 font-black uppercase">系統管理員</div></div>
                        </div>
                    </aside>

                    <main className="flex-1 h-full relative overflow-y-auto print-container">
                        {toast && <div className="fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl bg-slate-900 text-white border-l-4 border-emerald-500 z-[100] font-bold animate-slide-in">{toast}</div>}
                        
                        {!printDoc && activeTab === 'dashboard' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto no-print">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-black tracking-wider text-slate-800">營運全景儀表板</h2>
                                    <div className="flex gap-4">
                                        <button onClick={exportSystemData} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg active:scale-95 transition-transform"><i className="ph ph-download-simple"></i> 資料備份</button>
                                        <label className="bg-white text-slate-800 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-md border cursor-pointer hover:bg-slate-50 transition-colors">
                                            <i className="ph ph-upload-simple"></i> 還原備份
                                            <input type="file" className="hidden" accept=".json" onChange={importSystemData} />
                                        </label>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm border-l-4 border-l-blue-500">
                                        <p className="text-slate-400 text-xs font-black uppercase mb-1 tracking-widest">估價單總額</p>
                                        <h3 className="text-3xl font-black text-slate-800 font-mono">${quotes.reduce((s,q)=>s+(q.amount||0),0).toLocaleString()}</h3>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm border-l-4 border-l-amber-500">
                                        <p className="text-slate-400 text-xs font-black uppercase mb-1 tracking-widest">待處理任務</p>
                                        <h3 className="text-3xl font-black text-slate-800 font-mono">{logistics.filter(l=>l.status!=='已送達').length} <span className="text-sm">單</span></h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {!printDoc && activeTab === 'products' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto">
                                {productView === 'list' ? (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-2xl font-black tracking-wider">雲端商品主檔</h2>
                                            <button onClick={()=>{setProductView('create'); setEditingProductId(null); setIsIdLocked(false); setNewProductData({id:'', supplier:'', name:'', specs:'', unitPrice:0})}} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2"><i className="ph ph-plus"></i> 新增商品</button>
                                        </div>
                                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs text-slate-400 font-black">編號/供應商</th><th className="p-5 text-xs text-slate-400 font-black">品名規格</th><th className="p-5 text-xs text-slate-400 font-black text-right">單價</th><th className="p-5 text-xs text-slate-400 font-black text-center">操作</th></tr></thead>
                                                <tbody>
                                                    {productMaster.map(p => (
                                                        <tr key={p.id} className="border-b hover:bg-slate-50/80 transition-colors">
                                                            <td className="p-5 font-mono text-sm text-slate-500">{p.id}<div className="font-bold text-indigo-600 mt-1">{p.supplier}</div></td>
                                                            <td className="p-5 font-bold text-slate-800 text-lg">{p.name}<div className="text-sm font-normal text-slate-500 mt-1">{p.specs}</div></td>
                                                            <td className="p-5 text-right font-black text-emerald-600 font-mono text-lg">${(p.unitPrice||0).toLocaleString()}</td>
                                                            <td className="p-5 text-center"><button onClick={()=>{setEditingProductId(p.id); setNewProductData(p); setProductView('create')}} className="bg-slate-100 px-4 py-2 rounded-xl text-sm font-bold shadow-sm active:scale-95 transition-transform">編輯</button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                ) : (
                                    <div className="max-w-3xl mx-auto bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200 animate-slide-in">
                                        <h2 className="text-2xl font-black mb-8">{editingProductId ? '修改商品資訊' : '全新商品建檔'}</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">編號 (SKU)</label>
                                                <div className="flex gap-2"><input type="text" value={newProductData.id} onChange={(e)=>setNewProductData({...newProductData, id: e.target.value})} className={`flex-1 px-4 py-3 border rounded-xl font-mono ${isIdLocked ? 'bg-slate-50' : 'bg-white'}`} disabled={isIdLocked}/><button onClick={()=>setIsIdLocked(!isIdLocked)} className="px-3 bg-slate-100 rounded-xl text-xs font-bold">{isIdLocked ? '解鎖' : '鎖定'}</button></div>
                                            </div>
                                            <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">供應商</label><input type="text" value={newProductData.supplier} onChange={(e)=>setNewProductData({...newProductData, supplier: e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                            <div className="md:col-span-2"><label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">品名</label><input type="text" value={newProductData.name} onChange={(e)=>setNewProductData({...newProductData, name: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-bold" /></div>
                                            <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">規格</label><input type="text" value={newProductData.specs} onChange={(e)=>setNewProductData({...newProductData, specs: e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                            <div><label className="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">單價</label><input type="number" value={newProductData.unitPrice} onChange={(e)=>setNewProductData({...newProductData, unitPrice: e.target.value})} className="w-full px-4 py-3 border rounded-xl font-mono text-right" /></div>
                                        </div>
                                        <div className="mt-10 flex gap-4"><button onClick={handleSaveProduct} className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">儲存商品資料</button><button onClick={()=>setProductView('list')} className="px-8 bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold">取消</button></div>
                                    </div>
                                )}
                            </div>
                        )}

                        {!printDoc && activeTab === 'quotations' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto">
                                {quoteView === 'list' ? (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-2xl font-black tracking-wider">估價單管理中心</h2>
                                            <button onClick={()=>{setQuoteView('create'); setEditingQuoteId(null); setNewQuoteData({client:'', contactName:'', contactPhone:'', date:getToday(), items:[]})}} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2"><i className="ph ph-plus-circle"></i> 建立新估價</button>
                                        </div>
                                        <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs text-slate-400 font-black uppercase">編號/日期</th><th className="p-5 text-xs text-slate-400 font-black uppercase">客戶名稱</th><th className="p-5 text-xs text-slate-400 font-black text-right uppercase">金額</th><th className="p-5 text-xs text-slate-400 font-black text-center uppercase">操作</th></tr></thead>
                                                <tbody>
                                                    {quotes.map(q => (
                                                        <tr key={q.id} className="border-b hover:bg-slate-50/80 transition-colors">
                                                            <td className="p-5 font-mono text-sm">{q.id}<div className="text-xs font-normal text-slate-400 mt-1">{q.date}</div></td>
                                                            <td className="p-5 font-bold text-slate-800 text-lg">{q.client}<div className="text-xs font-normal text-slate-400 mt-1">{q.contactName} / {q.contactPhone}</div></td>
                                                            <td className="p-5 text-right font-black text-slate-700 font-mono text-lg">${(q.amount||0).toLocaleString()}</td>
                                                            <td className="p-5 text-center flex justify-center gap-2">
                                                                <button onClick={()=>handlePrint('quote', q)} className="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-100 hover:bg-indigo-100 transition-colors">列印</button>
                                                                {q.status !== '已確認' && <button onClick={()=>{setQuotes(quotes.map(x=>x.id===q.id?{...x, status:'已確認'}:x)); showToast("已標記確認")}} className="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">確認</button>}
                                                                <button onClick={()=>{setEditingQuoteId(q.id); setNewQuoteData(q); setQuoteView('create')}} className="bg-slate-100 p-2 rounded-xl"><i className="ph ph-pencil"></i></button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                ) : (
                                    <div className="animate-slide-in max-w-7xl mx-auto">
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-2xl font-black">{editingQuoteId ? '編輯估價單' : '新增估價發佈'}</h2>
                                            <button onClick={()=>setQuoteView('list')} className="bg-white px-6 py-2 rounded-xl font-bold shadow-sm">返回列表</button>
                                        </div>
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm mb-6">
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                                                <div className="md:col-span-1"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">客戶台照</label><input type="text" value={newQuoteData.client} onChange={(e)=>setNewQuoteData({...newQuoteData, client:e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                                <div className="md:col-span-1"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">聯絡人</label><input type="text" value={newQuoteData.contactName} onChange={(e)=>setNewQuoteData({...newQuoteData, contactName:e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                                <div className="md:col-span-1"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">電話 (限數字/-)</label><input type="tel" value={newQuoteData.contactPhone || ''} onChange={(e)=>setNewQuoteData({...newQuoteData, contactPhone:e.target.value.replace(/[^0-9\-]/g,'')})} className="w-full px-4 py-3 border rounded-xl font-mono" /></div>
                                                <div className="md:col-span-1"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">日期</label><input type="date" value={newQuoteData.date} onChange={(e)=>setNewQuoteData({...newQuoteData, date:e.target.value})} className="w-full px-4 py-3 border rounded-xl" /></div>
                                            </div>
                                            <div className="bg-slate-50 p-6 rounded-3xl border flex flex-wrap gap-4 items-end">
                                                <div className="flex-1 min-w-[250px] relative"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">商品快速搜尋</label><input type="text" value={quoteSearch} onChange={(e)=>{setQuoteSearch(e.target.value); setShowDropdown(true)}} onFocus={()=>setShowDropdown(true)} className="w-full px-4 py-3 border rounded-xl bg-white font-bold" />
                                                    {showDropdown && quoteSearch && (
                                                        <div className="absolute z-30 w-full mt-2 bg-white border rounded-2xl shadow-2xl max-h-48 overflow-y-auto">
                                                            {filteredProducts.map(p => (
                                                                <div key={p.id} className="p-4 hover:bg-indigo-50 cursor-pointer border-b flex justify-between" onClick={()=>{setQuoteSearch(p.name); setCustomSpec(p.specs); setCustomPrice(p.unitPrice); setShowDropdown(false)}}>
                                                                    <div className="font-bold">{p.name}</div><div className="font-mono text-emerald-600">${p.unitPrice}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="w-48"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">規格</label><input type="text" value={customSpec} onChange={(e)=>setCustomSpec(e.target.value)} className="w-full px-4 py-3 border rounded-xl" /></div>
                                                <div className="w-32"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">單價</label><input type="number" value={customPrice} onChange={(e)=>setCustomPrice(e.target.value)} className="w-full px-4 py-3 border rounded-xl text-right font-mono" /></div>
                                                <div className="w-24"><label className="block text-xs font-black text-slate-400 mb-2 uppercase">數量</label><input type="number" value={qty} onChange={(e)=>setQty(parseInt(e.target.value)||1)} className="w-full px-4 py-3 border rounded-xl text-center font-mono" /></div>
                                                <button onClick={()=>{setNewQuoteData({...newQuoteData, items:[...newQuoteData.items, {name:quoteSearch, specs:customSpec, unitPrice:Number(customPrice), qty:Number(qty)}]}); setQuoteSearch(''); setCustomSpec(''); setCustomPrice(''); setQty(1)}} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black shadow-lg">加入</button>
                                            </div>
                                        </div>
                                        {newQuoteData.items.length > 0 && (
                                            <div className="bg-white rounded-[2.5rem] shadow-xl border overflow-hidden">
                                                <table className="w-full text-left">
                                                    <thead className="bg-slate-50 border-b"><tr><th className="p-4 uppercase text-xs font-black text-slate-400">品名規格</th><th className="p-4 text-center text-xs font-black text-slate-400">數量</th><th className="p-4 text-right text-xs font-black text-slate-400">單價</th><th className="p-4 text-right text-xs font-black text-slate-400">合計</th><th className="p-4 text-center"></th></tr></thead>
                                                    <tbody>
                                                        {newQuoteData.items.map((it, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-slate-50"><td className="p-4 font-bold">{it.name}<div className="text-xs font-normal text-slate-400 mt-1">{it.specs}</div></td><td className="p-4 text-center font-mono">{it.qty}</td><td className="p-4 text-right font-mono">${it.unitPrice.toLocaleString()}</td><td className="p-4 text-right font-black text-indigo-600 font-mono">${(it.qty * it.unitPrice).toLocaleString()}</td><td className="p-4 text-center"><button onClick={()=>setNewQuoteData({...newQuoteData, items:newQuoteData.items.filter((_,i)=>i!==idx)})} className="text-red-400"><i className="ph ph-trash"></i></button></td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                                <div className="p-10 flex justify-between items-center bg-slate-50 border-t">
                                                    <div className="bg-white p-4 rounded-3xl border-l-8 border-l-emerald-500 font-black shadow-sm tracking-widest">{numberToChinese(newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0))}</div>
                                                    <div className="text-right"><div className="text-4xl font-black mb-6 font-mono">總計: ${newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0).toLocaleString()}</div><button onClick={()=>{const q={...newQuoteData, id: editingQuoteId || `Q-${getToday().replace(/-/g,'')}-${quotes.length+1}`, amount: newQuoteData.items.reduce((s,i)=>s+(i.qty*i.unitPrice),0)}; if(editingQuoteId) setQuotes(quotes.map(x=>x.id===editingQuoteId?q:x)); else setQuotes([q,...quotes]); setQuoteView('list'); showToast("存檔成功")}} className="bg-emerald-600 text-white px-10 py-5 rounded-[2rem] font-black shadow-2xl active:scale-95 transition-transform">發佈估價單並存檔</button></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {!printDoc && activeTab === 'orders' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-black tracking-wider">採購與訂貨管理</h2>
                                    <button onClick={generateOrdersFromQuotes} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl active:scale-95 transition-transform"><i className="ph ph-magic-wand"></i> 智慧拆單拋轉</button>
                                </div>
                                <div className="bg-white rounded-[2.5rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs font-black text-slate-400">採購單號</th><th className="p-5 text-xs font-black text-slate-400">供應商</th><th className="p-5 text-xs font-black text-slate-400">內部備註 (僅供自看)</th><th className="p-5 text-xs font-black text-slate-400 text-center">操作</th></tr></thead>
                                        <tbody>
                                            {orders.map(o => (
                                                <tr key={o.id} className="border-b hover:bg-slate-50/80 transition-colors">
                                                    <td className="p-5 font-mono font-bold text-slate-800">{o.id}<div className="text-xs font-normal text-slate-400 mt-1">{o.date}</div></td>
                                                    <td className="p-5 font-black text-indigo-700 text-lg">{o.supplier}</td>
                                                    <td className="p-5">
                                                        {/* ⭐️ 讓備註可以被編輯 */}
                                                        <input 
                                                            type="text" 
                                                            value={o.customRemark || ''} 
                                                            onChange={(e) => setOrders(orders.map(x => x.id === o.id ? {...x, customRemark: e.target.value} : x))}
                                                            className="w-full bg-slate-50 px-3 py-2 rounded-lg text-sm border border-transparent focus:border-indigo-300 focus:bg-white transition-all"
                                                            placeholder="點擊輸入備註 (如：報價單號/案名)..."
                                                        />
                                                    </td>
                                                    <td className="p-5 text-center flex justify-center gap-2">
                                                        <button onClick={()=>handlePrint('order', o)} className="bg-amber-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-amber-600/20">列印明細</button>
                                                        <button onClick={()=>{if(window.confirm("刪除此訂單？")) setOrders(orders.filter(x=>x.id!==o.id))}} className="text-red-400 px-3"><i className="ph ph-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {orders.length === 0 && <tr><td colSpan="4" className="p-16 text-center text-slate-400 font-bold tracking-widest">目前暫無採購任務</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {!printDoc && activeTab === 'logistics' && (
                            <div className="p-8 animate-slide-in max-w-7xl mx-auto">
                                <h2 className="text-2xl font-black mb-8 tracking-widest">出貨看板系統</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {logistics.map(t=>(
                                        <div key={t.id} className="bg-white p-8 rounded-[2.5rem] border shadow-sm relative group overflow-hidden">
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${t.status==='待進貨'?'bg-amber-400':'bg-emerald-500'}`}></div>
                                            <div className="flex justify-between items-start mb-6">
                                                <div><div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">{t.id}</div><h3 className="text-xl font-black text-slate-800 mt-1">{t.client}</h3></div>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                                                {t.items.map((it,i)=>(<div key={i} className="flex justify-between text-sm mb-1 last:mb-0"><span className="text-slate-600 font-bold truncate pr-4">{it.name}</span><span className="font-black text-indigo-600">x{it.qty}</span></div>))}
                                            </div>
                                            {t.status !== '已送達' ? (
                                                <button onClick={()=>{setLogistics(logistics.map(x=>x.id===t.id?{...x, status:t.status==='待進貨'?'配送中':'已送達'}:x)); showToast("進度更新成功")}} className={`w-full py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all ${t.status==='待進貨'?'bg-indigo-600 text-white shadow-indigo-600/20':'bg-emerald-600 text-white shadow-emerald-600/20'}`}>{t.status==='待進貨'?'理貨完成，準備配送':'確認送達並簽收'}</button>
                                            ) : (
                                                <div className="w-full py-4 bg-emerald-50 text-emerald-700 rounded-2xl font-black text-center flex items-center justify-center gap-2 border border-emerald-200"><i className="ph-fill ph-check-circle"></i> 出貨任務已完成</div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 行動版導覽 */}
                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 no-print">
                        {menuItems.map(item => (
                            <button key={item.id} onClick={() => { setActiveTab(item.id); setPrintDoc(null); }} className={`flex flex-col items-center p-2 rounded-2xl ${activeTab === item.id && !printDoc ? 'text-indigo-600 bg-indigo-50' : 'text-slate-400'}`}>
                                <i className={`ph ${activeTab === item.id && !printDoc ? 'ph-fill' : ''} ${item.icon} text-2xl`}></i>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
